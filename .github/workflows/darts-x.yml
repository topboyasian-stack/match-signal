name: Match Signal Darts-X

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/darts_pipeline.py'
      - 'darts-app.js'
      - 'functions/api/sportybet-darts.js'
      - '.github/workflows/darts-x.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: match-signal-darts-x
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Syntax-check Darts-X
        run: python -m py_compile scripts/darts_pipeline.py

      - name: Run isolated Darts-X research pipeline
        run: python scripts/darts_pipeline.py

      - name: Validate Darts-X artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'data/darts_history.json',
              'data/darts_upcoming.json',
              'data/darts_model.json',
              'data/darts_candidates.json',
              'data/darts_status.json',
          ]
          for name in required:
              data=json.loads(Path(name).read_text(encoding='utf-8'))
              print(name, 'OK')
          status=json.loads(Path('data/darts_status.json').read_text(encoding='utf-8'))
          assert status.get('sport') == 'darts'
          assert status.get('model_status') in {'PROMOTED','TESTING','COLLECTING'}
          print('Darts-X status:', status.get('model_status'), 'history=', status.get('history_events'), 'upcoming=', status.get('upcoming_events'))
          PY

      - name: Publish Darts-X artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/darts_history.json data/darts_upcoming.json data/darts_model.json data/darts_candidates.json data/darts_status.json
          if git diff --cached --quiet; then
            echo "No Darts-X artifact changes."
            exit 0
          fi
          git commit -m "🤖 Refresh Darts-X research engine"
          for attempt in 1 2 3 4; do
            if git push origin main; then
              GH_TOKEN="${{ github.token }}" gh workflow run cloudflare-pages.yml --ref main
              echo "Darts-X publication succeeded."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/darts_pipeline.py
            git add data/darts_history.json data/darts_upcoming.json data/darts_model.json data/darts_candidates.json data/darts_status.json
            git diff --cached --quiet && exit 0
            git commit -m "🤖 Refresh Darts-X research engine"
          done
          echo "Darts-X publication failed after retries." >&2
          exit 1
