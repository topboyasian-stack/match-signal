name: Match Signal Darts-X Research Engine
on:
  push:
    branches: [main]
    paths:
      - 'scripts/darts_pipeline.py'
      - 'darts.html'
      - 'darts-app.js'
      - 'darts.css'
      - '.github/workflows/darts-x.yml'
  schedule:
    - cron: '11,31,51 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: match-signal-darts-x-data
  cancel-in-progress: false
jobs:
  darts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Darts-X dependency
        run: python -m pip install --upgrade requests
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Syntax-check Darts-X
        run: python -m py_compile scripts/darts_pipeline.py
      - name: Run Darts-X collector and walk-forward gate
        run: python scripts/darts_pipeline.py
      - name: Validate Darts-X artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['darts_history.json','darts_upcoming.json','darts_model.json','darts_candidates.json','darts_status.json']:
              p=Path('data')/name
              assert p.exists() and p.stat().st_size, name+' missing'
              json.loads(p.read_text())
          print('Darts-X artifacts valid')
          PY
      - name: Publish Darts-X research artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/darts_history.json data/darts_upcoming.json data/darts_model.json data/darts_candidates.json data/darts_status.json
          if git diff --cached --quiet; then echo "No Darts-X changes."; exit 0; fi
          git commit -m "🏹 Refresh Darts-X research engine"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
