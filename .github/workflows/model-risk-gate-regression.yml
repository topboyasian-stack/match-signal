name: Model risk gate active-scope regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/model_guard.py'
      - 'scripts/test_model_guard_active_scope.py'
      - '.github/workflows/model-risk-gate-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/model_guard.py'
      - 'scripts/test_model_guard_active_scope.py'
      - '.github/workflows/model-risk-gate-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile model-risk guard and run evidence-scope regressions
        run: |
          python -m py_compile scripts/model_guard.py scripts/test_model_guard_active_scope.py
          python scripts/test_model_guard_active_scope.py
