name: Match Signal Football Statistical History

on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/independent_football_model.py'
      - 'scripts/build_football_team_history.py'
      - 'scripts/football_model_council.py'
      - '.github/workflows/football-statistical-history.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: match-signal-football-statistical-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade requests

      - name: Compile Football statistical modules
        run: |
          python -m py_compile             scripts/independent_football_model.py             scripts/build_football_team_history.py             scripts/football_model_council.py

      - name: Refresh 365-day settled Football team history
        run: python scripts/build_football_team_history.py

      - name: Build walk-forward Football model council
        run: python scripts/football_model_council.py

      - name: Validate research-only policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path('data/football_team_history.json').read_text())
          council = json.loads(Path('data/football_model_council.json').read_text())
          assert isinstance(history, list)
          assert council.get('mode') == 'PAPER_RESEARCH_ONLY'
          assert council.get('production_pick_unchanged') is True
          assert council.get('builder_eligibility_unchanged') is True
          print('Football statistical layer policy: PASS')
          print(json.dumps(council.get('overall'), indent=2))
          PY

      - name: Publish research artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_team_history.json data/football_model_council.json
          if git diff --cached --quiet; then
            echo "Football statistical history already current."
            exit 0
          fi
          git commit -m "🤖 Refresh Football statistical history and model council"
          for attempt in 1 2 3; do
            if git push origin main; then
              GH_TOKEN="${{ github.token }}" gh workflow run cloudflare-pages.yml --ref main
              echo "Football statistical history publication succeeded."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_football_team_history.py
            python scripts/football_model_council.py
            git add data/football_team_history.json data/football_model_council.json
            if git diff --cached --quiet; then
              echo "Latest main already contains the Football statistical artifacts."
              exit 0
            fi
            git commit -m "🤖 Refresh Football statistical history and model council"
            sleep $((attempt * 2))
          done
          exit 1
