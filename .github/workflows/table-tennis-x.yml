name: Match Signal Table Tennis-X Research Engine
on:
  push:
    branches: [main]
    paths:
      - 'scripts/table_tennis_pipeline.py'
      - 'table-tennis.html'
      - 'table-tennis-app.js'
      - 'table-tennis.css'
      - '.github/workflows/table-tennis-x.yml'
  schedule:
    - cron: '17,37,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: match-signal-table-tennis-x-data
  cancel-in-progress: false
jobs:
  table-tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Table Tennis-X dependency
        run: python -m pip install --upgrade requests
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Syntax-check Table Tennis-X
        run: python -m py_compile scripts/table_tennis_pipeline.py
      - name: Run Table Tennis-X collector and walk-forward gate
        run: python scripts/table_tennis_pipeline.py
      - name: Validate Table Tennis-X artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['table_tennis_history.json','table_tennis_upcoming.json','table_tennis_model.json','table_tennis_candidates.json','table_tennis_status.json']:
              p=Path('data')/name
              assert p.exists() and p.stat().st_size, name+' missing'
              json.loads(p.read_text())
          print('Table Tennis-X artifacts valid')
          PY
      - name: Publish Table Tennis-X research artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/table_tennis_history.json data/table_tennis_upcoming.json data/table_tennis_model.json data/table_tennis_candidates.json data/table_tennis_status.json
          if git diff --cached --quiet; then echo "No Table Tennis-X changes."; exit 0; fi
          git commit -m "🏓 Refresh Table Tennis-X research engine"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
