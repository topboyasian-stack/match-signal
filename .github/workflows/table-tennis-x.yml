name: Match Signal Table Tennis-X

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/table_tennis_pipeline.py'
      - 'table-tennis-app.js'
      - 'functions/api/sportybet-table-tennis.js'
      - '.github/workflows/table-tennis-x.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-table-tennis-x
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Syntax-check Table Tennis-X
        run: python -m py_compile scripts/table_tennis_pipeline.py

      - name: Run isolated Table Tennis-X research pipeline
        run: python scripts/table_tennis_pipeline.py

      - name: Validate Table Tennis-X artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'data/table_tennis_history.json',
              'data/table_tennis_pending.json',
              'data/table_tennis_upcoming.json',
              'data/table_tennis_model.json',
              'data/table_tennis_candidates.json',
              'data/table_tennis_status.json',
          ]
          for name in required:
              data=json.loads(Path(name).read_text(encoding='utf-8'))
              print(name, 'OK')
          status=json.loads(Path('data/table_tennis_status.json').read_text(encoding='utf-8'))
          assert status.get('sport') == 'table_tennis'
          assert status.get('model_status') in {'PROMOTED','TESTING','COLLECTING'}
          print('Table Tennis-X status:', status.get('model_status'), 'history=', status.get('history_events'), 'upcoming=', status.get('upcoming_events'))
          PY

      - name: Publish Table Tennis-X artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/table_tennis_history.json data/table_tennis_pending.json data/table_tennis_upcoming.json data/table_tennis_model.json data/table_tennis_candidates.json data/table_tennis_status.json
          if git diff --cached --quiet; then
            echo "No Table Tennis-X artifact changes."
            exit 0
          fi
          git commit -m "🤖 Refresh Table Tennis-X research engine"
          for attempt in 1 2 3 4; do
            if git push origin main; then
              echo "Table Tennis-X publication succeeded."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/table_tennis_pipeline.py
            git add data/table_tennis_history.json data/table_tennis_pending.json data/table_tennis_upcoming.json data/table_tennis_model.json data/table_tennis_candidates.json data/table_tennis_status.json
            git diff --cached --quiet && exit 0
            git commit -m "🤖 Refresh Table Tennis-X research engine"
          done
          echo "Table Tennis-X publication failed after retries." >&2
          exit 1
