name: Match Signal Core Refresh

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/predict_today.py'
      - 'scripts/run_pipeline.py'
      - 'scripts/scoped_pipeline.py'
      - 'scripts/production_pipeline.py'
      - 'scripts/autopilot_guard.py'
      - 'live.html'
      - '.github/workflows/autopilot-refresh.yml'
      - '.github/workflows/core-refresh.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-core-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile production Python modules
        run: python -m py_compile scripts/predict_today.py scripts/run_pipeline.py scripts/scoped_pipeline.py scripts/production_pipeline.py scripts/autopilot_guard.py

      - name: Preserve independent live experimental league slices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = Path('data/predictions.json')
          rows = json.loads(feed.read_text()) if feed.exists() else []
          preserved = {
              'Eredivisie': [r for r in rows if r.get('league') == 'Eredivisie'],
              'Saudi Pro League': [r for r in rows if r.get('league') == 'Saudi Pro League'],
          }
          Path('/tmp/preserved_live_leagues.json').write_text(json.dumps(preserved))
          print({k: len(v) for k, v in preserved.items()})
          PY

      - name: Refresh current football + ATP/WTA predictions transactionally
        run: python scripts/scoped_pipeline.py

      - name: Restore live experimental league slices after core refresh
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = Path('data/predictions.json')
          rows = json.loads(feed.read_text()) if feed.exists() else []
          preserved = json.loads(Path('/tmp/preserved_live_leagues.json').read_text())
          protected = set(preserved)
          rows = [r for r in rows if r.get('league') not in protected]
          for league_rows in preserved.values():
              rows.extend(league_rows)
          rows.sort(key=lambda r: str(r.get('start_time') or ''))
          feed.write_text(json.dumps(rows, indent=2, ensure_ascii=False))
          print('Restored protected live leagues:', {k: len(v) for k, v in preserved.items()})
          PY

      - name: Run autonomous freshness and source coverage guard
        run: python scripts/autopilot_guard.py

      - name: Publish refreshed production data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_history.json data/accuracy.json data/pipeline_status.json data/autopilot_status.json
          if git diff --cached --quiet; then
            echo "Autopilot checked the feed; no data changes were required."
            exit 0
          fi
          git commit -m "🤖 Autopilot refresh current predictions"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Autopilot publication succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Concurrent main update detected; refreshing and retrying (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort 2>/dev/null || true
              echo "Rebase conflict; a later scheduled run will safely retry."
              exit 1
            }
            sleep $((attempt * 3))
          done
          exit 1
