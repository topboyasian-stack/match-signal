name: Match Signal Tennis Model V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tennis_model_v2.py'
      - 'scripts/tennis_ou_v3.py'
      - 'scripts/selective_prediction_gate.py'
      - 'scripts/selection_candidate_collector.py'
      - 'scripts/test_selection_gate_contract.py'
      - 'scripts/predict_today.py'
      - 'qa/prediction_qa.py'
      - '.github/workflows/tennis_model_v2.yml'
      - 'data/tennis_prediction_archive.json'
      - 'data/tennis_performance.json'
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tennis_model_v2.py'
      - 'scripts/test_tennis_model_prequential.py'
      - '.github/workflows/tennis_model_v2.yml'
      - '.github/workflows/tennis-model-prequential-regression.yml'

permissions:
  contents: write

concurrency:
  # Keep this model's run serialization separate; publish uses a retry/rebuild if main advances.
  group: match-signal-data-publish
  cancel-in-progress: false

jobs:
  prequential-regression:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile and run ATP chronological regressions
        run: |
          python -m py_compile scripts/tennis_model_v2.py scripts/test_tennis_model_prequential.py
          python scripts/test_tennis_model_prequential.py
      - name: Execute ATP prequential evaluation against committed historical archive
        run: |
          python scripts/tennis_model_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/tennis_model_v2.json').read_text())
          result=report['prequential_walkforward']
          assert report['active_scope']=='ATP'
          assert result['active_scope']=='ATP'
          assert result['raw_base_model']['n']==report['training_records']
          assert result['prequential_model']['n']==report['training_records']
          assert report['status']=='PAPER_RESEARCH_ONLY'
          print(json.dumps({
            'active_scope':report['active_scope'],
            'training_records':report['training_records'],
            'prequential_model':result['prequential_model'],
            'raw_base_model':result['raw_base_model'],
            'brier_improved':result['brier_improved'],
            'candidate_weight':report['weight_selection']['current_candidate_weight'],
            'effective_weight':report['weight_selection']['effective_weight'],
            'effective_weight_reason':report['weight_selection']['effective_weight_reason'],
            'precision_gate':report['precision_gate']
          },indent=2))
          PY

  improve-tennis-model:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tennis model dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests
      - name: Run walk-forward tennis model V2
        run: python scripts/tennis_model_v2.py
      - name: Replace flat tennis O/U calibration with fixture-specific V4
        run: python scripts/tennis_ou_v3.py
      - name: Validate predictions JSON
        run: python -m json.tool data/predictions.json >/dev/null
      - name: Run prediction QA
        run: python qa/prediction_qa.py
      - name: Refresh model-first selection candidates after model upgrade
        run: python scripts/selection_candidate_collector.py
      - name: Apply conservative confidence and current value gate
        run: PYTHONPATH=. python scripts/selective_prediction_gate.py
      - name: Validate selection-gate output isolation
        run: python scripts/test_selection_gate_contract.py --require-generated-artifacts
      - name: Refresh prediction breakdown
        run: PYTHONPATH=. python scripts/prediction_breakdown.py
      - name: Commit model V2 artifacts with concurrency-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/predictions.json data/tennis_model_v2.json data/tennis_precision_gate.json data/tennis_ou_v3.json data/selection_candidates.json data/selection_candidate_status.json data/selection_gate.json data/selection_gate_selected.json data/prediction_breakdown.json qa/report.json
            if git diff --cached --quiet; then
              echo "No tennis model V2 changes."
              exit 0
            fi
            git commit -m "🎾 Apply walk-forward tennis V2 and precision gate"
            if git push origin main; then
              echo "Tennis model V2 artifact publication succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Tennis model V2 could not publish after three attempts."
              exit 1
            fi
            echo "Concurrent main update detected; refreshing inputs and regenerating output (attempt ${attempt})."
            git fetch origin main
            git reset --hard origin/main
            python scripts/tennis_model_v2.py
            python scripts/tennis_ou_v3.py
            python -m json.tool data/predictions.json >/dev/null
            python qa/prediction_qa.py
            python scripts/selection_candidate_collector.py
            PYTHONPATH=. python scripts/selective_prediction_gate.py
            python scripts/test_selection_gate_contract.py --require-generated-artifacts
            PYTHONPATH=. python scripts/prediction_breakdown.py
            sleep $((attempt * 2))
          done
          exit 1
