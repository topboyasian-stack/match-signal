name: Match Signal Odds Builder

on:
  push:
    branches: [main]
    paths:
      - 'data/selection_candidates.json'
      - 'data/predictions.json'
      - 'scripts/odds_builder.py'
      - 'expansion-odds-builder.js'
      - '.github/workflows/odds_builder.yml'
  workflow_run:
    workflows: ["Match Signal Tennis Model V2"]
    types: [completed]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-odds-builder
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run manual accumulator builder
        run: python scripts/odds_builder.py
      - name: Validate accumulator JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/odds_builder.json').read_text())
          assert data.get('mode') == 'PAPER_ONLY'
          assert set(data.get('sports_supported', [])) >= {'football', 'tennis'}
          assert isinstance(data.get('qualified_legs'), list)
          assert len(data['qualified_legs']) <= 4
          if data['qualified_legs']:
              assert len(data['qualified_legs']) >= 3
          for leg in data['qualified_legs']:
              assert leg.get('sport') in {'football', 'tennis'}
              assert float(leg.get('model_probability', 0)) >= 0.65
              assert float(leg.get('model_fair_odds', 0)) > 1
          if data.get('reference_combined_odds') is not None:
              assert data['reference_combined_odds'] > 1
          print('Accumulator QA:', json.dumps({
              'status': data.get('status'),
              'legs': len(data['qualified_legs']),
              'sports': sorted({x.get('sport') for x in data['qualified_legs']}),
              'candidates': data.get('candidates_considered'),
              'reference_combined_odds': data.get('reference_combined_odds')
          }))
          PY
      - name: Commit generated accumulator artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_builder.json
          if git diff --cached --quiet; then
            echo "No accumulator changes."
            exit 0
          fi
          git commit -m "🤖 Refresh manual accumulator"
          git push origin main
