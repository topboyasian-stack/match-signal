name: Match Signal Odds Builder

on:
  push:
    branches: [main]
    paths:
      - 'data/selection_candidates.json'
      - 'data/predictions.json'
      - 'data/selection_gate.json'
      - 'data/risk_gate.json'
      - 'data/sportybet_odds_snapshot.json'
      - 'data/unified_upcoming.json'
      - 'data/predictions.json'
      - 'scripts/odds_builder.py'
      - 'scripts/tennis_total_model.py'
      - 'scripts/tennis_total_research.py'
      - 'expansion-odds-builder.js'
      - 'data/sportybet_odds_snapshot.json'
      - '.github/workflows/odds_builder.yml'
  workflow_run:
    workflows:
      - "Match Signal Tennis Model V2"
      - "Match Signal Live Expansion"
      - "Match Signal Autopilot Refresh"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal Result Settlement"
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Virtual Lab Live Sync"
    types: [completed]
  schedule:
    # Refresh research diagnostics and builder every 15 minutes.
    # Virtual paper-builder validation: variable-leg 4.00+ target.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-odds-builder
  # A newer Builder run must replace an older network-stalled run.
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tennis total challenger research
        run: python scripts/tennis_total_research.py
      - name: Validate tennis research artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/tennis_total_research.json').read_text())
          assert d.get('mode') == 'PAPER_RESEARCH_ONLY'
          assert str(d.get('activation_gate','')).startswith('HOLD')
          print('Tennis total research holdout:', json.dumps(d.get('holdout',{})))
          PY
      - name: Run daily mixed accumulator builder
        run: python scripts/odds_builder.py
      - name: Validate V6 market-calibrated accumulator JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/odds_builder.json').read_text())
          assert data.get('mode') == 'PAPER_ONLY'
          assert data.get('engine_version') == 'V6.1-RESEARCH-GATED'
          policy = data.get('selection_policy', {})
          assert policy.get('requires_live_sportybet_price') is True
          assert float(policy.get('min_model_edge', 0)) >= 0.025
          assert set(data.get('sports_supported', [])) >= {'football', 'tennis', 'virtual'}
          assert isinstance(data.get('qualified_legs'), list)
          assert len(data['qualified_legs']) <= 20
          if data['qualified_legs']:
              assert float(data.get('market_price_combined_odds', 0)) >= 4.0
          if data.get('status') == 'UPSTREAM_RESEARCH_GATE_BLOCKED':
              assert not data['qualified_legs']
          for leg in data['qualified_legs']:
              assert leg.get('sport') in {'football', 'tennis', 'virtual'}
              assert float(leg.get('model_probability', 0)) >= (0.65 if leg.get('sport') == 'virtual' else 0.60)
              assert float(leg.get('model_fair_odds', 0)) > 1
              assert leg.get('real_money_eligible') is False
              assert leg.get('paper_only') is True
              assert leg.get('bookmaker_odds') is not None
              assert float(leg.get('model_edge', 0)) >= 0.025
          sports = {x.get('sport') for x in data['qualified_legs']}
          if data.get('candidates_considered', {}).get('football', 0) > 0:
              assert 'football' in sports or len(data['qualified_legs']) < 3
          if data.get('market_price_combined_odds') is not None:
              assert data['market_price_combined_odds'] > 1
          if data.get('status') == 'BELOW_4_TARGET_AVAILABLE':
              assert data.get('best_available_legs')
          batches = data.get('batches', [])
          assert isinstance(batches, list)
          assert int(data.get('batch_count', len(batches))) == len(batches)
          seen_batch_ids = set()
          seen_event_ids = set()
          for batch in batches:
              assert batch.get('batch_id') not in seen_batch_ids
              seen_batch_ids.add(batch.get('batch_id'))
              assert float(batch.get('combined_odds', 0)) >= 4.0
              assert batch.get('paper_only') is True
              assert batch.get('real_money_execution') is False
              assert float(batch.get('combined_model_rating', 0)) >= 0
              leg_ids = [str(x.get('event_id')) for x in batch.get('legs', [])]
              assert len(leg_ids) == len(set(leg_ids)), 'duplicate event inside batch'
              assert not (seen_event_ids & set(leg_ids)), 'batches must be disjoint'
              seen_event_ids.update(leg_ids)
          if batches:
              ratings = [float(x.get('combined_model_rating', 0)) for x in batches]
              assert ratings == sorted(ratings, reverse=True)
          print('V6 Accumulator QA:', json.dumps({
              'status': data.get('status'),
              'legs': len(data['qualified_legs']),
              'sports': sorted(sports),
              'candidates': data.get('candidates_considered'),
              'reference_combined_odds': data.get('reference_combined_odds'),
              'batches': data.get('batch_count', 0),
              'top_model_rating': (data.get('batches') or [{}])[0].get('combined_model_rating') if data.get('batches') else None
          }))
          PY
      - name: Commit generated accumulator artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_builder.json data/tennis_total_research.json
          if git diff --cached --quiet; then
            echo "No accumulator changes."
            exit 0
          fi
          git commit -m "🤖 Refresh research-gated Odds Builder"
          # Cloudflare verification may commit while this build is running.
          # Rebase once on the latest main so the generated artifact is not lost.
          if ! git pull --rebase origin main; then
            echo "Rebase conflict detected; generated builder artifacts win over concurrent refresh artifacts."
            git rebase --abort || true
            git fetch origin main
            git reset --soft origin/main
            git add data/odds_builder.json data/tennis_total_research.json
            git commit -m "🤖 Refresh research-gated Odds Builder"
          fi
          git push origin main
