name: Match Signal Odds Builder

# 2026-10-01: rebuild after restored full engine + 12h value lane

on:
  push:
    branches: [main]
    paths:
      - 'data/selection_candidates.json'
      - 'data/predictions.json'
      - 'data/selection_gate.json'
      - 'data/risk_gate.json'
      - 'data/sportybet_odds_snapshot.json'
      - 'data/unified_upcoming.json'
      - 'data/predictions.json'
      - 'scripts/odds_builder.py'
      - 'scripts/predict_today.py'
      - 'scripts/tennis_total_model.py'
      - 'scripts/tennis_total_research.py'
      - 'scripts/results_first_evidence_report.py'
      - 'scripts/odds_ticket_tracker.py'
      - 'data/odds_ticket_tracker.json'
      - 'expansion-odds-builder.js'
      - 'data/sportybet_odds_snapshot.json'
      - '.github/workflows/odds_builder.yml'
  workflow_run:
    workflows:
      - "Match Signal Tennis Model V2"
      - "Match Signal Live Expansion"
      - "Match Signal Autopilot Refresh"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal Result Settlement"
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Virtual Lab Live Sync"
    types: [completed]
  schedule:
    # Refresh research diagnostics and full-market discovery builder every 15 minutes.
    # Virtual paper-builder validation: 2.70+ base floor; the earned 2.80 hard gate activates after the configured settled-win threshold; 4.00+ remains stretch.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-odds-builder
  # A newer Builder run must replace an older network-stalled run.
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --upgrade requests
      - name: Run tennis total challenger research
        run: python scripts/tennis_total_research.py
      - name: Validate tennis research artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/tennis_total_research.json').read_text())
          assert d.get('mode') == 'PAPER_RESEARCH_ONLY'
          assert str(d.get('activation_gate','')).startswith('HOLD')
          print('Tennis total research holdout:', json.dumps(d.get('holdout',{})))
          PY
      - name: Run daily mixed accumulator builder
        run: python scripts/odds_builder.py
      - name: Generate settled line evidence report
        run: python scripts/results_first_evidence_report.py
      - name: Validate V6 market-calibrated accumulator JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/odds_builder.json').read_text())
          assert data.get('mode') == 'PAPER_ONLY'
          assert data.get('engine_version') == 'V6.1-RESEARCH-GATED'
          policy = data.get('selection_policy', {})
          assert policy.get('requires_live_sportybet_price') is True
          assert policy.get('results_first') is True
          assert policy.get('construction_priority') == 'settled_results_first'
          assert float(policy.get('minimum_combined_odds', 0)) >= 2.70
          assert float(policy.get('results_first_min_expected_roi', 0)) >= 0.02
          assert float(policy.get('min_model_edge', 0)) >= 0.025
          assert set(data.get('sports_supported', [])) >= {'football', 'tennis', 'virtual'}
          assert isinstance(data.get('qualified_legs'), list)
          if data.get('status') == 'RESULTS_FIRST_SET':
              assert len(data['qualified_legs']) >= 2
              assert int(data.get('batch_count', 0)) == 1
              assert int(data.get('batch_policy', {}).get('results_first_max_legs', 4)) <= 4
          assert len(data['qualified_legs']) <= 20
          if data['qualified_legs']:
              assert float(data.get('market_price_combined_odds', 0)) >= float(policy.get('minimum_combined_odds', 1.0))
          if data.get('status') == 'UPSTREAM_RESEARCH_GATE_BLOCKED':
              assert not data['qualified_legs']
          for leg in data['qualified_legs']:
              assert leg.get('sport') in {'football', 'tennis', 'virtual'}
              assert float(leg.get('model_probability', 0)) >= (0.65 if leg.get('sport') == 'virtual' else 0.60)
              assert float(leg.get('model_fair_odds', 0)) > 1
              assert leg.get('real_money_eligible') is False
              assert leg.get('paper_only') is True
              assert leg.get('bookmaker_odds') is not None
              assert float(leg.get('model_edge', 0)) >= 0.025
          sports = {x.get('sport') for x in data['qualified_legs']}
          if data.get('candidates_considered', {}).get('football', 0) > 0:
              assert 'football' in sports or len(data['qualified_legs']) < 3
          if data.get('market_price_combined_odds') is not None:
              assert data['market_price_combined_odds'] > 1
          if data.get('status') in {'BELOW_4_TARGET_AVAILABLE','ACCURACY_FIRST_SET','RESULTS_FIRST_SET'}:
              assert data.get('best_available_legs')
          batches = data.get('batches', [])
          assert isinstance(batches, list)
          assert int(data.get('batch_count', len(batches))) == len(batches)
          for batch in batches:
              if batch.get('primary_lane') == 'mixed_vfootball_efootball_value':
                  products = {str(x.get('product') or '') for x in batch.get('legs', [])}
                  assert 'vfootball' in products, 'mixed lane must contain VFootball'
                  assert any(p.startswith('efootball_') for p in products), 'mixed lane must contain eFootball'
                  assert 2 <= int(batch.get('leg_count', len(batch.get('legs', [])))) <= 3
          seen_batch_ids = set()
          seen_event_ids = set()
          for batch in batches:
              assert batch.get('batch_id') not in seen_batch_ids
              seen_batch_ids.add(batch.get('batch_id'))
              assert float(batch.get('combined_odds', 0)) >= float(data.get('batch_policy', {}).get('min_combined_odds', 2.0))
              if data.get('status') == 'RESULTS_FIRST_SET':
                  assert int(batch.get('leg_count', len(batch.get('legs', [])))) <= int(data.get('batch_policy', {}).get('results_first_max_legs', 4))
              assert int(batch.get('leg_count', len(batch.get('legs', [])))) >= 2
              assert batch.get('paper_only') is True
              assert batch.get('real_money_execution') is False
              assert float(batch.get('combined_model_rating', 0)) >= 0
              leg_ids = [str(x.get('event_id')) for x in batch.get('legs', [])]
              assert len(leg_ids) == len(set(leg_ids)), 'duplicate event inside batch'
              assert not (seen_event_ids & set(leg_ids)), 'batches must be disjoint'
              seen_event_ids.update(leg_ids)
          if batches:
              # Batches are displayed chronologically. Model rating remains a
              # leg-quality metric, not the display sort key.
              from datetime import datetime, timezone
              batch_starts=[]
              for batch in batches:
                  times=[]
                  for leg in batch.get('legs', []):
                      raw=leg.get('start_time')
                      if raw:
                          times.append(datetime.fromisoformat(str(raw).replace('Z','+00:00')).astimezone(timezone.utc))
                  if times:
                      span_seconds=(max(times)-min(times)).total_seconds()
                      if data.get('status') == 'RESULTS_FIRST_SET':
                          assert span_seconds <= 3600, 'Results-first batch kickoff span exceeds 60 minutes'
                      elif data.get('status') == 'VALUE_RESEARCH_SET':
                          if batch.get('primary_lane') == 'mixed_vfootball_efootball_value':
                              assert span_seconds <= 360*60, 'Mixed research batch kickoff span exceeds 360 minutes'
                          else:
                              assert span_seconds <= 270*60, 'Paper value batch kickoff span exceeds 270 minutes'
                      else:
                          assert span_seconds <= 3600, 'batch kickoff span exceeds 60 minutes'
                      batch_starts.append(min(times))
              assert batch_starts == sorted(batch_starts), 'batches must be ordered by earliest kickoff'
          print('V6 Accumulator QA:', json.dumps({
              'status': data.get('status'),
              'legs': len(data['qualified_legs']),
              'sports': sorted(sports),
              'candidates': data.get('candidates_considered'),
              'reference_combined_odds': data.get('reference_combined_odds'),
              'batches': data.get('batch_count', 0),
              'construction_priority': data.get('batch_policy', {}).get('construction_priority'),
              'target_combined_odds': data.get('batch_policy', {}).get('target_combined_odds'),
              'accuracy_preservation_ratio': data.get('batch_policy', {}).get('accuracy_preservation_ratio'),
              'top_model_rating': (data.get('batches') or [{}])[0].get('combined_model_rating') if data.get('batches') else None
          }))
          PY
      - name: Commit generated accumulator artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_builder.json data/tennis_total_research.json data/results_first_evidence_report.json
          if git diff --cached --quiet; then
            echo "No accumulator changes."
            exit 0
          fi
          git commit -m "🤖 Refresh research-gated Odds Builder"
          # Results-first validation trigger 2026-10-01: settled performance is now primary.
          # Cloudflare verification may commit while this build is running.
          # Rebase once on the latest main so the generated artifact is not lost.
          if ! git pull --rebase origin main; then
            echo "Rebase conflict detected; generated builder artifacts win over concurrent refresh artifacts."
            git rebase --abort || true
            git fetch origin main
            # Reset both index and worktree state to the latest main before staging
            # only the generated artifacts. This prevents a stale pre-rebase script
            # from being accidentally committed during conflict recovery.
            git reset --mixed origin/main
            git add data/odds_builder.json data/tennis_total_research.json data/results_first_evidence_report.json
            git commit -m "🤖 Refresh research-gated Odds Builder"
          fi
          git push origin main

      - name: Notify subscribed devices about new 2.70+ batches
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          data=json.loads(Path('data/odds_builder.json').read_text(encoding='utf-8'))
          gate=((data.get('research_gate') or {}).get('combined_odds_gate') or {})
          floor=float(gate.get('floor') or 2.70)
          batches=[b for b in (data.get('batches') or []) if float(b.get('combined_odds') or 0) >= floor and len(b.get('legs') or []) >= 2]
          if not batches:
              print(f'No batch at active floor {floor:.2f}x.')
              raise SystemExit(0)
          payload=json.dumps({'batches':batches}).encode('utf-8')
          req=urllib.request.Request(
              'https://match-signal.pages.dev/api/push-batch-available',
              data=payload,
              method='POST',
              headers={'Content-Type':'application/json','User-Agent':'Match-Signal-GitHub-Action'}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('Push notification response:', r.read().decode('utf-8','replace'))
          except Exception as exc:
              print('Push notification delivery skipped:', exc)
          PY