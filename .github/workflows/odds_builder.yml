name: Match Signal Odds Builder

on:
  push:
    branches: [main]
    paths:
      - 'data/selection_candidates.json'
      - 'data/predictions.json'
      - 'scripts/odds_builder.py'
      - '.github/workflows/odds_builder.yml'
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-odds-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --upgrade requests
      - name: Run guarded Odds Builder
        run: python scripts/odds_builder.py
      - name: Validate Odds Builder JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/odds_builder.json')
          data = json.loads(p.read_text())
          assert data.get('mode') == 'PAPER_ONLY'
          assert set(data.get('sports_supported', [])) >= {'football', 'tennis'}
          assert isinstance(data.get('qualified_legs'), list)
          assert len(data['qualified_legs']) <= 4
          if data['qualified_legs']:
              assert len(data['qualified_legs']) >= 3
          for leg in data['qualified_legs']:
              assert leg.get('sport') in {'football', 'tennis'}
          print('Odds Builder QA:', json.dumps({
              'status': data.get('sportybet', {}).get('status'),
              'legs': len(data['qualified_legs']),
              'sports': sorted({x.get('sport') for x in data['qualified_legs']}),
              'candidates': data.get('candidates_considered'),
              'stake_status': data.get('stake', {}).get('status')
          }))
          PY
      - name: Commit generated Odds Builder artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_builder.json
          if git diff --cached --quiet; then
            echo "No Odds Builder changes."
            exit 0
          fi
          git commit -m "🤖 Refresh football and tennis Odds Builder"
          git push origin main
