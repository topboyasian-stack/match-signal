                  'STALE' if efootball_research_archive_stale else 'FRESH'
              ),
              'virtual_lab_events': virtual.get('events_count', 0),
              'virtual_lab_products': virtual.get('product_counts', {}),
              'thresholds': {'pipeline_hours': 4, 'odds_builder_minutes': ODDS_BUILDER_MAX_AGE_MINUTES, 'expansion_hours': 4, 'virtual_lab_hours': 1, 'virtual_lab_status_hours': 1, 'darts_hours': 2, 'table_tennis_hours': 2, 'unified_upcoming_hours': 0.2, 'qualified_best_monitor_minutes': 15, 'efootball_market_research_minutes': EFOOTBALL_RESEARCH_MAX_AGE_MINUTES, 'efootball_market_research_dispatch_cooldown_minutes': EFOOTBALL_RESEARCH_DISPATCH_COOLDOWN_MINUTES},
              'actions': actions,
              'policy': 'Watchdog self-heals stale engines, records Qualified Best scheduled/actual monitor age, dispatches a fallback when the scheduled monitor is missing/stale even if deployment checks are recent (10-minute cooldown), retries failed board/deploy runs once per 20-minute cooldown, and dispatches isolated eFootball winner/GG-NG research when its market archive or collector capture is over 30 minutes stale (15-minute cooldown). The eFootball research workflow is shadow-only and never gates Qualified Best or Odds Builder. Workflow_run checks do not rewrite feed data to avoid downstream loops. Health publication is retried across concurrent data writers.'
          }
          Path('data/automation_health.json').write_text(json.dumps(health, indent=2) + '\n')
          print(json.dumps(health, indent=2))
          PY

      - name: Commit automation health record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/automation_health.json /tmp/automation_health.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/automation_health.json data/automation_health.json
            if [ -f /tmp/virtual_lab_live_candidate.json ]; then
              cp /tmp/virtual_lab_live_candidate.json data/virtual_lab_live.json
            fi
            git add data/automation_health.json data/virtual_lab_live.json
            if git diff --cached --quiet; then
              echo "No automation health change."
              exit 0
            fi
            git commit -m "🤖 Update automation watchdog health"
            if git push origin main; then
              echo "Automation health publication succeeded."
              exit 0
            fi
            echo "Concurrent main update detected; retrying watchdog health publication."
            sleep $((attempt * 2))
          done
          echo "Automation health publication failed after five retries." >&2
          exit 1
