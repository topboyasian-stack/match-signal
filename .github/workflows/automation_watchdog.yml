name: Match Signal Automation Watchdog
# Watchdog activation: scheduled self-healing heartbeat for production feeds.
# Virtual Lab live-feed classification refresh.
# Candidate-evidence refresh heartbeat.
# 2026-10-02: Darts-X and Table Tennis-X self-heal workflows restored; their dispatch targets are live again.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation_watchdog.yml'
  schedule:
    # Frequent, off-hour heartbeat so stale live feeds are repaired before the next day.
    # Change the registered cron to re-arm schedule delivery; keep runs off minute zero.
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_run:
    workflows:
      - "Match Signal Unified Upcoming Board"
      - "Deploy Match Signal to Cloudflare Pages"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: match-signal-automation-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Virtual Lab live-feed dependency
        run: python -m pip install --upgrade requests

      - name: Refresh Virtual Lab live snapshot
        # Event-driven freshness checks must not rewrite feed artifacts and trigger a board/watchdog loop.
        if: github.event_name != 'workflow_run'
        run: |
          python scripts/virtual_lab_sync.py
          cp data/virtual_lab_live.json /tmp/virtual_lab_live_candidate.json

      - name: Check freshness and self-heal stale workflows
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WATCHDOG_SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          now = datetime.now(timezone.utc)
          virtual = load('data/virtual_lab_live.json')
          virtual_status = load('data/virtual_lab_status.json')
          pipeline = load('data/pipeline_status.json')
          odds = load('data/odds_builder.json')
          expansion = load('data/expansion_status.json')
          darts = load('data/darts_status.json')
          table_tennis = load('data/table_tennis_status.json')
          unified = load('data/unified_upcoming.json')

          def age_hours(value):
              if not value:
                  return 999.0
              try:
                  dt = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                  return max(0.0, (now - dt).total_seconds() / 3600)
              except Exception:
                  return 999.0

          pipeline_age = age_hours(pipeline.get('updated_at'))
          odds_age = age_hours(odds.get('generated_at'))
          expansion_age = age_hours(expansion.get('updated_at'))
          virtual_age = age_hours(virtual.get('updated_at'))
          virtual_status_age = age_hours(virtual_status.get('updated_at'))
          darts_age = age_hours(darts.get('updated_at'))
          table_tennis_age = age_hours(table_tennis.get('updated_at'))
          unified_age = age_hours(unified.get('generated_at'))

          def recent_runs(workflow, limit=100):
              p = subprocess.run(
                  ['gh', 'run', 'list', '--workflow', workflow, '--branch', 'main',
                   '--json', 'databaseId,status,event,createdAt,conclusion', '--limit', str(limit)],
                  text=True, capture_output=True
              )
              if p.returncode != 0:
                  return None, p.stderr.strip() or f'gh run list failed for {workflow}'
              try:
                  value = json.loads(p.stdout)
                  if not isinstance(value, list):
                      return None, f'Unexpected run-history response for {workflow}'
                  return value, None
              except Exception as exc:
                  return None, f'Could not parse run history for {workflow}: {exc}'

          def minutes_since(value):
              if not value:
                  return None
              try:
                  stamp = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                  return round(max(0.0, (now - stamp).total_seconds()) / 60, 1)
              except Exception:
                  return None

          def active(workflow):
              runs, error = recent_runs(workflow, 10)
              if runs is None:
                  print(f'WARN unable to inspect {workflow}: {error}')
                  return False
              return any(r.get('status') in {'queued', 'in_progress', 'waiting', 'pending'} for r in runs)

          monitor_runs, monitor_history_error = recent_runs('qualified-best-watch.yml', 100)
          monitor_last_age_minutes = None
          monitor_scheduled_age_minutes = None
          monitor_schedule_status = 'UNKNOWN'
          if monitor_runs is not None:
              valid_monitor_runs = [r for r in monitor_runs if minutes_since(r.get('createdAt')) is not None]
              if valid_monitor_runs:
                  monitor_last_age_minutes = min(minutes_since(r.get('createdAt')) for r in valid_monitor_runs)
              scheduled_monitor_runs = [r for r in valid_monitor_runs if r.get('event') == 'schedule']
              if scheduled_monitor_runs:
                  monitor_scheduled_age_minutes = min(minutes_since(r.get('createdAt')) for r in scheduled_monitor_runs)
                  monitor_schedule_status = 'STALE' if monitor_scheduled_age_minutes > 15 else 'ON_CADENCE'
              else:
                  monitor_schedule_status = 'AWAITING_FIRST_SCHEDULED_RUN'

          actions = []
          if monitor_runs is None:
              actions.append({'workflow':'qualified-best-watch.yml','action':'inspect_schedule','status':'failed','detail':monitor_history_error})
          elif monitor_schedule_status == 'STALE':
              actions.append({'workflow':'qualified-best-watch.yml','action':'schedule_gap_alert','status':'warning','detail':'Last scheduled Qualified Best monitor was '+str(monitor_scheduled_age_minutes)+' minute(s) ago; target cadence is 10 minutes and warning threshold is 15 minutes.'})

          # A failed board/deploy run is an event-driven recovery signal even if
          # the last published artifact has not aged past its normal freshness guard.
          # A 20-minute dispatch cooldown bounds retries and prevents failure loops.
          watchdog_event_name = os.environ.get('WATCHDOG_EVENT_NAME', '')
          source_workflow_name = os.environ.get('WATCHDOG_SOURCE_WORKFLOW_NAME', '')
          source_workflow_conclusion = os.environ.get('WATCHDOG_SOURCE_WORKFLOW_CONCLUSION', '')
          failed_source_workflow = None
          if watchdog_event_name == 'workflow_run' and source_workflow_conclusion != 'success':
              if source_workflow_name == 'Match Signal Unified Upcoming Board':
                  failed_source_workflow = 'unified-upcoming.yml'
              elif source_workflow_name == 'Deploy Match Signal to Cloudflare Pages':
                  failed_source_workflow = 'cloudflare-pages.yml'

          if failed_source_workflow:
              prior_runs, prior_error = recent_runs(failed_source_workflow, 30)
              retry_age = None
              if prior_runs is not None:
                  retry_ages = [minutes_since(r.get('createdAt')) for r in prior_runs if r.get('event') == 'workflow_dispatch' and minutes_since(r.get('createdAt')) is not None]
                  if retry_ages:
                      retry_age = min(retry_ages)
              if active(failed_source_workflow):
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery','status':'suppressed_active_run','detail':'A run is already queued or active; duplicate retry avoided.'})
              elif retry_age is not None and retry_age < 20:
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery','status':'suppressed_cooldown','detail':'A manual retry was dispatched '+str(retry_age)+' minute(s) ago; retry cooldown is 20 minutes.'})
              else:
                  r = subprocess.run(['gh', 'workflow', 'run', failed_source_workflow, '--ref', 'main'], text=True, capture_output=True)
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery_dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Automatic retry after failed '+source_workflow_name+' completion; cooldown prevents repeated failure loops.')})

          # Deployment-triggered browser checks remain primary. If no monitor run
          # of any kind completes for 15 minutes, schedule/manual watchdog runs
          # dispatch one check as a failsafe; this does not certify the cron itself.
          deployment_event = watchdog_event_name == 'workflow_run' and source_workflow_conclusion == 'success' and source_workflow_name in {'Match Signal Unified Upcoming Board', 'Deploy Match Signal to Cloudflare Pages'}
          if monitor_runs is not None and (monitor_last_age_minutes is None or monitor_last_age_minutes > 15) and not deployment_event:
              if not active('qualified-best-watch.yml'):
                  r = subprocess.run(['gh', 'workflow', 'run', 'qualified-best-watch.yml', '--ref', 'main'], text=True, capture_output=True)
                  actions.append({'workflow':'qualified-best-watch.yml','action':'monitor_failsafe_dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'No Qualified Best browser check in the last 15 minutes; fallback monitor dispatched.')})
              else:
                  actions.append({'workflow':'qualified-best-watch.yml','action':'monitor_failsafe_dispatch','status':'suppressed_active_run','detail':'Monitor already queued or active.'})
          if virtual_status_age > 1 and not active('virtual-lab-collector.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'virtual-lab-collector.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'virtual-lab-collector.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Virtual Lab research-ledger self-heal')})

          if expansion_age > 4 and not active('live-expansion.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'live-expansion.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'live-expansion.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'scheduled self-heal')})

          # A core run that has left the publication artifact stale for half a
          # day is treated as hung, even when GitHub reports the workflow as
          # queued/in-progress. Autopilot uses cancel-in-progress so the fresh
          # run can replace the stuck publisher.
          if pipeline_age > 12 or (pipeline_age > 4 and not active('tennis_pipeline.yml')):
              r = subprocess.run(['gh', 'workflow', 'run', 'tennis_pipeline.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'tennis_pipeline.yml','action':'force_dispatch' if pipeline_age > 12 else 'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else ('core prediction pipeline forced self-heal after '+str(round(pipeline_age,2))+'h stale' if pipeline_age > 12 else 'core prediction pipeline self-heal'))})

          if darts_age > 2 and not active('darts-x.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'darts-x.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'darts-x.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Darts-X self-heal')})

          if table_tennis_age > 2 and not active('table-tennis-x.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'table-tennis-x.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'table-tennis-x.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Table Tennis-X self-heal')})

          if (virtual_age + 0.01) < unified_age and not active('unified-upcoming.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'unified-upcoming.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'unified-upcoming.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Unified board refresh after newer Virtual Lab snapshot')})

          if unified_age > 0.5 and not active('unified-upcoming.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'unified-upcoming.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'unified-upcoming.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Unified board self-heal')})

          if odds_age > 8 and not active('odds_builder.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'odds_builder.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'odds_builder.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'scheduled self-heal')})

          health = {
              'updated_at': now.isoformat(),
              'automation_status': 'SELF_HEALING_ENABLED',
              'pipeline_last_update': pipeline.get('updated_at'),
              'pipeline_age_hours': round(pipeline_age, 2),
              'odds_builder_last_update': odds.get('generated_at'),
              'odds_builder_age_hours': round(odds_age, 2),
              'expansion_last_update': expansion.get('updated_at'),
              'expansion_age_hours': round(expansion_age, 2),
              'virtual_lab_last_update': virtual.get('updated_at'),
              'virtual_lab_age_hours': round(virtual_age, 2),
              'virtual_lab_status_age_hours': round(virtual_status_age, 2),
              'darts_age_hours': round(darts_age, 2),
              'table_tennis_age_hours': round(table_tennis_age, 2),
              'unified_upcoming_age_hours': round(unified_age, 2),
              'qualified_best_monitor_last_run_age_minutes': monitor_last_age_minutes,
              'qualified_best_monitor_last_scheduled_run_age_minutes': monitor_scheduled_age_minutes,
              'qualified_best_monitor_schedule_status': monitor_schedule_status,
              'virtual_lab_events': virtual.get('events_count', 0),
              'virtual_lab_products': virtual.get('product_counts', {}),
              'thresholds': {'pipeline_hours': 4, 'odds_builder_hours': 8, 'expansion_hours': 4, 'virtual_lab_hours': 1, 'virtual_lab_status_hours': 1, 'darts_hours': 2, 'table_tennis_hours': 2, 'unified_upcoming_hours': 0.5, 'qualified_best_monitor_minutes': 15},
              'actions': actions,
              'policy': 'Watchdog self-heals stale engines, records Qualified Best scheduled/actual monitor age, and retries failed board/deploy runs once per 20-minute cooldown; workflow_run checks do not rewrite feed data to avoid downstream loops. Health publication is retried across concurrent data writers.'
          }
          Path('data/automation_health.json').write_text(json.dumps(health, indent=2) + '\n')
          print(json.dumps(health, indent=2))
          PY

      - name: Commit automation health record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/automation_health.json /tmp/automation_health.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/automation_health.json data/automation_health.json
            if [ -f /tmp/virtual_lab_live_candidate.json ]; then
              cp /tmp/virtual_lab_live_candidate.json data/virtual_lab_live.json
            fi
            git add data/automation_health.json data/virtual_lab_live.json
            if git diff --cached --quiet; then
              echo "No automation health change."
              exit 0
            fi
            git commit -m "🤖 Update automation watchdog health"
            if git push origin main; then
              echo "Automation health publication succeeded."
              exit 0
            fi
            echo "Concurrent main update detected; retrying watchdog health publication."
            sleep $((attempt * 2))
          done
          echo "Automation health publication failed after five retries." >&2
          exit 1
