name: Match Signal Automation Watchdog
# Watchdog activation: scheduled self-healing heartbeat for production feeds.
# Virtual Lab live-feed classification refresh.
# Candidate-evidence refresh heartbeat.
# 2026-10-02: Darts-X and Table Tennis-X self-heal workflows restored; their dispatch targets are live again.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation_watchdog.yml'
  schedule:
    # Frequent, off-hour heartbeat so stale live feeds are repaired before the next day.
    # Re-register on a new off-minute-zero cadence after the confirmed scheduled-run gap.
    - cron: '9,19,29,39,49,59 * * * *'
  workflow_run:
    workflows:
      - "Match Signal Unified Upcoming Board"
      - "Deploy Match Signal to Cloudflare Pages"
      - "Match Signal Odds Ticket Tracker"
      - "Match Signal Virtual Lab Live Sync"
      - "Isolated eFootball Winner and BTTS Market Research"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: match-signal-automation-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    # Use successful Odds Ticket Tracker completions as an event-driven heartbeat when GitHub cron delivery stalls.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Match Signal Unified Upcoming Board' && github.event.workflow_run.conclusion != 'success') || github.event.workflow_run.name == 'Deploy Match Signal to Cloudflare Pages' || (github.event.workflow_run.name == 'Match Signal Odds Ticket Tracker' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'Match Signal Virtual Lab Live Sync' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'Isolated eFootball Winner and BTTS Market Research' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Virtual Lab live-feed dependency
        if: github.event_name != 'workflow_run'
        run: python -m pip install --upgrade requests

      - name: Refresh Virtual Lab live snapshot
        # Keep feed collection best-effort: a SportyBet outage must not block independent freshness checks.
        # Event-driven workflow_run checks still avoid rewriting feed artifacts and triggering loops.
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          if python scripts/virtual_lab_sync.py; then
            cp data/virtual_lab_live.json /tmp/virtual_lab_live_candidate.json
          else
            echo "::warning::Virtual Lab live sync failed. Continuing into freshness checks and stale-board recovery."
          fi

      - name: Check freshness and self-heal stale workflows
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WATCHDOG_SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          now = datetime.now(timezone.utc)
          virtual = load('data/virtual_lab_live.json')
          virtual_status = load('data/virtual_lab_status.json')
          pipeline = load('data/pipeline_status.json')
          odds = load('data/odds_builder.json')
          expansion = load('data/expansion_status.json')
          darts = load('data/darts_status.json')
          table_tennis = load('data/table_tennis_status.json')
          unified = load('data/unified_upcoming.json')
          efootball_report = load('data/efootball_performance_report.json')

          def age_hours(value):
              if not value:
                  return 999.0
              try:
                  dt = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                  return max(0.0, (now - dt).total_seconds() / 3600)
              except Exception:
                  return 999.0

          pipeline_age = age_hours(pipeline.get('updated_at'))
          odds_age = age_hours(odds.get('generated_at'))
          # Builder cadence is 15 minutes. Allow one missed cycle plus runner jitter,
          # then self-heal before stale research output can sit for hours.
          ODDS_BUILDER_MAX_AGE_MINUTES = 25
          odds_age_minutes = round(odds_age * 60, 1)
          expansion_age = age_hours(expansion.get('updated_at'))
          virtual_age = age_hours(virtual.get('updated_at'))
          virtual_status_age = age_hours(virtual_status.get('updated_at'))
          darts_age = age_hours(darts.get('updated_at'))
          table_tennis_age = age_hours(table_tennis.get('updated_at'))
          unified_age = age_hours(unified.get('generated_at'))

          def recent_runs(workflow, limit=100):
              p = subprocess.run(
                  ['gh', 'run', 'list', '--workflow', workflow, '--branch', 'main',
                   '--json', 'databaseId,status,event,createdAt,conclusion', '--limit', str(limit)],
                  text=True, capture_output=True
              )
              if p.returncode != 0:
                  return None, p.stderr.strip() or f'gh run list failed for {workflow}'
              try:
                  value = json.loads(p.stdout)
                  if not isinstance(value, list):
                      return None, f'Unexpected run-history response for {workflow}'
                  return value, None
              except Exception as exc:
                  return None, f'Could not parse run history for {workflow}: {exc}'

          def minutes_since(value):
              if not value:
                  return None
              try:
                  stamp = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                  return round(max(0.0, (now - stamp).total_seconds()) / 60, 1)
              except Exception:
                  return None

          def active(workflow):
              runs, error = recent_runs(workflow, 10)
              if runs is None:
                  print(f'WARN unable to inspect {workflow}: {error}')
                  return False
              return any(r.get('status') in {'queued', 'in_progress', 'waiting', 'pending'} for r in runs)

          # Independent eFootball winner/GG-NG archive freshness is monitored separately
          # from the live desk. A stale shadow archive should trigger research recovery,
          # never block Qualified Best or change production selection.
          efootball_source_freshness = efootball_report.get('source_freshness') or {}
          efootball_market_archive_updated_at = (
              efootball_source_freshness.get('market_archive_updated_at')
              or efootball_report.get('generated_at')
          )
          efootball_collector_last_capture_at = efootball_source_freshness.get('collector_last_capture_at')
          efootball_market_archive_age_minutes = minutes_since(efootball_market_archive_updated_at)
          efootball_collector_age_minutes = minutes_since(efootball_collector_last_capture_at)
          EFOOTBALL_RESEARCH_MAX_AGE_MINUTES = 30
          EFOOTBALL_RESEARCH_DISPATCH_COOLDOWN_MINUTES = 15
          efootball_research_runs, efootball_research_history_error = recent_runs(
              'efootball-market-research-schedule.yml', 30
          )
          efootball_research_last_run_age_minutes = None
          efootball_research_last_success_age_minutes = None
          efootball_research_scheduled_age_minutes = None
          efootball_research_dispatch_age_minutes = None
          efootball_research_workflow_age_minutes = None
          efootball_research_schedule_status = 'UNKNOWN'
          efootball_repo_name = os.environ.get('GITHUB_REPOSITORY', '')
          if efootball_repo_name:
              efootball_workflow_meta = subprocess.run(
                  ['gh', 'api', f'repos/{efootball_repo_name}/actions/workflows/efootball-market-research-schedule.yml', '--jq', '.created_at'],
                  text=True, capture_output=True
              )
              if efootball_workflow_meta.returncode == 0:
                  efootball_research_workflow_age_minutes = minutes_since(efootball_workflow_meta.stdout.strip())
          if efootball_research_runs is not None:
              valid_efootball_runs = [
                  r for r in efootball_research_runs
                  if minutes_since(r.get('createdAt')) is not None
              ]
              if valid_efootball_runs:
                  efootball_research_last_run_age_minutes = min(
                      minutes_since(r.get('createdAt')) for r in valid_efootball_runs
                  )
              successful_efootball_runs = [
                  r for r in valid_efootball_runs
                  if r.get('status') == 'completed' and r.get('conclusion') == 'success'
              ]
              if successful_efootball_runs:
                  efootball_research_last_success_age_minutes = min(
                      minutes_since(r.get('createdAt')) for r in successful_efootball_runs
                  )
              scheduled_efootball_runs = [
                  r for r in valid_efootball_runs if r.get('event') == 'schedule'
              ]
              dispatch_efootball_runs = [
                  r for r in valid_efootball_runs if r.get('event') == 'workflow_dispatch'
              ]
              if dispatch_efootball_runs:
                  efootball_research_dispatch_age_minutes = min(
                      minutes_since(r.get('createdAt')) for r in dispatch_efootball_runs
                  )
              if scheduled_efootball_runs:
                  efootball_research_scheduled_age_minutes = min(
                      minutes_since(r.get('createdAt')) for r in scheduled_efootball_runs
                  )
                  efootball_research_schedule_status = (
                      'STALE' if efootball_research_scheduled_age_minutes > EFOOTBALL_RESEARCH_MAX_AGE_MINUTES else 'ON_CADENCE'
                  )
              elif efootball_research_workflow_age_minutes is not None and efootball_research_workflow_age_minutes > EFOOTBALL_RESEARCH_MAX_AGE_MINUTES:
                  efootball_research_schedule_status = 'MISSING_SCHEDULED_RUN'
              elif efootball_research_history_error:
                  efootball_research_schedule_status = 'UNKNOWN'
              else:
                  efootball_research_schedule_status = 'AWAITING_FIRST_SCHEDULED_RUN'

          monitor_runs, monitor_history_error = recent_runs('qualified-best-health-watch-v2.yml', 100)
          monitor_last_age_minutes = None
          monitor_scheduled_age_minutes = None
          monitor_dispatch_age_minutes = None
          monitor_schedule_status = 'UNKNOWN'
          monitor_workflow_age_minutes = None
          monitor_workflow_metadata_error = None
          repo_name = os.environ.get('GITHUB_REPOSITORY', '')
          if repo_name:
              meta = subprocess.run(
                  ['gh', 'api', f'repos/{repo_name}/actions/workflows/qualified-best-health-watch-v2.yml', '--jq', '.created_at'],
                  text=True, capture_output=True
              )
              if meta.returncode == 0:
                  monitor_workflow_age_minutes = minutes_since(meta.stdout.strip())
              else:
                  monitor_workflow_metadata_error = meta.stderr.strip() or 'Workflow metadata lookup failed'
          else:
              monitor_workflow_metadata_error = 'GITHUB_REPOSITORY is unavailable'

          if monitor_runs is not None:
              valid_monitor_runs = [r for r in monitor_runs if minutes_since(r.get('createdAt')) is not None]
              if valid_monitor_runs:
                  monitor_last_age_minutes = min(minutes_since(r.get('createdAt')) for r in valid_monitor_runs)
              scheduled_monitor_runs = [r for r in valid_monitor_runs if r.get('event') == 'schedule']
              dispatch_monitor_runs = [r for r in valid_monitor_runs if r.get('event') == 'workflow_dispatch']
              if dispatch_monitor_runs:
                  monitor_dispatch_age_minutes = min(minutes_since(r.get('createdAt')) for r in dispatch_monitor_runs)
              if scheduled_monitor_runs:
                  monitor_scheduled_age_minutes = min(minutes_since(r.get('createdAt')) for r in scheduled_monitor_runs)
                  monitor_schedule_status = 'STALE' if monitor_scheduled_age_minutes > 15 else 'ON_CADENCE'
              elif monitor_workflow_age_minutes is not None and monitor_workflow_age_minutes > 15:
                  monitor_schedule_status = 'MISSING_SCHEDULED_RUN'
              elif monitor_workflow_metadata_error:
                  monitor_schedule_status = 'UNKNOWN'
              else:
                  monitor_schedule_status = 'AWAITING_FIRST_SCHEDULED_RUN'

          actions = []
          if monitor_runs is None:
              actions.append({'workflow':'qualified-best-health-watch-v2.yml','action':'inspect_schedule','status':'failed','detail':monitor_history_error})
          elif monitor_schedule_status in {'STALE', 'MISSING_SCHEDULED_RUN'}:
              actions.append({'workflow':'qualified-best-health-watch-v2.yml','action':'schedule_gap_alert','status':'warning','detail':'Qualified Best monitor schedule status='+monitor_schedule_status+'; last scheduled run age='+(str(monitor_scheduled_age_minutes) if monitor_scheduled_age_minutes is not None else 'none')+' minute(s); workflow age='+(str(monitor_workflow_age_minutes) if monitor_workflow_age_minutes is not None else 'unknown')+' minute(s).'})

          # A failed board/deploy run is an event-driven recovery signal even if
          # the last published artifact has not aged past its normal freshness guard.
          # A 20-minute dispatch cooldown bounds retries and prevents failure loops.
          watchdog_event_name = os.environ.get('WATCHDOG_EVENT_NAME', '')
          source_workflow_name = os.environ.get('WATCHDOG_SOURCE_WORKFLOW_NAME', '')
          source_workflow_conclusion = os.environ.get('WATCHDOG_SOURCE_WORKFLOW_CONCLUSION', '')
          failed_source_workflow = None
          if watchdog_event_name == 'workflow_run' and source_workflow_conclusion != 'success':
              if source_workflow_name == 'Match Signal Unified Upcoming Board':
                  failed_source_workflow = 'unified-upcoming.yml'
              elif source_workflow_name == 'Deploy Match Signal to Cloudflare Pages':
                  failed_source_workflow = 'cloudflare-pages.yml'

          if failed_source_workflow:
              prior_runs, prior_error = recent_runs(failed_source_workflow, 30)
              retry_age = None
              if prior_runs is not None:
                  retry_ages = [minutes_since(r.get('createdAt')) for r in prior_runs if r.get('event') == 'workflow_dispatch' and minutes_since(r.get('createdAt')) is not None]
                  if retry_ages:
                      retry_age = min(retry_ages)
              if active(failed_source_workflow):
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery','status':'suppressed_active_run','detail':'A run is already queued or active; duplicate retry avoided.'})
              elif retry_age is not None and retry_age < 20:
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery','status':'suppressed_cooldown','detail':'A manual retry was dispatched '+str(retry_age)+' minute(s) ago; retry cooldown is 20 minutes.'})
              else:
                  r = subprocess.run(['gh', 'workflow', 'run', failed_source_workflow, '--ref', 'main'], text=True, capture_output=True)
                  actions.append({'workflow':failed_source_workflow,'action':'failure_recovery_dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Automatic retry after failed '+source_workflow_name+' completion; cooldown prevents repeated failure loops.')})

          # Check freshness of both the monitor itself and its scheduled trigger history.
          # Frequent deployment-triggered checks must not hide a missing cron. When
          # the cron is stale/missing, dispatch a fallback check even if a recent
          # deployment-triggered run passed. A 10-minute dispatch cooldown bounds retries.
          cloudflare_success_event = (
              watchdog_event_name == 'workflow_run'
              and source_workflow_name == 'Deploy Match Signal to Cloudflare Pages'
              and source_workflow_conclusion == 'success'
          )
          heartbeat_signal_event = (watchdog_event_name == 'workflow_run' and source_workflow_name in {'Match Signal Odds Ticket Tracker', 'Match Signal Virtual Lab Live Sync'} and source_workflow_conclusion == 'success')
          monitor_fallback_allowed = watchdog_event_name in {'schedule', 'workflow_dispatch', 'push'} or cloudflare_success_event or heartbeat_signal_event
          monitor_schedule_fallback_needed = monitor_schedule_status in {'STALE', 'MISSING_SCHEDULED_RUN'}
          monitor_check_fallback_needed = monitor_last_age_minutes is None or monitor_last_age_minutes > 15
          if monitor_runs is not None and monitor_fallback_allowed and (monitor_schedule_fallback_needed or monitor_check_fallback_needed):
              # Honour the fallback cooldown before checking active jobs. A deploy-triggered monitor
              # often starts in parallel with this watchdog; when cron is missing, queue one explicit
              # workflow_dispatch behind it instead of suppressing recovery just because it's active.
              if monitor_dispatch_age_minutes is not None and monitor_dispatch_age_minutes < 10:
                  actions.append({'workflow':'qualified-best-health-watch-v2.yml','action':'monitor_failsafe_dispatch','status':'suppressed_cooldown','detail':'A fallback monitor was dispatched '+str(monitor_dispatch_age_minutes)+' minute(s) ago; monitor fallback cooldown is 10 minutes.'})
              elif active('qualified-best-production-watch.yml') and not monitor_schedule_fallback_needed:
                  actions.append({'workflow':'qualified-best-health-watch-v2.yml','action':'monitor_failsafe_dispatch','status':'suppressed_active_run','detail':'Monitor already queued or active and the scheduled cadence is not stale.'})
              else:
                  active_note = ' A deployment-triggered monitor is active; the fallback is queued behind it.' if active('qualified-best-production-watch.yml') else ''
                  detail = ('Scheduled monitor run is '+monitor_schedule_status+'; dispatching a fallback despite recent deployment checks.' if monitor_schedule_fallback_needed else 'No Qualified Best browser check in the last 15 minutes; fallback monitor dispatched.') + active_note
                  r = subprocess.run(['gh', 'workflow', 'run', 'qualified-best-health-watch-v2.yml', '--ref', 'main'], text=True, capture_output=True)
                  actions.append({'workflow':'qualified-best-health-watch-v2.yml','action':'monitor_failsafe_dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else detail)})
          efootball_research_archive_stale = (
              efootball_market_archive_age_minutes is None
              or efootball_market_archive_age_minutes > EFOOTBALL_RESEARCH_MAX_AGE_MINUTES
              or efootball_collector_age_minutes is None
              or efootball_collector_age_minutes > EFOOTBALL_RESEARCH_MAX_AGE_MINUTES
          )
          efootball_research_schedule_fallback_needed = (
              efootball_research_schedule_status in {'STALE', 'MISSING_SCHEDULED_RUN'}
          )
          efootball_research_recovery_needed = (
              efootball_research_archive_stale or efootball_research_schedule_fallback_needed
          )
          if efootball_research_runs is None:
              actions.append({
                  'workflow':'efootball-market-research-schedule.yml',
                  'action':'inspect_research_freshness',
                  'status':'failed',
                  'detail':efootball_research_history_error
              })
          elif efootball_research_recovery_needed:
              research_active = active('efootball-market-research-schedule.yml')
              if research_active:
                  research_action_status = 'suppressed_active_run'
                  research_detail = 'The isolated eFootball market research workflow is already queued or active.'
              elif (
                  not efootball_research_archive_stale
                  and efootball_research_last_success_age_minutes is not None
                  and efootball_research_last_success_age_minutes < EFOOTBALL_RESEARCH_DISPATCH_COOLDOWN_MINUTES
              ):
                  research_action_status = 'suppressed_recent_success'
                  research_detail = (
                      'The last successful isolated eFootball research run completed '
                      + str(efootball_research_last_success_age_minutes)
                      + ' minute(s) ago and its archive is fresh; avoiding a redundant fallback dispatch.'
                  )
              elif (
                  efootball_research_dispatch_age_minutes is not None
                  and efootball_research_dispatch_age_minutes < EFOOTBALL_RESEARCH_DISPATCH_COOLDOWN_MINUTES
              ):
                  research_action_status = 'suppressed_cooldown'
                  research_detail = (
                      'Research fallback dispatched '
                      + str(efootball_research_dispatch_age_minutes)
                      + ' minute(s) ago; cooldown is '
                      + str(EFOOTBALL_RESEARCH_DISPATCH_COOLDOWN_MINUTES)
                      + ' minutes.'
                  )
              else:
                  dispatch_result = subprocess.run(
                      ['gh', 'workflow', 'run', 'efootball-market-research-schedule.yml', '--ref', 'main'],
                      text=True, capture_output=True
                  )
                  research_action_status = 'requested' if dispatch_result.returncode == 0 else 'failed'
                  recovery_reasons = []
                  if efootball_research_archive_stale:
                      recovery_reasons.append('market archive or collector capture exceeded the 30-minute freshness limit')
                  if efootball_research_schedule_fallback_needed:
                      recovery_reasons.append('scheduled research run is '+efootball_research_schedule_status.lower().replace('_', ' '))
                  research_reason = '; '.join(recovery_reasons) or 'research refresh required'
                  research_detail = (
                      dispatch_result.stderr.strip()
                      if dispatch_result.returncode
                      else 'Dispatched isolated eFootball market research because '+research_reason+'.'
                  )
              actions.append({
                  'workflow':'efootball-market-research-schedule.yml',
                  'action':'efootball_market_research_failsafe_dispatch',
                  'status':research_action_status,
                  'detail':research_detail
              })

          if virtual_status_age > 1 and not active('virtual-lab-collector.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'virtual-lab-collector.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'virtual-lab-collector.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Virtual Lab research-ledger self-heal')})

          if expansion_age > 4 and not active('live-expansion.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'live-expansion.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'live-expansion.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'scheduled self-heal')})

          # A core run that has left the publication artifact stale for half a
          # day is treated as hung, even when GitHub reports the workflow as
          # queued/in-progress. Autopilot uses cancel-in-progress so the fresh
          # run can replace the stuck publisher.
          if pipeline_age > 12 or (pipeline_age > 4 and not active('tennis_pipeline.yml')):
              r = subprocess.run(['gh', 'workflow', 'run', 'tennis_pipeline.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'tennis_pipeline.yml','action':'force_dispatch' if pipeline_age > 12 else 'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else ('core prediction pipeline forced self-heal after '+str(round(pipeline_age,2))+'h stale' if pipeline_age > 12 else 'core prediction pipeline self-heal'))})

          if darts_age > 2 and not active('darts-x.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'darts-x.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'darts-x.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Darts-X self-heal')})

          if table_tennis_age > 2 and not active('table-tennis-x.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'table-tennis-x.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'table-tennis-x.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Table Tennis-X self-heal')})

          if (virtual_age + 0.01) < unified_age and not active('unified-upcoming.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'unified-upcoming.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'unified-upcoming.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Unified board refresh after newer Virtual Lab snapshot')})

          if unified_age > 0.2 and not active('unified-upcoming.yml'): 
              r = subprocess.run(['gh', 'workflow', 'run', 'unified-upcoming.yml', '--ref', 'main'], text=True, capture_output=True)
              actions.append({'workflow':'unified-upcoming.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':(r.stderr.strip() if r.returncode else 'Unified board self-heal')})

          if odds_age_minutes > ODDS_BUILDER_MAX_AGE_MINUTES and not active('odds_builder.yml'):
              r = subprocess.run(['gh', 'workflow', 'run', 'odds_builder.yml', '--ref', 'main'], text=True, capture_output=True)
              detail = r.stderr.strip() if r.returncode else (
                  'Builder artifact is '+str(odds_age_minutes)+' minutes old; triggered the 15-minute-cadence self-heal.'
              )
              actions.append({'workflow':'odds_builder.yml','action':'dispatch','status':'requested' if r.returncode == 0 else 'failed','detail':detail})

          health = {
              'updated_at': now.isoformat(),
              'automation_status': 'SELF_HEALING_ENABLED',
              'pipeline_last_update': pipeline.get('updated_at'),
              'pipeline_age_hours': round(pipeline_age, 2),
              'odds_builder_last_update': odds.get('generated_at'),
              'odds_builder_age_hours': round(odds_age, 2),
              'odds_builder_age_minutes': odds_age_minutes,
              'odds_builder_max_age_minutes': ODDS_BUILDER_MAX_AGE_MINUTES,
              'expansion_last_update': expansion.get('updated_at'),
              'expansion_age_hours': round(expansion_age, 2),
              'virtual_lab_last_update': virtual.get('updated_at'),
