name: Match Signal Qualified Best Production Monitor

on:
  schedule:
    # Independent production verification, separate from the board builder.
    # The main pipeline can appear healthy while browser-side qualification is broken.
    # Re-register the monitor under a fresh workflow identity after the confirmed multi-hour schedule gap.
    # A ten-minute cadence remains inside the 15-minute quote gate and avoids minute zero.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  workflow_run:
    # Start browser verification only after Cloudflare confirms its deployment.
    workflows:
      - "Deploy Match Signal to Cloudflare Pages"
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'sport-hubs.js'
      - 'football.html'
      - 'sport-hubs.css'
      - 'league-logos.js'
      - 'scripts/test_league_logos.mjs'
      - 'index.html'
      - 'upcoming.html'
      - 'qualified-best.html'
      - 'functions/api/sportybet-virtual.js'
      - 'scripts/test_prediction_desk_gates.mjs'
      - 'scripts/test_sportybet_virtual_upcoming_mode.mjs'
      - 'scripts/qualified_best_monitor.mjs'
      - '.github/workflows/unified-upcoming.yml'
      - 'scripts/test_qualified_best_monitor.mjs'
      - 'scripts/qualified_best_monitor_lib.mjs'
      - 'scripts/test_deploy_freshness_order.py'
      - 'scripts/test_cloudflare_only_deploy.mjs'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/settle-results.yml'
      - '.github/workflows/tennis_pipeline.yml'
      - 'scripts/test_sport_hub_design.mjs'
      - 'independent-sport-design.css'
      - 'scripts/test_independent_sports_design.mjs'
      - 'darts.html'
      - 'table-tennis.html'
      - 'odds-builder.html'
      - 'odds-builder-design.css'
      - 'reports.html'
      - 'reports-design.css'
      - 'virtual-lab/index.html'
      - 'virtual-lab-terminal.css'
      - 'scripts/test_workspace_terminal_design.mjs'
      - 'scripts/test_core_workspaces_design.mjs'
      - '.github/workflows/qualified-best-production-watch.yml'
      - '.github/workflows/cloudflare-pages.yml'
permissions:
  actions: read
  contents: read

concurrency:
  group: qualified-best-production-monitor
  cancel-in-progress: false

jobs:
  regression-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test freshness-safe scheduled refresh cadence
        run: python scripts/test_deploy_freshness_order.py
      - name: Enforce Cloudflare-only production hosting
        run: node scripts/test_cloudflare_only_deploy.mjs
      - name: Check JavaScript syntax
        run: |
          node --check sport-hubs.js
          node --check league-logos.js
          node scripts/test_league_logos.mjs
          node --check scripts/test_independent_sports_design.mjs
          node --check scripts/test_workspace_terminal_design.mjs
          node --check scripts/qualified_best_monitor.mjs
          node --check scripts/qualified_best_monitor_lib.mjs
          node --check scripts/test_qualified_best_monitor.mjs
          node --check functions/api/sportybet-virtual.js
          node --check scripts/test_sportybet_virtual_upcoming_mode.mjs
          node --check scripts/test_sport_hub_design.mjs
      - name: Test the sport-hub smoke-test route scope
        run: node scripts/test_sport_hub_design.mjs
      - name: Test independent sport page design
        run: node scripts/test_independent_sports_design.mjs
      - name: Test remaining workspace terminal design
        run: node scripts/test_workspace_terminal_design.mjs
      - name: Test Main Desk, Football and Tennis workspaces
        run: node scripts/test_core_workspaces_design.mjs
      - name: Test existing Prediction Desk gates
        run: node scripts/test_prediction_desk_gates.mjs
      - name: Test upcoming-only SportyBet proxy mode
        run: node scripts/test_sportybet_virtual_upcoming_mode.mjs
      - name: Test production monitor classifications
        run: node scripts/test_qualified_best_monitor.mjs

  production-monitor:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QUALIFIED_BEST_URL: https://match-signal.pages.dev/qualified-best.html
      QUALIFIED_BEST_MONITOR_WORKFLOW_FILE: qualified-best-production-watch.yml
    steps:
      - name: Check out monitor source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: qualified-best-chromium-${{ runner.os }}-v1
          restore-keys: |
            qualified-best-chromium-${{ runner.os }}-

      - name: Install browser monitor dependency
        run: npm install --no-save playwright

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test valid-zero versus failed-check classification
        run: node scripts/test_qualified_best_monitor.mjs

      - name: Inspect production Qualified Best through the real browser gate
        run: node scripts/qualified_best_monitor.mjs

      - name: Upload timestamped production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-best-production-monitor-${{ github.run_id }}
          path: |
            qualified-best-monitor-result.json
            qualified-best-production.png
          if-no-files-found: warn
          retention-days: 30
