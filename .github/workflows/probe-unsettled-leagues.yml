name: Probe unsettled leagues
on:
  push:
    branches: [diag/unsettled-leagues-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_unsettled_leagues.py --top 10 --output probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.json
