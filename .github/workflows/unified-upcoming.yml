name: Match Signal Unified Upcoming Board

on:
  workflow_run:
    workflows:
      - "Match Signal Live Prediction Pipeline"
      - "Match Signal Tennis Forward Window"
      - "Match Signal Tennis History Reconciliation"
      - "Match Signal Result Settlement"
      - "Match Signal Virtual Lab Collector"
      - "Match Signal Virtual Lab Live Sync"
      - "Match Signal Live Expansion"
      - "Match Signal ML EV Engine"
    types: [completed]
  schedule:
    # Keep the unified desk live around the clock, including overnight eFootball sessions.
    # Virtual Lab sync runs at :01/:06/:11...; keep board publication offset from minute zero. Re-register the cron after the confirmed delivery gap.
    # Re-arm scheduled delivery after the board publication gap; stay clear of minute zero and the Virtual Lab sync minute.
    # Re-register the five-minute board publisher on an offset that avoids the 10-minute watchdog, the 10-minute Qualified Best monitor and the 15-minute eFootball research job.
    - cron: '5-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/unified_upcoming.py'
      - 'scripts/test_upcoming_desk_policy.py'
      - 'scripts/selection_candidate_collector.py'
      - 'scripts/test_selection_candidate_collector.py'
      - 'scripts/efootball_desk_learning.py'
      - 'scripts/football_competition_match.py'
      - 'scripts/predict_today.py'
      - 'scripts/enrich_sportybet_odds.py'
      - 'scripts/test_upcoming_settlement_retention.py'
      - 'scripts/test_prediction_desk_gates.mjs'
      - 'scripts/qualified_best_monitor.mjs'
      - 'scripts/qualified_best_monitor_lib.mjs'
      - 'scripts/test_qualified_best_monitor.mjs'
      - '.github/workflows/qualified-best-production-watch.yml'
      - 'scripts/test_deploy_freshness_order.py'
      - 'scripts/unified_upcoming_cleanup.py'
      - 'scripts/system_health_audit.py'
      - 'scripts/system_health_audit_lib.py'
      - 'scripts/test_system_health_audit_lib.py'
      - 'data/virtual_lab_participant_lifecycle.json'
      # Keep push-path coverage for manual tracker edits; the Tracker is downstream of the Builder, so it is deliberately not a board trigger.
      - 'data/odds_ticket_tracker.json'
      - 'index.html'
      - 'upcoming.html'
      - 'qualified-best.html'
      - 'sport-hubs.js'
      - '.github/workflows/unified-upcoming.yml'
      - 'scripts/ensure_odds_builder_refresh.py'
      - 'scripts/test_ensure_odds_builder_refresh.py'
      - 'sport-hubs.css'
      - 'league-logos.js'
      - 'scripts/test_league_logos.mjs'
      - 'workspace-ui.css'
      - 'workspace-ui.js'
      - 'league.html'
      - 'reports.html'
      - '_redirects'
      - '_headers'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'darts.html'
      - 'darts-app.js'
      - 'darts.css'
      - 'table-tennis.html'
      - 'table-tennis-app.js'
      - 'table-tennis.css'
      - 'live.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'metrics-fix.js'
      - 'functions/**'
      - 'expansion.js'
      - 'expansion-tennis-ou.js'
      - 'expansion-odds-builder.js'
      - 'live-model-trace.js'
      - 'virtual-lab.html'
      - 'research.html'
      - 'virtual-lab-app.js'
      - 'virtual-lab-confirmed-watch.js'
      - 'virtual-lab.css'
      - 'virtual-lab/**'
      - 'data/odds_ticket_tracker.json'
      - 'data/virtual_lab_history.json'
      - 'data/virtual_lab_live.json'
      - 'data/virtual_lab_eligibility.json'
      - 'data/virtual_lab_participant_profiles.json'
      - 'data/virtual_lab_confirmed_participants.json'
      - 'data/virtual_lab_confirmed_participant_results.json'
      - 'data/virtual_lab_participants/**'
      - 'data/darts_*.json'
      - 'data/table_tennis_*.json'
      - 'data/predictions.json'
      - 'data/prediction_history.json'
      - 'data/prediction_pool.json'
      - 'data/selection_gate.json'
      - 'data/accuracy.json'
      - 'data/football_performance.json'
      - 'data/football_forward_readiness.json'
      - 'data/football_team_history.json'
      - 'data/football_model_council.json'
      - 'data/pdl_predictions.json'
      - 'data/pdl_status.json'
      - 'data/pipeline_status.json'
      - 'data/tennis_forward_status.json'
      - 'data/ere_divisie_history.json'
      - 'data/nba_history.json'
      - 'data/ere_divisie_predictions.json'
      - 'data/nba_predictions.json'
      - 'data/expansion_status.json'
      - 'data/expansion_prediction_history.json'
      - 'data/expansion_live_performance.json'
      - 'data/ere_divisie_qa.json'
      - 'scripts/test_live_virtual_quote_coverage.mjs'
      - 'data/results_first_evidence_report.json'
      - 'data/club-logo-registry.json'
      - 'assets/club-logos/**'
      - 'PRECISION-SPORTS-UPGRADE.md'
      - 'VIRTUAL-LAB-*.md'
      - 'functions/api/virtual-lab-history.js'
      - 'functions/api/sportybet-virtual-results.js'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      promotion_child:
        description: "Internal board refresh launched by Builder Production Promotion; prevent recursive promotion dispatch."
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  # Keep promotion-child board refreshes out of the ordinary scheduled/push queue.
  # GitHub replaces older pending runs in a concurrency group; isolating this child
  # prevents a routine feed update from cancelling the Builder's required pre/post refresh.
  group: match-signal-unified-upcoming-${{ github.event_name == 'workflow_dispatch' && inputs.promotion_child && 'promotion' || 'normal' }}
  cancel-in-progress: false

jobs:
  unified:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --upgrade requests
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test Odds Builder refresh recovery decision
        run: python scripts/test_ensure_odds_builder_refresh.py
      - name: Compile unified engines
        run: python -m py_compile scripts/unified_upcoming.py scripts/unified_upcoming_cleanup.py scripts/selection_candidate_collector.py scripts/test_selection_candidate_collector.py scripts/efootball_desk_learning.py scripts/test_upcoming_settlement_retention.py scripts/test_upcoming_desk_policy.py scripts/system_health_audit.py scripts/predict_today.py scripts/virtual_lab_model_eval.py scripts/test_virtual_lab_model_eval.py scripts/system_health_audit_lib.py scripts/test_system_health_audit_lib.py
      - name: Validate freshness deployment ordering
        run: |
          python scripts/test_deploy_freshness_order.py
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/unified-upcoming.yml').read_text(encoding='utf-8')
          concurrency = source.rsplit('\nconcurrency:\n', 1)[1].split('\njobs:\n', 1)[0]
          assert "group: match-signal-unified-upcoming-" in concurrency and "'promotion'" in concurrency
          publish = source.rsplit('      - name: Publish unified board and health', 1)[1]
          assert 'Newer unified board already published; skipping stale candidate.' in publish
          assert publish.index('if git rebase origin/main; then') < publish.index('Newer unified board already published; skipping stale candidate.')
          print('Publication skips a stale candidate when main already has a newer board.')
          PY
      - name: Test settled expiry and eFootball reconciliation
        run: python scripts/test_upcoming_settlement_retention.py
      - name: Test virtual near-term qualification window
        run: python scripts/test_upcoming_desk_policy.py
      - name: Test participant model promotion gate and walk-forward model evaluation
        run: python scripts/test_virtual_lab_model_eval.py
      - name: Regression-test Prediction Desk qualification and best-line selection
        run: node scripts/test_prediction_desk_gates.mjs
      - name: Test Qualified Best production monitor outcomes
        run: node scripts/test_qualified_best_monitor.mjs
      - name: Learn from prior eFootball desk forecasts before rebuilding the board
        run: python scripts/efootball_desk_learning.py
      - name: Build unified upcoming board
        run: python scripts/unified_upcoming.py
      - name: Remove retired sports from the user-facing board
        run: python scripts/unified_upcoming_cleanup.py
      - name: Test exact two-sided SportyBet quote preservation
        run: python scripts/test_selection_candidate_collector.py
      - name: Collect model-first selection candidates
        run: python scripts/selection_candidate_collector.py
      - name: Capture the final eFootball desk forecast snapshot
        run: python scripts/efootball_desk_learning.py
      - name: Test PDL source visibility and stale-fixture protection
        run: python scripts/test_system_health_audit_lib.py
      - name: Audit complete system
        run: python scripts/system_health_audit.py
      - name: Publish unified board and health
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unified_upcoming.json data/prediction_desk_health.json data/selection_candidates.json data/selection_candidate_status.json data/system_health.json data/efootball_desk_learning.json data/efootball_desk_prediction_history.json data/efootball_desk_settled_observations.json
          if git diff --cached --quiet; then
            echo "Unified board already current."
            exit 0
          fi
          git commit -m "🤖 Refresh unified upcoming board"
          candidate_board_stamp="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/unified_upcoming.json').read_text(encoding='utf-8'))
          print(d.get('generated_at') or d.get('updated_at') or '')
          PY
          )"
          export GIT_TERMINAL_PROMPT=0
          for attempt in 1 2 3 4 5 6; do
            if timeout 12s git push origin main; then
              echo "Unified board published; the refreshed Builder will hand off to the ordered production-promotion workflow."
              exit 0
            fi

            echo "Unified board push attempt ${attempt} failed or timed out; fetching the current head."
            git fetch origin main
            # First try to replay the generated artifact commit on the new head.
            # If the same generated files changed remotely, abort and rebuild from
            # the current main rather than overwriting newer results or histories.
            if git rebase origin/main; then
              echo "Rebased generated board commit onto current main."
              sleep 2
              continue
            fi

            echo "Rebase conflict; rebuild the board from the latest main."
            git rebase --abort || true
            git reset --hard origin/main
            current_board_stamp="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/unified_upcoming.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(d.get('generated_at') or d.get('updated_at') or '')
          PY
            )"
            if python - "$candidate_board_stamp" "$current_board_stamp" <<'PY'
          from datetime import datetime
          import sys
          def parse(value):
              try: return datetime.fromisoformat(value.replace('Z', '+00:00'))
              except Exception: return None
          candidate, current = map(parse, sys.argv[1:3])
          sys.exit(0 if candidate and current and current >= candidate else 1)
          PY
            then
              echo "Newer unified board already published; skipping stale candidate."
              exit 0
            fi
            python scripts/unified_upcoming.py
            python scripts/unified_upcoming_cleanup.py
            python scripts/selection_candidate_collector.py
            python scripts/efootball_desk_learning.py
            python scripts/system_health_audit.py
            git add data/unified_upcoming.json data/prediction_desk_health.json data/selection_candidates.json data/selection_candidate_status.json data/system_health.json data/efootball_desk_learning.json data/efootball_desk_prediction_history.json data/efootball_desk_settled_observations.json
            if git diff --cached --quiet; then
              echo "Latest main already contains the current generated board."
              exit 0
            fi
            git commit -m "🤖 Refresh unified upcoming board"
            sleep 2
          done
          echo "Failed to publish generated Prediction Desk data after six synchronized attempts."
          exit 1
      - name: Ensure Odds Builder refresh follows board publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_PROMOTION: ${{ github.event_name == 'workflow_dispatch' && inputs.promotion_child == true }}
        run: python scripts/ensure_odds_builder_refresh.py
