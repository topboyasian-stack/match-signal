name: Match Signal maintenance fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Patch target missing in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'No changes made to {path}')
              p.write_text(s, encoding='utf-8')

          identity_old = '''    name = (athlete.get("displayName") or competitor.get("displayName") or "").strip()'''
          identity_new = '''    name = (\n        athlete.get("displayName")\n        or athlete.get("fullName")\n        or athlete.get("shortName")\n        or athlete.get("name")\n        or competitor.get("displayName")\n        or competitor.get("fullName")\n        or competitor.get("name")\n        or ""\n    ).strip()'''

          patch('scripts/run_pipeline.py', [
              (identity_old, identity_new),
              ('''                prediction["actual_markets"] = {"over_under": "over" if hs + ass > line else "under", "btts": "yes" if hs > 0 and ass > 0 else "no"}\n                prediction["final_score"] = [hs, ass]''', '''                prediction["actual_markets"] = {"over_under": "over" if hs + ass > line else "under", "btts": "yes" if hs > 0 and ass > 0 else "no"}\n                handicap = prediction.get("handicap") or {}\n                hline = handicap.get("line")\n                actual_handicap = None\n                if hline is not None:\n                    actual_handicap = "home" if hs + float(hline) > ass else "away"\n                prediction["market_results"] = {\n                    "match_result": actual,\n                    "over_under": prediction["actual_markets"]["over_under"],\n                    "btts": prediction["actual_markets"]["btts"],\n                    "handicap": actual_handicap,\n                }\n                prediction["final_score"] = [hs, ass]'''),
              ('''                prediction["actual_markets"] = {"total_games": s1 + s2, "sets": len(c1.get("linescores", []))}\n                prediction["final_score"] = [s1, s2]''', '''                total_games = s1 + s2\n                sets_played = len(c1.get("linescores", []))\n                games_margin = s1 - s2\n                predicted_total = prediction.get("analytics", {}).get("total_games", {})\n                predicted_straight = prediction.get("analytics", {}).get("straight_sets", {})\n                prediction["actual_markets"] = {"total_games": total_games, "sets": sets_played}\n                prediction["market_results"] = {\n                    "match_result": actual,\n                    "games_ou": "over" if total_games > float(predicted_total.get("line", 22.5)) else "under",\n                    "straight_sets": actual in ("p1", "p2") and sets_played == 2 and ((actual == "p1" and c1.get("winner")) or (actual == "p2" and c2.get("winner"))),\n                    "games_margin_direction": "p1" if games_margin > 0 else "p2" if games_margin < 0 else "push",\n                }\n                prediction["final_score"] = [s1, s2]'''),
              ('''            probs = prediction.get("probabilities", {})\n            brier = sum((probs.get(k, 0) - (1 if actual == k else 0)) ** 2 for k in probs)\n            prediction.update({"settled": True, "settled_at": datetime.now(timezone.utc).isoformat(), "actual": actual, "correct": prediction["pick"] == actual, "brier": round(brier, 6)})''', '''            probs = prediction.get("probabilities", {})\n            brier = sum((probs.get(k, 0) - (1 if actual == k else 0)) ** 2 for k in probs)\n            market_results = prediction.get("market_results", {})\n            market_picks = {}\n            if prediction.get("sport") == "football":\n                ou = prediction.get("markets", {}).get("over_under", {})\n                bt = prediction.get("markets", {}).get("btts", {})\n                hc = prediction.get("handicap", {})\n                market_picks = {\n                    "over_under": ou.get("pick"),\n                    "btts": bt.get("pick"),\n                    "handicap": "home" if hc.get("home_cover", 0) >= hc.get("away_cover", 0) else "away",\n                }\n            else:\n                tg = prediction.get("analytics", {}).get("total_games", {})\n                st = prediction.get("analytics", {}).get("straight_sets", {})\n                gh = prediction.get("analytics", {}).get("games_handicap", {})\n                market_picks = {\n                    "games_ou": tg.get("pick"),\n                    "straight_sets": "yes" if max(st.get("p1", 0), st.get("p2", 0)) >= 0.5 else "no",\n                    "games_margin_direction": gh.get("pick"),\n                }\n            prediction["market_correct"] = {k: (market_results.get(k) == v) if market_results.get(k) is not None and v is not None else None for k, v in market_picks.items()}\n            prediction.update({"settled": True, "settled_at": datetime.now(timezone.utc).isoformat(), "actual": actual, "correct": prediction["pick"] == actual, "brier": round(brier, 6)})'''),
              ('''    for sport in ("football", "tennis"):\n        group = [p for p in settled if p.get("sport") == sport]\n        summary[sport] = {"settled": len(group), "correct": sum(bool(p.get("correct")) for p in group), "accuracy": round(sum(bool(p.get("correct")) for p in group) / len(group), 4) if group else 0.0}\n    return summary''', '''    for sport in ("football", "tennis"):\n        group = [p for p in settled if p.get("sport") == sport]\n        summary[sport] = {"settled": len(group), "correct": sum(bool(p.get("correct")) for p in group), "accuracy": round(sum(bool(p.get("correct")) for p in group) / len(group), 4) if group else 0.0}\n    market_stats = {}\n    for sport in ("football", "tennis"):\n        for p in [x for x in settled if x.get("sport") == sport]:\n            for market, result in (p.get("market_correct") or {}).items():\n                if result is None:\n                    continue\n                key = f"{sport}:{market}"\n                bucket = market_stats.setdefault(key, {"settled": 0, "correct": 0})\n                bucket["settled"] += 1\n                bucket["correct"] += int(bool(result))\n    for bucket in market_stats.values():\n        bucket["accuracy"] = round(bucket["correct"] / bucket["settled"], 4) if bucket["settled"] else 0.0\n    summary["markets"] = market_stats\n    return summary'''),
          ])

          patch('scripts/predict_today.py', [
              (identity_old, identity_new),
              ('''        "handicap": {"line": spread["line"] if spread else None, "home_cover": round(handicap_prob, 4) if handicap_prob is not None else None, "away_cover": round(1 - handicap_prob, 4) if handicap_prob is not None else None},''', '''        "handicap": {"line": spread["line"] if spread else None, "home_cover": round(handicap_prob, 4) if handicap_prob is not None else None, "away_cover": round(1 - handicap_prob, 4) if handicap_prob is not None else None, "pick": ("home" if handicap_prob >= 0.5 else "away") if handicap_prob is not None else None},'''),
          ])

          patch('scripts/settle_same_day.py', [
              ('''    return {\n        "content": "\n    }''', '''    return {\n        "content": "\n    }''') if False else ('__never__', '__never__')
          ])

          # Same-day settlement gets the same market-result fields by importing the authoritative
          # settlement function from run_pipeline. This removes the old duplicated settlement logic.
          p = Path('scripts/settle_same_day.py')
          s = p.read_text(encoding='utf-8')
          marker = 'def main():\n'
          if 'from run_pipeline import settle_predictions' not in s:
              s = s.replace(marker, 'from run_pipeline import settle_predictions\n\n\n' + marker, 1)
              start = s.index('def settle(history):')
              end = s.index('\n\ndef main():', start)
              s = s[:start] + '''def settle(history):\n    # Use the authoritative settlement implementation so historical and same-day\n    # settlement produce identical market_results/market_correct fields.\n    return sum(1 for p in history if p.get("settled"))\n''' + s[end:]
              # main now needs to call the imported authoritative function.
              s = s.replace('    count = settle(history)\n', '    before = sum(1 for p in history if p.get("settled"))\n    history = settle_predictions(history)\n    count = sum(1 for p in history if p.get("settled")) - before\n', 1)
              p.write_text(s, encoding='utf-8')

          # Remove the retired Netlify config if a previous direct delete raced with this workflow.
          Path('netlify.toml').unlink(missing_ok=True)
          print('Production patches applied.')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/predict_today.py scripts/run_pipeline.py scripts/settle_same_day.py netlify.toml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: harden WTA normalization and settlement analytics"
          git push origin main
      - name: Remove maintenance workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/maintenance-fix.yml || true
          git commit -m "chore: remove one-time maintenance workflow" || true
          git push origin main || true
