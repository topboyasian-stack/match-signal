name: Match Signal maintenance fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path); s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing patch target in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          identity_old = '''    name = (athlete.get("displayName") or competitor.get("displayName") or "").strip()'''
          identity_new = '''    name = (\n        athlete.get("displayName")\n        or athlete.get("fullName")\n        or athlete.get("shortName")\n        or athlete.get("name")\n        or competitor.get("displayName")\n        or competitor.get("fullName")\n        or competitor.get("name")\n        or ""\n    ).strip()'''
          replace_once('scripts/run_pipeline.py', identity_old, identity_new)
          replace_once('scripts/predict_today.py', identity_old, identity_new)

          # Expose an explicit football handicap pick for settlement and UI consumers.
          replace_once('scripts/predict_today.py',
              '''        "handicap": {"line": spread["line"] if spread else None, "home_cover": round(handicap_prob, 4) if handicap_prob is not None else None, "away_cover": round(1 - handicap_prob, 4) if handicap_prob is not None else None},''',
              '''        "handicap": {"line": spread["line"] if spread else None, "home_cover": round(handicap_prob, 4) if handicap_prob is not None else None, "away_cover": round(1 - handicap_prob, 4) if handicap_prob is not None else None, "pick": ("home" if handicap_prob >= 0.5 else "away") if handicap_prob is not None else None},''')

          # Enrich authoritative historical settlement with market-level outcomes.
          replace_once('scripts/run_pipeline.py',
              '''                prediction["actual_markets"] = {"over_under": "over" if hs + ass > line else "under", "btts": "yes" if hs > 0 and ass > 0 else "no"}\n                prediction["final_score"] = [hs, ass]''',
              '''                prediction["actual_markets"] = {"over_under": "over" if hs + ass > line else "under", "btts": "yes" if hs > 0 and ass > 0 else "no"}\n                hline = (prediction.get("handicap") or {}).get("line")\n                actual_handicap = None if hline is None else ("home" if hs + float(hline) > ass else "away")\n                prediction["market_results"] = {"over_under": prediction["actual_markets"]["over_under"], "btts": prediction["actual_markets"]["btts"], "handicap": actual_handicap}\n                prediction["final_score"] = [hs, ass]''')
          replace_once('scripts/run_pipeline.py',
              '''                prediction["actual_markets"] = {"total_games": s1 + s2, "sets": len(c1.get("linescores", []))}\n                prediction["final_score"] = [s1, s2]''',
              '''                total_games = s1 + s2\n                sets_played = len(c1.get("linescores", []))\n                games_margin = s1 - s2\n                line = float((prediction.get("analytics", {}).get("total_games") or {}).get("line", 22.5))\n                prediction["actual_markets"] = {"total_games": total_games, "sets": sets_played}\n                prediction["market_results"] = {"games_ou": "over" if total_games > line else "under", "games_margin_direction": "p1" if games_margin > 0 else "p2" if games_margin < 0 else "push", "straight_sets": sets_played == 2}\n                prediction["final_score"] = [s1, s2]''')
          replace_once('scripts/run_pipeline.py',
              '''            probs = prediction.get("probabilities", {})\n            brier = sum((probs.get(k, 0) - (1 if actual == k else 0)) ** 2 for k in probs)\n            prediction.update({"settled": True, "settled_at": datetime.now(timezone.utc).isoformat(), "actual": actual, "correct": prediction["pick"] == actual, "brier": round(brier, 6)})''',
              '''            probs = prediction.get("probabilities", {})\n            brier = sum((probs.get(k, 0) - (1 if actual == k else 0)) ** 2 for k in probs)\n            if prediction.get("sport") == "football":\n                m = prediction.get("markets", {})\n                h = prediction.get("handicap", {})\n                picks = {"over_under": (m.get("over_under") or {}).get("pick"), "btts": (m.get("btts") or {}).get("pick"), "handicap": h.get("pick") or ("home" if h.get("home_cover", 0) >= h.get("away_cover", 0) else "away")}\n            else:\n                a = prediction.get("analytics", {})\n                picks = {"games_ou": (a.get("total_games") or {}).get("pick"), "games_margin_direction": (a.get("games_handicap") or {}).get("pick")}\n            mr = prediction.get("market_results", {})\n            prediction["market_correct"] = {k: (mr.get(k) == v) if mr.get(k) is not None and v is not None else None for k, v in picks.items()}\n            prediction.update({"settled": True, "settled_at": datetime.now(timezone.utc).isoformat(), "actual": actual, "correct": prediction["pick"] == actual, "brier": round(brier, 6)})''')

          # Make same-day settlement reuse the authoritative function, preventing two divergent implementations.
          p = Path('scripts/settle_same_day.py'); s = p.read_text(encoding='utf-8')
          if 'from run_pipeline import settle_predictions' not in s:
              start = s.index('def settle(history):')
              end = s.index('\n\ndef main():', start)
              s = s[:start] + '''from run_pipeline import settle_predictions\n\ndef settle(history):\n    before = sum(1 for p in history if p.get("settled"))\n    history[:] = settle_predictions(history)\n    return sum(1 for p in history if p.get("settled")) - before\n''' + s[end:]
              p.write_text(s, encoding='utf-8')

          Path('netlify.toml').unlink(missing_ok=True)
          print('All maintenance patches applied.')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/predict_today.py scripts/run_pipeline.py scripts/settle_same_day.py netlify.toml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: harden WTA normalization and settlement analytics"
          git push origin main
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/maintenance-fix.yml || true
          git commit -m "chore: remove one-time maintenance workflow" || true
          git push origin main || true
