name: Tennis Set Market Regression

on:
  push:
    branches:
      - main
      - feature/tennis-set-market-engine
    paths:
      - 'scripts/tennis_set_market_model.py'
      - 'scripts/tennis_set_market_reassessment.py'
      - 'scripts/test_tennis_set_market_model.py'
      - 'scripts/test_tennis_set_market_reassessment.py'
      - 'scripts/predict_today.py'
      - 'scripts/settle_tennis_history.py'
      - 'scripts/odds_builder.py'
      - '.github/workflows/tennis-set-market-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tennis-set-market-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade requests curl_cffi
      - name: Compile set-market modules
        run: python -m py_compile scripts/tennis_set_market_model.py scripts/tennis_set_market_reassessment.py scripts/predict_today.py scripts/settle_tennis_history.py
      - name: Run set-outcome model tests
        run: PYTHONPATH=scripts python scripts/test_tennis_set_market_model.py
      - name: Run exact SportyBet market-mapping tests
        run: PYTHONPATH=scripts python scripts/test_tennis_set_market_reassessment.py
