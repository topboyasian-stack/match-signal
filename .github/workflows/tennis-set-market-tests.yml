name: Tennis Set Market Regression

on:
  push:
    branches:
      - main
      - feature/tennis-set-market-engine
    paths:
      - 'scripts/tennis_set_market_model.py'
      - 'scripts/tennis_set_market_reassessment.py'
      - 'scripts/test_tennis_set_market_model.py'
      - 'scripts/test_tennis_set_market_reassessment.py'
      - 'scripts/test_tennis_set_market_settlement.py'
      - 'scripts/test_tennis_set_market_booking_contract.py'
      - 'scripts/test_tennis_set_market_booking.mjs'
      - 'scripts/predict_today.py'
      - 'scripts/settle_tennis_history.py'
      - 'scripts/odds_ticket_tracker.py'
      - 'scripts/odds_builder.py'
      - 'functions/api/sportybet-booking.js'
      - 'ticket-drawer.js'
      - 'expansion-odds-builder.js'
      - 'scripts/tennis_set_market_reassessment.py'
      - 'scripts/test_tennis_set_market_model.py'
      - 'scripts/test_tennis_set_market_reassessment.py'
      - 'scripts/predict_today.py'
      - 'scripts/settle_tennis_history.py'
      - 'scripts/odds_builder.py'
      - '.github/workflows/tennis-set-market-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tennis-set-market-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade requests curl_cffi
      - name: Compile set-market Python modules
        run: python -m py_compile scripts/tennis_set_market_model.py scripts/tennis_set_market_reassessment.py scripts/predict_today.py scripts/settle_tennis_history.py scripts/odds_ticket_tracker.py
      - name: Check JavaScript integrations
        run: |
          node --check functions/api/sportybet-booking.js
          node --check ticket-drawer.js
          node --check expansion-odds-builder.js
          node --check scripts/test_tennis_set_market_booking.mjs
      - name: Run set-outcome model tests
        run: PYTHONPATH=scripts python scripts/test_tennis_set_market_model.py
      - name: Run exact SportyBet market-mapping tests
        run: PYTHONPATH=scripts python scripts/test_tennis_set_market_reassessment.py
      - name: Run set-market settlement tests
        run: PYTHONPATH=scripts python scripts/test_tennis_set_market_settlement.py
      - name: Run end-to-end booking contract tests
        run: |
          PYTHONPATH=scripts python scripts/test_tennis_set_market_booking_contract.py
          python scripts/test_ticket_drawer_contract.py
      - name: Run live exact-quote booking regressions
        run: node scripts/test_tennis_set_market_booking.mjs
