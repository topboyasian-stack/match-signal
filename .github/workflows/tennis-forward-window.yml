name: Match Signal Tennis Forward Window

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  extend-tennis-window:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Snapshot latest main feed
        run: git show origin/main:data/predictions.json > /tmp/latest_predictions.json

      - name: Extend ATP/WTA singles discovery to 14 days
        run: python scripts/tennis_forward_window.py

      - name: Merge only new tennis rows into latest main feed
        run: python scripts/merge_generated_feed.py /tmp/latest_predictions.json data/predictions.json

      - name: Rebase publication onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_predictions.json /tmp/pre_window_latest.json
          # Re-run the window against the latest tree, then merge its genuinely new rows.
          python scripts/tennis_forward_window.py
          python scripts/merge_generated_feed.py /tmp/pre_window_latest.json data/predictions.json

      - name: Commit extended tennis coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/tennis_forward_status.json
          if git diff --cached --quiet; then
            echo "No forward-window changes."
            exit 0
          fi
          git commit -m "🎾 Extend ATP/WTA singles prediction window"
          git push origin main
