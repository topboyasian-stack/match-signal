name: Match Signal Tennis Forward Window

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  extend-tennis-window:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate and publish extended tennis coverage with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          # Multiple automation workflows publish to main concurrently. Build
          # against the newest feed on every attempt so valid tennis rows and
          # their discovery report are not lost to a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            echo "Tennis forward-window publication attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            git show origin/main:data/predictions.json > /tmp/pre_window_latest.json

            python scripts/tennis_forward_window.py
            python scripts/merge_generated_feed.py /tmp/pre_window_latest.json data/predictions.json

            git add data/predictions.json data/tennis_forward_status.json
            if git diff --cached --quiet; then
              echo "No forward-window changes to publish."
              exit 0
            fi

            git commit -m "🎾 Extend ATP singles discovery window"
            if git push origin main; then
              echo "Published current tennis discovery report and additive fixture rows."
              exit 0
            fi

            echo "main moved during tennis publication; rebuilding against the newest main before retrying."
            sleep $((attempt * 2))
          done

          echo "Failed to publish tennis forward-window data after five attempts." >&2
          exit 1
