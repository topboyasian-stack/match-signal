name: Odds Builder Settled-Lane Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/odds_builder_core.py'
      - 'scripts/odds_builder.py'
      - 'scripts/test_odds_builder_upcoming_desk_recent_losses.py'
      - 'scripts/test_odds_builder_atomic_ticket_registration.py'
      - 'scripts/test_odds_ticket_tracker_register_only.py'
      - 'scripts/odds_ticket_tracker.py'
      - '.github/workflows/odds_builder.yml'
      - '.github/workflows/odds-builder-settled-lane-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settled-lane-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Run settled-lane and pending-event regressions
        run: python scripts/test_odds_builder_upcoming_desk_recent_losses.py
      - name: Test atomic Builder batch and pending-event publication
        run: python scripts/test_odds_builder_atomic_ticket_registration.py
      - name: Test bounded ticket registration without result refresh
        run: python scripts/test_odds_ticket_tracker_register_only.py
      - name: Compile Builder and regression modules
        run: python -m py_compile scripts/odds_builder_core.py scripts/odds_builder.py scripts/test_odds_builder_upcoming_desk_recent_losses.py
