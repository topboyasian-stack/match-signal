name: Match Signal Builder Production Promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/builder-production-promotion.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # A new queue identity lets the repaired promotion bypass jobs stuck in the old SHA matcher.
  group: builder-production-promotion-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the repository for GitHub CLI context
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch Unified Upcoming and wait for successful board publication
        id: board-refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run unified-upcoming.yml --ref main
          board_run_id=""
          for attempt in $(seq 1 60); do
            # Main may advance after checkout while refresh jobs commit their data.
            # Accept the dispatched board run only if its SHA descends from source_sha.
            board_candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unified-upcoming.yml/runs?branch=main&event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$dispatched_at\") | [.id, .head_sha] | @tsv" | head -n 1)"
            if [ -n "$board_candidate" ]; then
              candidate_id="$(printf '%s\n' "$board_candidate" | cut -f1)"
              candidate_sha="$(printf '%s\n' "$board_candidate" | cut -f2)"
              merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$candidate_sha" --jq '.merge_base_commit.sha')"
              if [ "$merge_base" = "$source_sha" ]; then
                board_run_id="$candidate_id"
                board_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.status')"
                if [ "$board_status" = "completed" ]; then
                  board_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.conclusion')"
                  if [ "$board_conclusion" != "success" ]; then
                    echo "Unified Upcoming run $board_run_id completed with conclusion=$board_conclusion; refusing to deploy a stale board." >&2
                    exit 1
                  fi
                  echo "Unified Upcoming run $board_run_id (head $candidate_sha, based on $source_sha) completed successfully."
                  break
                fi
              else
                echo "Ignoring board run $candidate_id because $candidate_sha is not based on $source_sha yet."
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the dispatched Unified Upcoming workflow to complete." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$board_run_id"
          echo "board_run_id=$board_run_id" >> "$GITHUB_OUTPUT"
          echo "board_head_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Verified successful board refresh before Pages promotion."

      - name: Dispatch Pages once after refreshed board and wait for successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_RUN_ID: ${{ steps.board-refresh.outputs.board_run_id }}
          BOARD_HEAD_SHA: ${{ steps.board-refresh.outputs.board_head_sha }}
        run: |
          set -euo pipefail
          test -n "$BOARD_RUN_ID"
          test -n "$BOARD_HEAD_SHA"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Promotion owns the Builder -> board -> Pages chain. Pages no longer listens
          # to board completion, so a refresh cannot trigger a competing deployment.
          gh workflow run cloudflare-pages.yml --ref main
          deploy_run_id=""
          for attempt in $(seq 1 60); do
            if [ -z "$deploy_run_id" ]; then
              candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages.yml/runs?branch=main&event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$dispatched_at\") | [.id, .head_sha] | @tsv")"
              while IFS=$'\t' read -r candidate_id candidate_sha; do
                [ -n "$candidate_id" ] || continue
                merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BOARD_HEAD_SHA...$candidate_sha" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
                if [ "$merge_base" = "$BOARD_HEAD_SHA" ]; then
                  deploy_run_id="$candidate_id"
                  break
                fi
              done <<< "$candidates"
            fi
            if [ -n "$deploy_run_id" ]; then
              deploy_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" --jq '.status')"
              if [ "$deploy_status" = "completed" ]; then
                deploy_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" --jq '.conclusion')"
                if [ "$deploy_conclusion" != "success" ]; then
                  echo "Pages workflow_dispatch $deploy_run_id completed with conclusion=$deploy_conclusion; refusing to mask a failed production freshness check." >&2
                  exit 1
                fi
                echo "Pages workflow_dispatch $deploy_run_id completed successfully after refreshed board run $BOARD_RUN_ID."
                exit 0
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the Pages deployment dispatched after board run $BOARD_RUN_ID." >&2
              exit 1
            fi
            sleep 5
          done
