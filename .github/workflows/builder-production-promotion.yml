name: Match Signal Builder Production Promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/builder-production-promotion.yml"
      - ".github/workflows/cloudflare-pages.yml"
      - ".github/workflows/unified-upcoming.yml"
      - ".github/workflows/odds_builder.yml"
      - ".github/workflows/odds-ticket-tracker.yml"
      - "scripts/odds_builder_core.py"
      - "scripts/odds_ticket_tracker.py"
      - "scripts/ticket_history.py"
      - "scripts/ensure_odds_builder_refresh.py"
      - "scripts/test_ensure_odds_builder_refresh.py"
      - "scripts/test_odds_ticket_tracker.py"
      - "scripts/test_odds_builder_upcoming_desk_recent_losses.py"
      - "scripts/test_compact_efootball_builder.py"
      - "scripts/test_odds_builder_score_replay.py"
      # Football aliases and alternative-only preview use ordered production promotion.
      - "scripts/predict_today.py"
      - "scripts/test_predict_today_market_matching.py"
      - "scripts/cross_sport_market_reassessment.py"
      - "scripts/test_cross_sport_market_reassessment.py"
      # NBA model/runtime and basketball desk changes must use the ordered
      # board -> Odds Builder -> board -> Builder -> Cloudflare promotion path.
      - "scripts/expansion_pipeline.py"
      - "scripts/live_expansion_pipeline.py"
      - "scripts/test_nba_sportybet_totals.py"
      - "scripts/nba_totals_walk_forward.py"
      - "scripts/nba_totals_probability_value_experiment.py"
      - "scripts/capture_nba_totals_prices.py"
      - "scripts/settle_nba_totals.py"
      - "basketball-live.js"
      - "basketball.html"
      - "functions/api/sportybet-booking.js"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Fresh concurrency namespace releases runs waiting on the superseded Unified Upcoming publisher queue; preserve the ordered promotion sequence.
concurrency:
  group: builder-production-promotion-v11
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository for GitHub CLI context
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh Unified Upcoming before rebuilding the Builder
        id: pre-build-board
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          dispatch_count=0
          last_cancelled_board_run_id=""
          gh workflow run unified-upcoming.yml --ref main -f promotion_child=true
          board_run_id=""
          for attempt in $(seq 1 180); do
            board_candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unified-upcoming.yml/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.event == \\"workflow_dispatch\\" and .head_branch == \\"main\\" and .created_at >= \\"$dispatched_at\\") | [.id, .head_sha] | @tsv")"
            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [ -n "$candidate_id" ] || continue
              [ "$candidate_id" != "$last_cancelled_board_run_id" ] || continue
              merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$candidate_sha" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
              [ "$merge_base" = "$source_sha" ] || continue
              board_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.status')"
              if [ "$board_status" = "completed" ]; then
                board_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.conclusion')"
                if [ "$board_conclusion" = "success" ]; then
                  board_run_id="$candidate_id"
                  break
                fi
                if [ "$board_conclusion" = "cancelled" ] || [ "$board_conclusion" = "skipped" ]; then
                  echo "Pre-build Unified Upcoming run $candidate_id was superseded ($board_conclusion); dispatching a fresh promotion-child board run."
                  last_cancelled_board_run_id="$candidate_id"
                  dispatch_count=$((dispatch_count + 1))
                  if [ "$dispatch_count" -gt 5 ]; then
                    echo "Unified Upcoming promotion child was superseded more than five times." >&2
                    exit 1
                  fi
                  sleep 2
                  gh workflow run unified-upcoming.yml --ref main -f promotion_child=true
                  break
                fi
                echo "Pre-build Unified Upcoming run $candidate_id failed: $board_conclusion" >&2
                exit 1
              fi
              # Keep waiting for queued/in-progress candidates. A newer promotion
              # child may supersede this one; the latest eligible run is checked
              # again on the next loop pass.
              break
            done <<< "$board_candidates"
            if [ -n "$board_run_id" ]; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for a successful pre-build Unified Upcoming refresh." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$board_run_id"
          board_published_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/unified_upcoming.json&per_page=10" --jq ".[] | select(.commit.committer.date >= \\"$dispatched_at\\" and (.commit.message | test(\\"Refresh unified upcoming board\\"; \\"i\\"))) | .sha" | head -n 1)"
          if [ -z "$board_published_sha" ]; then
            board_published_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fi
          board_published_at="$(gh api "repos/$GITHUB_REPOSITORY/commits/$board_published_sha" --jq '.commit.committer.date')"
          echo "board_run_id=$board_run_id" >> "$GITHUB_OUTPUT"
          echo "board_published_sha=$board_published_sha" >> "$GITHUB_OUTPUT"
          echo "board_published_at=$board_published_at" >> "$GITHUB_OUTPUT"
          echo "Pre-build board run $board_run_id succeeded; published source $board_published_sha at $board_published_at."
      
      - name: Wait for Builder refresh triggered by the pre-build board
        id: pre-build-builder
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_AT: ${{ steps.pre-build-board.outputs.dispatched_at }}
          BOARD_PUBLISHED_AT: ${{ steps.pre-build-board.outputs.board_published_at }}
        run: |
          set -euo pipefail
          test -n "$DISPATCHED_AT"
          test -n "$BOARD_PUBLISHED_AT"
          builder_run_id=""
          builder_head_sha=""
          for attempt in $(seq 1 180); do
            # Unified Upcoming can produce both a workflow_dispatch Builder and an
            # automatic workflow_run Builder. A queued dispatch can be superseded by
            # the automatic run, so consider both event types after this board publish.
            builder_run_id=""
            builder_head_sha=""
            candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/odds_builder.yml/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.event == \"workflow_dispatch\" and .head_branch == \"main\" and .created_at >= \"$BOARD_PUBLISHED_AT\" or .event == \"workflow_run\" and .head_branch == \"main\" and .created_at >= \"$BOARD_PUBLISHED_AT\") | [.id, .head_sha] | @tsv")"
            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [ -n "$candidate_id" ] || continue
              builder_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.status')"
              if [ "$builder_status" = "completed" ]; then
                builder_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.conclusion')"
                if [ "$builder_conclusion" = "cancelled" ] || [ "$builder_conclusion" = "skipped" ]; then
                  echo "Ignoring superseded pre-build Builder run $candidate_id ($builder_conclusion); scanning the remaining refreshes."
                  continue
                fi
                if [ "$builder_conclusion" != "success" ]; then
                  echo "Pre-build board's Builder refresh $candidate_id failed: $builder_conclusion" >&2
                  exit 1
                fi
                builder_run_id="$candidate_id"
                builder_head_sha="$candidate_sha"
                break
              fi
              builder_run_id="$candidate_id"
              builder_head_sha="$candidate_sha"
              break
            done <<< "$candidates"
            if [ -n "$builder_run_id" ]; then
              builder_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$builder_run_id" --jq '.status')"
              if [ "$builder_status" = "completed" ]; then
                builder_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$builder_run_id" --jq '.conclusion')"
                if [ "$builder_conclusion" = "success" ]; then
                  break
                elif [ "$builder_conclusion" = "cancelled" ] || [ "$builder_conclusion" = "skipped" ]; then
                  echo "Pre-build Builder run $builder_run_id was superseded ($builder_conclusion); re-scanning for the next eligible refresh."
                  builder_run_id=""
                  builder_head_sha=""
                else
                  echo "Pre-build board's Builder refresh $builder_run_id failed: $builder_conclusion" >&2
                  exit 1
                fi
              fi
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for a successful Builder refresh after the pre-build board." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$builder_run_id"
          echo "builder_run_id=$builder_run_id" >> "$GITHUB_OUTPUT"
          echo "builder_head_sha=$builder_head_sha" >> "$GITHUB_OUTPUT"
          echo "Pre-build board's Builder run $builder_run_id succeeded."
      - name: Publish the rebuilt Builder through Unified Upcoming
        id: post-build-board
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          gh workflow run unified-upcoming.yml --ref main -f promotion_child=true
          board_run_id=""
          for attempt in $(seq 1 180); do
            board_candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unified-upcoming.yml/runs?branch=main&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.event == \"workflow_dispatch\" and .head_branch == \"main\" and .created_at >= \"$dispatched_at\") | [.id, .head_sha] | @tsv" | head -n 1)"
            if [ -n "$board_candidate" ]; then
              candidate_id="$(printf '%s\n' "$board_candidate" | cut -f1)"
              candidate_sha="$(printf '%s\n' "$board_candidate" | cut -f2)"
              merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$candidate_sha" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
              if [ "$merge_base" = "$source_sha" ]; then
                board_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.status')"
                if [ "$board_status" = "completed" ]; then
                  board_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.conclusion')"
                  if [ "$board_conclusion" != "success" ]; then
                    echo "Post-build Unified Upcoming run $candidate_id failed: $board_conclusion" >&2
                    exit 1
                  fi
                  board_run_id="$candidate_id"
                  break
                fi
              fi
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for the post-build Unified Upcoming publication." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$board_run_id"
          board_published_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/unified_upcoming.json&per_page=10" --jq ".[] | select(.commit.committer.date >= \"$dispatched_at\" and (.commit.message | test(\"Refresh unified upcoming board\"; \"i\"))) | .sha" | head -n 1)"
          if [ -z "$board_published_sha" ]; then
            board_published_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fi
          board_published_at="$(gh api "repos/$GITHUB_REPOSITORY/commits/$board_published_sha" --jq '.commit.committer.date')"
          echo "board_run_id=$board_run_id" >> "$GITHUB_OUTPUT"
          echo "board_published_sha=$board_published_sha" >> "$GITHUB_OUTPUT"
          echo "board_published_at=$board_published_at" >> "$GITHUB_OUTPUT"
          echo "Post-build board run $board_run_id succeeded; published source $board_published_sha at $board_published_at."

      - name: Wait for Builder refresh triggered by the post-build board
        id: post-build-builder
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_AT: ${{ steps.post-build-board.outputs.dispatched_at }}
          BOARD_PUBLISHED_AT: ${{ steps.post-build-board.outputs.board_published_at }}
        run: |
          set -euo pipefail
          test -n "$DISPATCHED_AT"
          test -n "$BOARD_PUBLISHED_AT"
          builder_run_id=""
          builder_head_sha=""
          for attempt in $(seq 1 180); do
            # Include both manual dispatches and automatic workflow_run refreshes.
            # If one run is superseded, re-scan rather than failing the promotion.
            builder_run_id=""
            builder_head_sha=""
            candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/odds_builder.yml/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.event == \"workflow_dispatch\" and .head_branch == \"main\" and .created_at >= \"$BOARD_PUBLISHED_AT\" or .event == \"workflow_run\" and .head_branch == \"main\" and .created_at >= \"$BOARD_PUBLISHED_AT\") | [.id, .head_sha] | @tsv")"
            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [ -n "$candidate_id" ] || continue
              builder_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.status')"
              if [ "$builder_status" = "completed" ]; then
                builder_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.conclusion')"
                if [ "$builder_conclusion" = "cancelled" ] || [ "$builder_conclusion" = "skipped" ]; then
                  echo "Ignoring superseded post-build Builder run $candidate_id ($builder_conclusion); scanning the remaining refreshes."
                  continue
                fi
                if [ "$builder_conclusion" != "success" ]; then
                  echo "Post-build board's Builder refresh $candidate_id failed: $builder_conclusion" >&2
                  exit 1
                fi
                builder_run_id="$candidate_id"
                builder_head_sha="$candidate_sha"
                break
              fi
              builder_run_id="$candidate_id"
              builder_head_sha="$candidate_sha"
              break
            done <<< "$candidates"
            if [ -n "$builder_run_id" ]; then
              builder_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$builder_run_id" --jq '.status')"
              if [ "$builder_status" = "completed" ]; then
                builder_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$builder_run_id" --jq '.conclusion')"
                if [ "$builder_conclusion" = "success" ]; then
                  break
                elif [ "$builder_conclusion" = "cancelled" ] || [ "$builder_conclusion" = "skipped" ]; then
                  echo "Post-build Builder run $builder_run_id was superseded ($builder_conclusion); re-scanning for the next eligible refresh."
                  builder_run_id=""
                  builder_head_sha=""
                else
                  echo "Post-build board's Builder refresh $builder_run_id failed: $builder_conclusion" >&2
                  exit 1
                fi
              fi
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for a successful Builder refresh after the post-build board." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$builder_run_id"
          echo "builder_run_id=$builder_run_id" >> "$GITHUB_OUTPUT"
          echo "builder_head_sha=$builder_head_sha" >> "$GITHUB_OUTPUT"
          echo "Post-build board's Builder run $builder_run_id succeeded."
      - name: Dispatch Cloudflare Pages after post-build board and Builder publication
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_RUN_ID: ${{ steps.post-build-board.outputs.board_run_id }}
          BOARD_HEAD_SHA: ${{ steps.post-build-board.outputs.board_published_sha }}
          BUILDER_RUN_ID: ${{ steps.post-build-builder.outputs.builder_run_id }}
        run: |
          set -euo pipefail
          test -n "$BOARD_RUN_ID"
          test -n "$BOARD_HEAD_SHA"
          test -n "$BUILDER_RUN_ID"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatched_epoch_us="$(python -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp() * 1000000))' "$dispatched_at")"
          deployment_source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BOARD_HEAD_SHA...$deployment_source_sha" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
          if [ "$merge_base" != "$BOARD_HEAD_SHA" ]; then
            echo "Main is not descended from the post-build board publication; refusing to deploy." >&2
            exit 1
          fi
          gh workflow run cloudflare-pages.yml --ref main
          deploy_run_id=""
          for attempt in $(seq 1 180); do
            deploy_candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages.yml/runs?branch=main&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.event == \"workflow_dispatch\" and .head_branch == \"main\" and .created_at >= \"$dispatched_at\") | [.id, .head_sha] | @tsv" | head -n 1)"
            if [ -n "$deploy_candidate" ]; then
              candidate_id="$(printf '%s\n' "$deploy_candidate" | cut -f1)"
              candidate_sha="$(printf '%s\n' "$deploy_candidate" | cut -f2)"
              merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$deployment_source_sha...$candidate_sha" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
              if [ "$merge_base" = "$deployment_source_sha" ]; then
                deploy_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.status')"
                if [ "$deploy_status" = "completed" ]; then
                  deploy_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" --jq '.conclusion')"
                  if [ "$deploy_conclusion" != "success" ]; then
                    echo "Cloudflare Pages run $candidate_id failed: $deploy_conclusion" >&2
                    exit 1
                  fi
                  deploy_run_id="$candidate_id"
                  break
                fi
              fi
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for a successful Cloudflare Pages deployment." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$deploy_run_id"

          for attempt in $(seq 1 60); do
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/DEPLOY-VERIFY-CLOUDFLARE.json?ref=main" --jq '.content' 2>/dev/null || true)"
            if [ -n "$encoded" ]; then
              payload="$(printf '%s' "$encoded" | base64 --decode 2>/dev/null || true)"
              verification_source="$(printf '%s' "$payload" | jq -r '.source_commit // empty' 2>/dev/null || true)"
              verification_time="$(printf '%s' "$payload" | jq -r '.verified_at // empty' 2>/dev/null || true)"
              verification_status="$(printf '%s' "$payload" | jq -r '.status // empty' 2>/dev/null || true)"
              alternatives_status="$(printf '%s' "$payload" | jq -r '.qualified_alternatives_status // empty' 2>/dev/null || true)"
              alternatives_count="$(printf '%s' "$payload" | jq -r '.qualified_alternatives_count // 0' 2>/dev/null || true)"
              drawer_status="$(printf '%s' "$payload" | jq -r '.shared_ticket_drawer_status // empty' 2>/dev/null || true)"
              booking_status="$(printf '%s' "$payload" | jq -r '.booking_api_status // empty' 2>/dev/null || true)"
              if [ -n "$verification_source" ] && [ -n "$verification_time" ]; then
                verified_epoch_us="$(python -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp() * 1000000))' "$verification_time" 2>/dev/null || echo 0)"
                merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$deployment_source_sha...$verification_source" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
                if [ "$verified_epoch_us" -ge "$dispatched_epoch_us" ] && [ "$merge_base" = "$deployment_source_sha" ]; then
                  booking_state_ready="false"
                  if [ "$verification_status" = "VERIFIED" ] && [ "$booking_status" = "VERIFIED" ]; then
                    booking_state_ready="true"
                  elif [ "$verification_status" = "VERIFIED_WITH_DIAGNOSTIC_INCOMPLETE" ] && [ "$booking_status" = "NO_FUTURE_BATCH" ]; then
                    # Alternatives and drawer are ready, but there is no qualified combined batch.
                    # This completes the alternative-selection mission without claiming a booking code.
                    booking_state_ready="true"
                  fi
                  if [ "$booking_state_ready" != "true" ] || [ "$alternatives_status" != "READY" ] || ! [[ "$alternatives_count" =~ ^[0-9]+$ ]] || [ "$alternatives_count" -le 0 ] || [ "$drawer_status" != "READY" ]; then
                    echo "Fresh Cloudflare deployment did not meet alternative/drawer release readiness: status=$verification_status alternatives=$alternatives_status count=$alternatives_count drawer=$drawer_status booking=$booking_status source=$verification_source." >&2
                    exit 1
                  fi
                  if [ "$booking_status" = "NO_FUTURE_BATCH" ]; then
                    echo "Cloudflare verification confirms $alternatives_count live qualified alternatives and shared drawer readiness for source $verification_source. No qualified combined batch exists; booking/code issuance remains unavailable. Post-build board $BOARD_RUN_ID and Builder run $BUILDER_RUN_ID."
                  else
                    echo "Cloudflare verification $verification_status confirms $alternatives_count live qualified alternative(s), shared drawer readiness and booking verification for source $verification_source; post-build board $BOARD_RUN_ID and Builder run $BUILDER_RUN_ID."
                  fi
                  exit 0
                fi
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Cloudflare deployment succeeded but no matching fresh production verification record was found." >&2
              exit 1
            fi
            sleep 5
          done
