name: Match Signal Builder Production Promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/builder-production-promotion.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # A new queue identity lets the repaired promotion bypass jobs stuck in the old SHA matcher.
  group: builder-production-promotion-v3
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the repository for GitHub CLI context
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch Unified Upcoming and wait for successful board publication
        id: board-refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run unified-upcoming.yml --ref main
          board_run_id=""
          for attempt in $(seq 1 60); do
            # Main may advance after checkout while refresh jobs commit their data.
            # Accept the dispatched board run only if its SHA descends from source_sha.
            board_candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unified-upcoming.yml/runs?branch=main&event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$dispatched_at\") | [.id, .head_sha] | @tsv" | head -n 1)"
            if [ -n "$board_candidate" ]; then
              candidate_id="$(printf '%s\n' "$board_candidate" | cut -f1)"
              candidate_sha="$(printf '%s\n' "$board_candidate" | cut -f2)"
              merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$candidate_sha" --jq '.merge_base_commit.sha')"
              if [ "$merge_base" = "$source_sha" ]; then
                board_run_id="$candidate_id"
                board_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.status')"
                if [ "$board_status" = "completed" ]; then
                  board_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.conclusion')"
                  if [ "$board_conclusion" != "success" ]; then
                    echo "Unified Upcoming run $board_run_id completed with conclusion=$board_conclusion; refusing to deploy a stale board." >&2
                    exit 1
                  fi
                  echo "Unified Upcoming run $board_run_id (head $candidate_sha, based on $source_sha) completed successfully."
                  break
                fi
              else
                echo "Ignoring board run $candidate_id because $candidate_sha is not based on $source_sha yet."
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the dispatched Unified Upcoming workflow to complete." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$board_run_id"
          echo "board_run_id=$board_run_id" >> "$GITHUB_OUTPUT"
          echo "board_head_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Verified successful board refresh before Pages promotion."

      - name: Dispatch Pages once for manually refreshed board and verify the published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_RUN_ID: ${{ steps.board-refresh.outputs.board_run_id }}
          BOARD_HEAD_SHA: ${{ steps.board-refresh.outputs.board_head_sha }}
        run: |
          set -euo pipefail
          test -n "$BOARD_RUN_ID"
          test -n "$BOARD_HEAD_SHA"
          dispatched_at="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())')"
          dispatched_epoch_us="$(python -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1]).timestamp() * 1000000))' "$dispatched_at")"
          gh workflow run cloudflare-pages.yml --ref main
          for attempt in $(seq 1 60); do
            # A deploy verification artifact is committed only after production smoke tests pass.
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/DEPLOY-VERIFY-CLOUDFLARE.json?ref=main" --jq '.content' 2>/dev/null || true)"
            if [ -n "$encoded" ]; then
              payload="$(printf '%s' "$encoded" | base64 --decode 2>/dev/null || true)"
              verification_source="$(printf '%s' "$payload" | jq -r '.source_commit // empty' 2>/dev/null || true)"
              verification_time="$(printf '%s' "$payload" | jq -r '.verified_at // empty' 2>/dev/null || true)"
              verification_status="$(printf '%s' "$payload" | jq -r '.status // empty' 2>/dev/null || true)"
              if [ -n "$verification_source" ] && [ -n "$verification_time" ] && [[ "$verification_status" == VERIFIED* ]]; then
                verified_epoch_us="$(python -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp() * 1000000))' "$verification_time" 2>/dev/null || echo 0)"
                merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BOARD_HEAD_SHA...$verification_source" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
                if [ "$verified_epoch_us" -ge "$dispatched_epoch_us" ] && [ "$merge_base" = "$BOARD_HEAD_SHA" ]; then
                  echo "Production verification artifact $verification_status for source $verification_source was recorded after the Pages dispatch and descends from board run $BOARD_RUN_ID."
                  exit 0
                fi
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for a fresh successful DEPLOY-VERIFY-CLOUDFLARE.json after board run $BOARD_RUN_ID." >&2
              exit 1
            fi
            sleep 5
          done
