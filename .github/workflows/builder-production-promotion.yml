name: Match Signal Builder Production Promotion

on:
  workflow_run:
    workflows: ["Match Signal Odds Builder"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/builder-production-promotion.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  promote:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the repository for GitHub CLI context
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch Unified Upcoming and wait for successful board publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run unified-upcoming.yml --ref main
          board_run_id=""
          for attempt in $(seq 1 60); do
            board_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unified-upcoming.yml/runs?branch=main&event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"$source_sha\" and .created_at >= \"$dispatched_at\") | .id" | head -n 1)"
            if [ -n "$board_run_id" ]; then
              board_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.status')"
              if [ "$board_status" = "completed" ]; then
                board_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$board_run_id" --jq '.conclusion')"
                if [ "$board_conclusion" != "success" ]; then
                  echo "Unified Upcoming run $board_run_id completed with conclusion=$board_conclusion; refusing to deploy a stale board." >&2
                  exit 1
                fi
                echo "Unified Upcoming run $board_run_id completed successfully."
                break
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the dispatched Unified Upcoming workflow to complete." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$board_run_id"
          echo "Verified successful board refresh before Pages promotion."

      - name: Dispatch Cloudflare Pages after successful board refresh and wait for deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run cloudflare-pages.yml --ref main
          deploy_run_id=""
          for attempt in $(seq 1 60); do
            deploy_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages.yml/runs?branch=main&event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$dispatched_at\") | .id" | head -n 1)"
            if [ -n "$deploy_run_id" ]; then
              deploy_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" --jq '.status')"
              if [ "$deploy_status" = "completed" ]; then
                deploy_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" --jq '.conclusion')"
                if [ "$deploy_conclusion" != "success" ]; then
                  echo "Cloudflare deployment run $deploy_run_id completed with conclusion=$deploy_conclusion." >&2
                  exit 1
                fi
                echo "Cloudflare deployment run $deploy_run_id completed successfully, after a verified fresh Unified Upcoming run."
                exit 0
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the dispatched Cloudflare Pages deployment to complete." >&2
              exit 1
            fi
            sleep 5
          done
