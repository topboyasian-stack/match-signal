name: Match Signal Builder Production Promotion

on:
  workflow_run:
    workflows: ["Match Signal Odds Builder"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Unified Upcoming refresh before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run unified-upcoming.yml --ref main
          echo "Unified Upcoming refresh dispatched after successful Builder completion; Cloudflare Pages deploy follows successful board publication."
