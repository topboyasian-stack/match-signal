name: Match Signal Post-Pipeline Live Feed Reconcile

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: match-signal-expansion-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Repair and publish Eredivisie live-experimental feed
        run: python scripts/repair_ere_live.py

      - name: QA the repaired Eredivisie feed
        run: python scripts/qa_ere_live.py

      - name: Assert isolated Eredivisie feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/ere_divisie_predictions.json').read_text())
          if not data:
              raise SystemExit('ABORT: isolated Eredivisie feed is empty')
          print(f'Isolated Eredivisie reconciliation: {len(data)} rows')
          PY

      - name: Commit isolated expansion feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ere_divisie_history.json data/ere_divisie_predictions.json data/expansion_status.json data/ere_divisie_qa.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 Reconcile isolated live experimental Eredivisie feed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/repair_ere_live.py
            python scripts/qa_ere_live.py
            git add data/ere_divisie_history.json data/ere_divisie_predictions.json data/expansion_status.json data/ere_divisie_qa.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "🤖 Reconcile isolated live experimental Eredivisie feed"
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
