name: Match Signal Live Expansion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live_expansion_pipeline.py'
      - 'scripts/run_live_expansion.py'
      - 'scripts/repair_ere_live.py'
      - 'scripts/eredivisie_source.py'
      - 'scripts/qa_ere_live.py'
      - 'scripts/settle_expansion.py'
      - '.github/workflows/live-expansion.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  live-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas pyarrow

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate live-experimental NBA + Eredivisie signals
        run: python scripts/run_live_expansion.py

      - name: Repair and publish Eredivisie from resilient current-season sources
        run: python scripts/repair_ere_live.py

      - name: Assert current Eredivisie fixtures were actually published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/ere_divisie_predictions.json').read_text())
          status = json.loads(Path('data/expansion_status.json').read_text())
          fixtures = status.get('competitions', {}).get('Eredivisie', {}).get('current_fixtures', 0)
          if fixtures < 1 or len(data) < 1:
              raise SystemExit(f'ABORT: live Eredivisie publication is empty (fixtures={fixtures}, predictions={len(data)})')
          main_feed = json.loads(Path('data/predictions.json').read_text())
          ere_main = [p for p in main_feed if p.get('league') == 'Eredivisie']
          if len(ere_main) < 1:
              raise SystemExit(f'ABORT: main prediction feed is missing Eredivisie rows (rows={len(ere_main)})')
          print(f'Publication guard passed: {fixtures} fixtures / {len(data)} Eredivisie predictions / {len(ere_main)} main-feed rows')
          PY

      - name: QA Eredivisie predictions before settlement/publication
        run: python scripts/qa_ere_live.py

      - name: Settle completed expansion signals
        run: python scripts/settle_expansion.py

      - name: Reconcile expansion publication onto latest main
        shell: bash
        run: |
          set -euo pipefail
          cp data/predictions.json /tmp/expansion_generated_predictions.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('data/predictions.json').read_text())
          generated = json.loads(Path('/tmp/expansion_generated_predictions.json').read_text())

          # The main feed is the active prediction feed consumed by the frontend.
          # Replace the entire active Eredivisie slice on every expansion run so
          # fixtures that have rolled out of the current season window cannot stay
          # visible as stale cards. Keep every non-Eredivisie prediction untouched.
          ere_generated = [r for r in generated if r.get('league') == 'Eredivisie']
          latest = [r for r in latest if r.get('league') != 'Eredivisie']
          latest.extend(ere_generated)
          latest.sort(key=lambda r: (str(r.get('start_time') or ''), str(r.get('sport') or ''), str(r.get('player_1') or '')))
          Path('data/predictions.json').write_text(json.dumps(latest, indent=2, ensure_ascii=False))
          print(f'Current-feed replacement: {len(latest)} total rows; {len(ere_generated)} current Eredivisie rows; stale Eredivisie rows removed')
          PY

      - name: Verify current Eredivisie feed after reconciliation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          rows = json.loads(Path('data/predictions.json').read_text())
          ere = [r for r in rows if r.get('league') == 'Eredivisie']
          if not ere:
              raise SystemExit('ABORT: no Eredivisie rows remain after reconciliation')
          print(f'Final main feed: {len(rows)} rows / {len(ere)} current Eredivisie rows')
          for r in ere:
              print(r.get('event_id'), r.get('start_time'))
          PY

      - name: Commit generated expansion data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/ere_divisie_history.json data/nba_history.json data/ere_divisie_predictions.json data/nba_predictions.json data/expansion_status.json data/expansion_prediction_history.json data/expansion_live_performance.json data/ere_divisie_qa.json
          if git diff --cached --quiet; then
            echo "No expansion data changes."
            exit 0
          fi
          git commit -m "🤖 Refresh live experimental NBA and Eredivisie signals"
          git push origin main
