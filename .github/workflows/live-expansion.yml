name: Match Signal Live Expansion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live_expansion_pipeline.py'
      - 'scripts/repair_ere_live.py'
      - 'scripts/eredivisie_source.py'
      - 'scripts/qa_ere_live.py'
      - 'scripts/settle_expansion.py'
      - '.github/workflows/live-expansion.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-live-expansion
  cancel-in-progress: false

jobs:
  live-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas pyarrow

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate live-experimental NBA + Eredivisie signals
        run: python scripts/live_expansion_pipeline.py

      - name: Repair and publish Eredivisie from resilient current-season sources
        run: python scripts/repair_ere_live.py

      - name: Assert current Eredivisie fixtures were actually published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/ere_divisie_predictions.json').read_text())
          status = json.loads(Path('data/expansion_status.json').read_text())
          fixtures = status.get('competitions', {}).get('Eredivisie', {}).get('current_fixtures', 0)
          if fixtures < 1 or len(data) < 1:
              raise SystemExit(f'ABORT: live Eredivisie publication is empty (fixtures={fixtures}, predictions={len(data)})')
          print(f'Publication guard passed: {fixtures} fixtures / {len(data)} predictions')
          PY

      - name: QA Eredivisie predictions before settlement/publication
        run: python scripts/qa_ere_live.py

      - name: Settle completed expansion signals
        run: python scripts/settle_expansion.py

      - name: Commit generated expansion data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ere_divisie_history.json data/nba_history.json data/ere_divisie_predictions.json data/nba_predictions.json data/expansion_status.json data/expansion_prediction_history.json data/expansion_live_performance.json data/ere_divisie_qa.json
          if git diff --cached --quiet; then
            echo "No expansion data changes."
            exit 0
          fi
          git commit -m "🤖 Refresh live experimental NBA and Eredivisie signals"
          git push origin main

      # data/** changes automatically trigger the existing deploy-pages.yml workflow.
