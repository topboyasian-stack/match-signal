name: Match Signal Monetization Research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/build_monetization_ledger.py'
      - 'scripts/market_research.py'
      - 'data/predictions.json'
      - 'data/prediction_history.json'
      - 'data/accuracy.json'
      - '.github/workflows/monetization_pipeline.yml'
permissions:
  contents: write
concurrency:
  group: match-signal-monetization-research
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Syntax validation
        run: python -m py_compile scripts/build_monetization_ledger.py scripts/market_research.py
      - name: Build verified ledger
        run: python scripts/build_monetization_ledger.py
      - name: Run event-market research
        run: python scripts/market_research.py
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['verified_tip_ledger.json','tippingsports_export.json','market_research.json']:
              p=Path('data')/name
              assert p.exists(), name
              json.loads(p.read_text())
              print('validated', name)
          PY
      - name: Commit generated research artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified_tip_ledger.json data/tippingsports_export.json data/tippingsports_export.csv data/market_research.json
          git diff --cached --quiet || git commit -m '🤖 Refresh monetization research artifacts'
          git push
