name: One-time NBA Manual Subset Share-Code Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba-manual-subset-share-code-probe.yml"

permissions:
  contents: read

jobs:
  live-manual-nba-subset:
    if: ${{ contains(github.event.head_commit.message, 'Run NBA manual subset share-code diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate and verify a real code for four active selections from the user's ticket
        env:
          MATCH_SIGNAL_ORIGIN: https://match-signal.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const origin=process.env.MATCH_SIGNAL_ORIGIN;
          const targets=[
            {home:'Minnesota Timberwolves',away:'Portland Trail Blazers',line:238.5,side:'under'},
            {home:'San Antonio Spurs',away:'Detroit Pistons',line:234.5,side:'under'},
            {home:'LA Clippers',away:'Utah Jazz',line:212.5,side:'over'},
            {home:'Los Angeles Lakers',away:'Charlotte Hornets',line:208.5,side:'over'}
          ];
          const timeout=ms=>AbortSignal.timeout(ms);
          async function get(url,options={}) {
            const r=await fetch(url,{...options,headers:{Accept:'application/json','Cache-Control':'no-cache','Pragma':'no-cache',...(options.headers||{})},cache:'no-store',signal:timeout(25000)});
            const raw=await r.text(); let body;
            try{body=JSON.parse(raw);}catch{throw new Error('Non-JSON HTTP '+r.status+': '+raw.slice(0,200));}
            return {r,body};
          }
          const now=Date.now();
          const {r:fr,body:feed}=await get(origin+'/api/sportybet-basketball?pageSize=100&pageNum=1&timeline=96&_t='+now);
          if(!fr.ok||feed?.ok!==true||!Array.isArray(feed.events)||(feed.source_errors||[]).length) throw new Error('Current SportyBet basketball feed is not healthy.');
          const observed=Date.parse(String(feed.fetched_at||''));
          if(!Number.isFinite(observed)||observed>now+120000||now-observed>15*60*1000) throw new Error('Quote feed is not fresh enough for a live diagnostic.');
          const legs=[],details=[];
          for(const t of targets){
            const e=feed.events.find(x=>[x.home,x.away].includes(t.home)&&[x.home,x.away].includes(t.away)&&x.home!==x.away);
            const start=Date.parse(String(e?.start_time||''));
            const m=(e?.markets||[]).find(x=>String(x.id)==='225'&&String(x.specifier||'')==='total='+t.line&&String(x.status||'0')==='0');
            const os=m?.outcomes||[];
            const over=os.find(o=>/\bover\b/i.test(String(o.name||''))&&o.active!==false&&Number(o.odds)>1);
            const under=os.find(o=>/\bunder\b/i.test(String(o.name||''))&&o.active!==false&&Number(o.odds)>1);
            const selected=t.side==='over'?over:under;
            if(!e||!Number.isFinite(start)||start<=now+120000||!m||!over||!under||!selected) throw new Error('A diagnostic leg is not currently open with the exact market-225 line; no code requested.');
            legs.push({event_id:'manual-nba-diagnostic-'+e.event_id,sportybet_event_id:String(e.event_id),sport:'basketball',market:'total',pick:t.side,line:t.line,market_id:'225',model_qualified:false,start_time:new Date(start).toISOString(),player_1:t.home,player_2:t.away,match:t.home+' vs '+t.away});
            details.push({match:t.home+' vs '+t.away,line:t.line,side:t.side,selected_odds:Number(selected.odds),quote_age_seconds:Math.round((now-observed)/1000),status:m.status});
          }
          console.log('Diagnostic subset: four exact active selections from the user's five-leg ticket; Toronto O201.5 is intentionally excluded because its current market status is suspended. '+JSON.stringify(details));
          const {r,body}=await get(origin+'/api/sportybet-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'manual',manual_selections:legs})});
          console.log('Live manual booking result: '+JSON.stringify({http_status:r.status,ok:body?.ok===true,error:body?.error||null,message:body?.message||null,selection_count:body?.selection_count??null,combined_odds:body?.combined_odds??null,validation:body?.validation??body?.selections??null}));
          if(!r.ok||body?.ok!==true||!String(body.booking_code||'').trim()||Number(body.selection_count)!==4) throw new Error('The production manual booking endpoint did not return a real code for all four validated selections.');
          console.log('CONFIRMED_DIAGNOSTIC_SUBSET_BOOKING_CODE='+String(body.booking_code).trim());
          console.log('CONFIRMED_DIAGNOSTIC_SUBSET_SHARE_URL='+String(body.share_url||''));
          console.log('PASS: production generated a real SportyBet share code for four exact active NBA market-225 selections. No stake or wager was placed. This is a diagnostic subset, not the requested five-leg slip.');
          NODE
