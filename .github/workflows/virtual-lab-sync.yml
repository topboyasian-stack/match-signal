name: Match Signal Virtual Lab Live Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/virtual_lab_sync.py'
      - '.github/workflows/virtual-lab-sync.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-virtual-lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: python -m pip install --upgrade requests

      - name: Sync latest virtual/eFootball/SRL feed
        env:
          MATCH_SIGNAL_PUBLIC_BASE: https://match-signal.pages.dev
        run: python scripts/virtual_lab_sync.py

      - name: Validate collected feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/virtual_lab_live.json')
          d=json.loads(p.read_text())
          assert d.get('status') == 'LIVE', f"virtual lab status={d.get('status')}"
          assert int(d.get('events_count',0)) > 0, "virtual lab event count is zero"
          print("Virtual Lab live snapshot:", d.get('events_count'), "events")
          print("Products:", d.get('product_counts'))
          print("Sources:", d.get('source'))
          PY

      - name: Publish live snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/virtual_lab_live.json
          if git diff --cached --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "🤖 Refresh Virtual Lab live feed"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Virtual Lab live snapshot published on attempt ${attempt}."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort 2>/dev/null || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
