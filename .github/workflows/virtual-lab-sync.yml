name: Match Signal Virtual Lab Live Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/virtual_lab_sync.py'
      - '.github/workflows/virtual-lab-sync.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-virtual-lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: python -m pip install --upgrade requests

      - name: Sync latest virtual/eFootball/SRL feed
        env:
          MATCH_SIGNAL_PUBLIC_BASE: https://match-signal.pages.dev
        run: python scripts/virtual_lab_sync.py

      - name: Validate collected feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/virtual_lab_live.json')
          d=json.loads(p.read_text())
          assert d.get('status') == 'LIVE', f"virtual lab status={d.get('status')}"
          assert int(d.get('events_count',0)) > 0, "virtual lab event count is zero"
          print("Virtual Lab live snapshot:", d.get('events_count'), "events")
          print("Products:", d.get('product_counts'))
          print("Sources:", d.get('source'))
          PY

      - name: Publish live snapshot without overwriting newer data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/virtual_lab_live.json /tmp/virtual_lab_live_candidate.json
          git add data/virtual_lab_live.json
          if git diff --cached --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "🤖 Refresh Virtual Lab live feed"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Virtual Lab live snapshot published on attempt ${attempt}."
              exit 0
            fi
            echo "Concurrent main update detected; comparing snapshot timestamps (attempt ${attempt})."
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          cand=json.loads(Path('/tmp/virtual_lab_live_candidate.json').read_text())
          remote=json.loads(Path('data/virtual_lab_live.json').read_text()) if Path('data/virtual_lab_live.json').exists() else {}
          def ts(d):
              try: return datetime.fromisoformat(str(d).replace('Z','+00:00'))
              except Exception: return datetime.min.replace(tzinfo=timezone.utc)
          if ts(remote.get('updated_at')) >= ts(cand.get('updated_at')):
              print('Remote Virtual Lab snapshot is newer or equal; keeping remote snapshot.')
              raise SystemExit(10)
          Path('data/virtual_lab_live.json').write_text(Path('/tmp/virtual_lab_live_candidate.json').read_text())
          print('Candidate snapshot is newer; republishing it on top of latest main.')
          PY
            rc=$?
            if [ "$rc" -eq 10 ]; then
              exit 0
            fi
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            git add data/virtual_lab_live.json
            git commit -m "🤖 Refresh Virtual Lab live feed"
            sleep $((attempt * 2))
          done
          exit 1
