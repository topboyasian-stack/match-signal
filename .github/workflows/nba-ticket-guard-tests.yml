name: NBA ticket fail-closed regression tests

on:
  push:
    branches: [main]
    paths:
      - 'basketball.html'
      - 'basketball-design.css'
      - 'basketball-live.js'
      - 'functions/api/sportybet-booking.js'
      - 'functions/api/sportybet-basketball.js'
      - 'functions/api/sportybet-basketball-booking.js'
      - 'scripts/test_basketball_booking_guard.mjs'
      - 'scripts/test_nba_ticket_guard.mjs'
      - 'scripts/test_basketball_desk_contract.mjs'
      - '.github/workflows/nba-totals-price-capture.yml'
      - '.github/workflows/nba-totals-settlement.yml'
      - '.github/workflows/nba-totals-probability-value.yml'
      - '.github/workflows/nba-totals-capture-watchdog.yml'
      - '.github/workflows/nba-ticket-guard-tests.yml'
  pull_request:
    paths:
      - 'basketball.html'
      - 'basketball-design.css'
      - 'basketball-live.js'
      - 'functions/api/sportybet-booking.js'
      - 'functions/api/sportybet-basketball.js'
      - 'functions/api/sportybet-basketball-booking.js'
      - 'scripts/test_basketball_booking_guard.mjs'
      - 'scripts/test_nba_ticket_guard.mjs'
      - 'scripts/test_basketball_desk_contract.mjs'
      - '.github/workflows/nba-totals-price-capture.yml'
      - '.github/workflows/nba-totals-settlement.yml'
      - '.github/workflows/nba-totals-probability-value.yml'
      - '.github/workflows/nba-totals-capture-watchdog.yml'
      - '.github/workflows/nba-ticket-guard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-ticket-guard-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all-or-nothing NBA ticket tests
        run: node --test scripts/test_nba_ticket_guard.mjs scripts/test_basketball_booking_guard.mjs
      - name: Run Basketball page, live feed, odds-display and shared-ticket contract
        run: node scripts/test_basketball_desk_contract.mjs
