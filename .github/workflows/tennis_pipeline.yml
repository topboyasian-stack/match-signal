name: Match Signal Live Prediction Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'qa/**'
      - '.github/workflows/tennis_pipeline.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: true

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-13-model-v4-statistical-value"
  STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests curl_cffi
      - name: Sync with latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Build live football and tennis predictions and settle historical picks
        run: python scripts/run_pipeline.py
      - name: Build 90-day independent football team history
        run: python scripts/build_football_team_history.py
      - name: Enrich football predictions with pure market snapshot
        run: python scripts/enrich_market_snapshot.py
      - name: Settle newly completed same-day fixtures
        run: python scripts/settle_same_day.py
      - name: Refine weak-signal tennis analytics
        run: python scripts/calibrate_tennis_analytics.py
      - name: Build basketball coverage and OddsPapi/Stake market signals
        run: PYTHONPATH=. python scripts/basketball_oddspapi_runner.py
      - name: Fit walk-forward statistical calibration
        run: PYTHONPATH=. python scripts/calibrate_models.py
      - name: Apply independent statistical model, market benchmark and value layer
        run: PYTHONPATH=. python scripts/model_upgrade.py
      - name: Run empirical model risk gate
        run: python scripts/model_guard.py
      - name: Run prediction QA gate
        run: python qa/prediction_qa.py
      - name: Commit generated data and QA report
        id: commit-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_history.json data/accuracy.json data/pipeline_status.json data/risk_gate.json data/calibration.json data/football_team_history.json data/basketball_predictions.json data/basketball_history.json data/basketball_accuracy.json data/basketball_provider_cache.json qa/report.json
          if git diff --cached --quiet; then
            echo "No generated data or QA changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🤖 Refresh statistical predictions, calibration, value and QA"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
