name: Match Signal Live Prediction Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Build live predictions and settle historical picks
        run: python scripts/predict_today.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_history.json data/accuracy.json data/pipeline_status.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "🤖 Refresh Match Signal predictions and accuracy"
            git push origin main
          fi
