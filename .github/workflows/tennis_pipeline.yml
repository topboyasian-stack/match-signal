name: Match Signal Live Prediction Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'qa/**'
      - '.github/workflows/tennis_pipeline.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: true

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-14-nba-parquet-expansion-validation"
  STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests curl_cffi pandas pyarrow
      - name: Sync with latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Build scoped daily Football and Tennis predictions and settle historical picks
        run: python scripts/scoped_pipeline.py
      - name: Build scoped 365-day independent football team history
        run: python scripts/build_football_team_history.py
      - name: Enrich football predictions with pure market snapshot
        run: python scripts/enrich_market_snapshot.py
      - name: Settle newly completed same-day fixtures
        run: python scripts/settle_same_day.py
      - name: Refine weak-signal tennis analytics
        run: python scripts/calibrate_tennis_analytics.py
      - name: Build basketball coverage and OddsPapi/Stake market signals
        run: PYTHONPATH=. python scripts/basketball_oddspapi_runner.py
      - name: Build NBA + Eredivisie expansion research datasets
        run: PYTHONPATH=. python scripts/expansion_pipeline.py
      - name: Deep walk-forward validate NBA + Eredivisie and build recent-form snapshots
        run: PYTHONPATH=. python scripts/expansion_validation.py
      - name: Build current empirical performance snapshot from previous settled predictions
        run: PYTHONPATH=. python scripts/current_performance.py
      - name: Fit walk-forward statistical calibration
        run: PYTHONPATH=. python scripts/calibrate_models.py
      - name: Apply independent statistical model, market benchmark and value layer
        run: PYTHONPATH=. python scripts/model_upgrade.py
      - name: Build reusable team and player behavior profiles
        run: PYTHONPATH=. python scripts/build_behavior_profiles.py
      - name: Build verified individual athlete behavior observations
        continue-on-error: true
        run: PYTHONPATH=. python scripts/build_individual_behavior.py
      - name: Attach behavior context to next-match predictions
        run: PYTHONPATH=. python scripts/apply_behavior_context.py
      - name: Validate team behavior features with walk-forward research benchmark
        run: PYTHONPATH=. python scripts/behavior_validation.py
      - name: Record clean V4 paper ledger and validation metrics
        run: PYTHONPATH=. python scripts/v4_validation.py
      - name: Run empirical model risk gate
        run: python scripts/model_guard.py
      - name: Run prediction QA gate
        run: python qa/prediction_qa.py
      - name: Evaluate all settled sports, tournaments and selections
        run: PYTHONPATH=. python scripts/sports_evaluation.py
      - name: Apply conservative accuracy elevation candidate gate
        run: PYTHONPATH=. python scripts/selective_prediction_gate.py
      - name: Generate prediction-type, confidence, league and model breakdown
        run: PYTHONPATH=. python scripts/prediction_breakdown.py
      - name: Commit generated data and QA report
        id: commit-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_pool.json data/selection_gate.json data/prediction_history.json data/accuracy.json data/pipeline_status.json data/risk_gate.json data/calibration.json data/football_team_history.json data/basketball_predictions.json data/basketball_history.json data/basketball_accuracy.json data/basketball_provider_cache.json data/behavior_profiles.json data/individual_behavior.json data/behavior_validation.json data/current_performance.json data/v4_paper_ledger.json data/v4_validation.json data/prediction_breakdown.json data/sports_evaluation.json data/nba_history.json data/nba_predictions.json data/ere_divisie_history.json data/ere_divisie_predictions.json data/expansion_status.json data/expansion_validation.json data/expansion_team_form.json qa/report.json
          if git diff --cached --quiet; then
            echo "No generated data or QA changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🤖 Run NBA parquet expansion validation"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
