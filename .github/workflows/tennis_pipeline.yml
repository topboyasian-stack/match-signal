name: Match Signal Live Prediction Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'qa/**'
      - '.github/workflows/tennis_pipeline.yml'
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-17-automation-watchdog"
  STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests curl_cffi pandas pyarrow
      - name: Sync with latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Normalize NBA 2026 team gamelog into competitive game-level history
        run: |
          python - <<'PY'
          import io, json, requests
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import pandas as pd
          url = 'https://raw.githubusercontent.com/llimllib/nba_data/main/data/gamelog_2026.parquet'
          r = requests.get(url, timeout=90, headers={'User-Agent':'MatchSignal/1.0'})
          r.raise_for_status()
          df = pd.read_parquet(io.BytesIO(r.content))
          required = {'game_id','game_date','matchup','team_name','pts'}
          missing = required - set(df.columns)
          if missing:
              raise RuntimeError(f'NBA gamelog schema missing {sorted(missing)}')
          cutoff = datetime.now(timezone.utc) - timedelta(days=365)
          rows = []
          for gid, g in df.groupby('game_id', sort=False):
              gid_text = str(gid)
              if gid_text.startswith(('001','003')):
                  continue
              home = g[g['matchup'].astype(str).str.contains(r' vs\\. ', regex=True, na=False)]
              away = g[g['matchup'].astype(str).str.contains(r' @ ', regex=True, na=False)]
              if home.empty or away.empty:
                  continue
              h = home.iloc[0]
              a = away.iloc[0]
              try:
                  d = pd.to_datetime(h['game_date'], utc=True).to_pydatetime()
              except Exception:
                  continue
              if d < cutoff or d > datetime.now(timezone.utc):
                  continue
              try:
                  hs = float(h['pts'])
                  as_ = float(a['pts'])
              except Exception:
                  continue
              rows.append({'event_id':gid_text,'date':d.isoformat(),'home':str(h['team_name']).strip(),'away':str(a['team_name']).strip(),'home_id':str(h['team_id']) if 'team_id' in g.columns else '','away_id':str(a['team_id']) if 'team_id' in g.columns else '','home_score':hs,'away_score':as_,'markets':{},'source':url})
          rows = sorted({x['event_id']: x for x in rows}.values(), key=lambda x:x['date'])
          if not rows:
              print('No competitive 2026 NBA games available yet; leaving expansion_pipeline fallback unchanged.')
              raise SystemExit(0)
          Path('data/nba_fallback.json').write_text(json.dumps(rows, indent=2))
          p = Path('scripts/expansion_pipeline.py')
          s = p.read_text()
          needle = "def nba_fallback():\n"
          inject = "def nba_fallback():" + chr(10) + " local=DATA/'nba_fallback.json'" + chr(10) + " if local.exists():" + chr(10) + "  return json.loads(local.read_text()),[]" + chr(10)
          if 'nba_fallback.json' not in s:
              s = s.replace(needle, inject, 1)
          s = s.replace('team-box parquet, then stable DataHub/FiveThirtyEight NBA Elo CSV fallback', 'normalized competitive llimllib/nba_data gamelog_2026 parquet; preseason and All-Star excluded')
          p.write_text(s)
          print(f'NBA competitive normalized games: {len(rows)}')
          print(f'NBA range: {rows[0]["date"]} -> {rows[-1]["date"]}')
          PY
      - name: Build scoped daily Football and Tennis predictions and settle historical picks
        run: python scripts/scoped_pipeline.py
      - name: Build scoped 365-day independent football team history
        run: python scripts/build_football_team_history.py
      - name: Enrich football predictions with pure market snapshot
        run: python scripts/enrich_market_snapshot.py
      - name: Settle newly completed same-day fixtures
        run: python scripts/settle_same_day.py
      - name: Build isolated football performance ledger
        run: PYTHONPATH=. python scripts/build_football_performance.py
      - name: Refine weak-signal tennis analytics
        run: python scripts/calibrate_tennis_analytics.py
      - name: Build basketball coverage and OddsPapi/Stake market signals
        run: PYTHONPATH=. python scripts/basketball_oddspapi_runner.py
      - name: Build NBA + Eredivisie expansion research datasets
        run: PYTHONPATH=. python scripts/expansion_pipeline.py
      - name: Benchmark NBA model against public closing moneyline market
        run: PYTHONPATH=. python scripts/nba_market_validation.py
      - name: Tournament market-blind NBA model candidates
        run: PYTHONPATH=. python scripts/nba_model_candidates.py
      - name: Walk-forward calibrate the best NBA Elo candidate and test value thresholds
        run: PYTHONPATH=. python scripts/nba_calibration_tournament.py
      - name: Deep walk-forward validate NBA + Eredivisie and build recent-form snapshots
        run: PYTHONPATH=. python scripts/expansion_validation.py
      - name: Build current empirical performance snapshot from previous settled predictions
        run: PYTHONPATH=. python scripts/current_performance.py
      - name: Fit walk-forward statistical calibration
        run: PYTHONPATH=. python scripts/calibrate_models.py
      - name: Apply independent statistical model, market benchmark and value layer
        run: PYTHONPATH=. python scripts/model_upgrade.py
      - name: Build reusable team and player behavior profiles
        run: PYTHONPATH=. python scripts/build_behavior_profiles.py
      - name: Build verified individual athlete behavior observations
        continue-on-error: true
        run: PYTHONPATH=. python scripts/build_individual_behavior.py
      - name: Attach behavior context to next-match predictions
        run: PYTHONPATH=. python scripts/apply_behavior_context.py
      - name: Validate team behavior features with walk-forward research benchmark
        run: PYTHONPATH=. python scripts/behavior_validation.py
      - name: Record clean V4 paper ledger and validation metrics
        run: PYTHONPATH=. python scripts/v4_validation.py
      - name: Run empirical model risk gate
        run: python scripts/model_guard.py
      - name: Run prediction QA gate
        run: python qa/prediction_qa.py
      - name: Evaluate all settled sports, tournaments and selections
        run: PYTHONPATH=. python scripts/sports_evaluation.py
      - name: Apply conservative accuracy elevation candidate gate
        run: PYTHONPATH=. python scripts/selective_prediction_gate.py
      - name: Generate prediction-type, confidence, league and model breakdown
        run: PYTHONPATH=. python scripts/prediction_breakdown.py
      - name: Commit generated data and QA report
        id: commit-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_pool.json data/selection_candidates.json data/selection_gate.json data/prediction_history.json data/accuracy.json data/tennis_performance.json data/football_performance.json data/pipeline_status.json data/risk_gate.json data/calibration.json data/football_team_history.json data/basketball_predictions.json data/basketball_history.json data/basketball_accuracy.json data/basketball_provider_cache.json data/behavior_profiles.json data/individual_behavior.json data/behavior_validation.json data/current_performance.json data/v4_paper_ledger.json data/v4_validation.json data/prediction_breakdown.json data/sports_evaluation.json data/nba_history.json data/nba_predictions.json data/ere_divisie_history.json data/ere_divisie_predictions.json data/expansion_status.json data/expansion_validation.json data/expansion_team_form.json data/nba_market_validation.json data/nba_market_matches.json data/nba_model_candidates.json data/nba_calibration_tournament.json qa/report.json
          if git diff --cached --quiet; then
            echo "No generated data or QA changes."
            exit 0
          fi
          git commit -m "🤖 Refresh scheduled prediction pipeline"
          git push origin main
