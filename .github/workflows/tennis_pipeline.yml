name: Match Signal Automated Tennis Pipeline

on:
  schedule:
    # Runs automatically every day at 05:00 AM UTC (Perfect timing for daily tournament slates)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the pipeline from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System and Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install your data parsing, scraping, and math modeling libraries
        pip install pandas numpy scikit-learn requests BeautifulSoup4

    - name: Execute Prediction Model Pipeline
      run: |
        # Runs your primary Python script to fetch schedules, get player form, and calculate odds
        python scripts/predict_today.py

    - name: Commit and Push Generated Predictions JSON
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Only commit changes if the predictions file actually updated
        git add data/predictions.json
        if git diff-index --quiet HEAD; then
          echo "No new prediction data to commit today."
        else
          git commit -m "🤖 Auto-updated daily tennis predictions [skip ci]"
          git push origin main
        fi
