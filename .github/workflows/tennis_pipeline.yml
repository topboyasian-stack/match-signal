name: Match Signal Live Prediction Pipeline
concurrency:
  group: match-signal-data-publish
  cancel-in-progress: false


on:
  push:
    branches: [main]
    paths:
      - 'scripts/run_pipeline.py'
      - 'scripts/predict_today.py'
      - 'scripts/independent_football_model.py'
      - 'scripts/build_football_team_history.py'
      - 'scripts/test_ucl_dual_competition_model.py'
      - 'scripts/test_ucl_shadow_contract.py'
      - 'scripts/test_ucl_history_coverage.py'
      - 'scripts/production_pipeline.py'
      - 'scripts/scoped_pipeline.py'
      - 'scripts/settle_same_day.py'
      - 'scripts/enrich_market_snapshot.py'
      - 'scripts/enrich_sportybet_odds.py'
      - 'scripts/test_enrich_sportybet_odds.py'
      - 'scripts/football_competition_match.py'
      - 'scripts/test_predict_today_market_matching.py'
      - 'scripts/test_workflow_trigger_boundaries.py'
      - 'scripts/tennis_set_market_model.py'
      - 'scripts/tennis_set_market_reassessment.py'
      - 'scripts/test_tennis_set_market_model.py'
      - 'scripts/test_tennis_set_market_reassessment.py'
      - 'scripts/calibrate_tennis_analytics.py'
      - 'scripts/build_football_performance.py'
      - 'scripts/calibrate_models.py'
      - 'scripts/model_upgrade.py'
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/test_model_upgrade_football_ensemble.py'
      - 'scripts/model_guard.py'
      - 'scripts/build_behavior_profiles.py'
      - 'scripts/build_individual_behavior.py'
      - 'scripts/apply_behavior_context.py'
      - 'scripts/behavior_validation.py'
      - 'scripts/v4_validation.py'
      - 'scripts/selective_prediction_gate.py'
      - 'scripts/test_selection_gate_contract.py'
      - 'scripts/finalize_value_signals.py'
      - 'scripts/prediction_breakdown.py'
      - 'scripts/verify_performance_ledger.py'
      - 'qa/**'
      - '.github/workflows/tennis_pipeline.yml'
  schedule:
    # Same four-hour cadence; minute offset changed to reactivate the missed core refresh schedule.
    - cron: '11 */4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-21-sportybet-market-sync"
  MATCH_SIGNAL_PUBLIC_BASE: "https://match-signal.pages.dev"
  STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
  ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests curl_cffi pandas pyarrow
      - name: Sync with latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test exact-line tennis SportyBet alignment
        run: python scripts/test_enrich_sportybet_odds.py
      - name: Test independent tennis set-outcome markets
        run: |
          python -m py_compile scripts/tennis_set_market_model.py scripts/tennis_set_market_reassessment.py
          python scripts/test_tennis_set_market_model.py
          python scripts/test_tennis_set_market_reassessment.py
      - name: Test workflow trigger boundaries and optional source failure isolation
        run: python scripts/test_workflow_trigger_boundaries.py
      - name: Run football competition-safe market matching tests
        run: python scripts/test_predict_today_market_matching.py
      - name: Test separate domestic and Champions League form inputs
        run: PYTHONPATH=scripts python scripts/test_ucl_dual_competition_model.py
      - name: Test UCL shadow cannot replace published picks or qualify tickets
        run: PYTHONPATH=scripts python scripts/test_ucl_shadow_contract.py
      - name: Test alternate domestic-history fallback and competition isolation
        run: PYTHONPATH=scripts:. python scripts/test_ucl_history_coverage.py
      - name: Test competition-scoped football ensemble and fail-closed model updates
        run: |
          python -m py_compile scripts/football_prequential_ensemble.py scripts/model_upgrade.py scripts/test_football_prequential_ensemble.py scripts/test_model_upgrade_football_ensemble.py
          PYTHONPATH=scripts python scripts/test_football_prequential_ensemble.py
          PYTHONPATH=scripts python scripts/test_model_upgrade_football_ensemble.py
      # Optional NBA history enrichment is currently unavailable upstream (HTTP 404).
      # Basketball remains a separate paper-only experimental lane; this must not block
      # the canonical football/tennis refresh when that optional source is missing.
      - name: Normalize NBA 2026 team gamelog into competitive game-level history
        continue-on-error: true
        run: |
          python - <<'PY'
          import io, json, requests
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import pandas as pd
          url = 'https://raw.githubusercontent.com/llimllib/nba_data/main/data/gamelog_2026.parquet'
          r = requests.get(url, timeout=90, headers={'User-Agent':'MatchSignal/1.0'})
          r.raise_for_status()
          df = pd.read_parquet(io.BytesIO(r.content))
          required = {'game_id','game_date','matchup','team_name','pts'}
          missing = required - set(df.columns)
          if missing:
              raise RuntimeError(f'NBA gamelog schema missing {sorted(missing)}')
          cutoff = datetime.now(timezone.utc) - timedelta(days=365)
          rows = []
          for gid, g in df.groupby('game_id', sort=False):
              gid_text = str(gid)
              if gid_text.startswith(('001','003')):
                  continue
              home = g[g['matchup'].astype(str).str.contains(r' vs\\. ', regex=True, na=False)]
              away = g[g['matchup'].astype(str).str.contains(r' @ ', regex=True, na=False)]
              if home.empty or away.empty:
                  continue
              h = home.iloc[0]
              a = away.iloc[0]
              try:
                  d = pd.to_datetime(h['game_date'], utc=True).to_pydatetime()
              except Exception:
                  continue
              if d < cutoff or d > datetime.now(timezone.utc):
                  continue
              try:
                  hs = float(h['pts']); as_ = float(a['pts'])
              except Exception:
                  continue
              rows.append({'event_id':gid_text,'date':d.isoformat(),'home':str(h['team_name']).strip(),'away':str(a['team_name']).strip(),'home_id':str(h['team_id']) if 'team_id' in g.columns else '','away_id':str(a['team_id']) if 'team_id' in g.columns else '','home_score':hs,'away_score':as_,'markets':{},'source':url})
          rows = sorted({x['event_id']: x for x in rows}.values(), key=lambda x:x['date'])
          if not rows:
              print('No competitive 2026 NBA games available yet; leaving expansion_pipeline fallback unchanged.')
              raise SystemExit(0)
          Path('data/nba_fallback.json').write_text(json.dumps(rows, indent=2))
          p = Path('scripts/expansion_pipeline.py')
          s = p.read_text()
          needle = "def nba_fallback():\n"
          inject = "def nba_fallback():" + chr(10) + " local=DATA/'nba_fallback.json'" + chr(10) + " if local.exists():" + chr(10) + "  return json.loads(local.read_text()),[]" + chr(10)
          if 'nba_fallback.json' not in s:
              s = s.replace(needle, inject, 1)
          s = s.replace('team-box parquet, then stable DataHub/FiveThirtyEight NBA Elo CSV fallback', 'normalized competitive llimllib/nba_data gamelog_2026 parquet; preseason and All-Star excluded')
          p.write_text(s)
          print(f'NBA competitive normalized games: {len(rows)}')
          print(f'NBA range: {rows[0]["date"]} -> {rows[-1]["date"]}')
          PY
      - name: Build scoped daily Football and Tennis predictions and settle historical picks
        run: python scripts/scoped_pipeline.py
      - name: Build scoped 365-day independent football team history
        run: python scripts/build_football_team_history.py
      - name: Verify domestic and Champions League history coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/football_team_history.json').read_text())
          domestic={'Premier League','Serie A','Eredivisie','Primeira Liga','Süper Lig','Belgian Pro League','Austrian Bundesliga','Eliteserien','Czech First League','Ukrainian Premier League','Super League Greece','Scottish Premiership','Swiss Super League','Danish Superliga','Polish Ekstraklasa','Croatian First Football League','Serbian SuperLiga','Slovak Super Liga','La Liga','Bundesliga','Ligue 1'}
          counts={name:sum(1 for row in rows if row.get('league')==name) for name in domestic}
          print(json.dumps(counts,ensure_ascii=False,indent=2))
          assert sum(counts.values()) > 0
          assert any(counts.get(name,0) for name in ('Premier League','Serie A','Eredivisie','Primeira Liga','Süper Lig'))
          PY
      - name: Enrich football predictions with pure market snapshot
        run: python scripts/enrich_market_snapshot.py
      - name: Synchronize current SportyBet NG market prices
        run: python scripts/enrich_sportybet_odds.py
      - name: Settle newly completed same-day fixtures
        run: python scripts/settle_same_day.py
      - name: Build isolated football performance ledger
        run: PYTHONPATH=. python scripts/build_football_performance.py
      - name: Sanitize prediction feed after concurrent refreshes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/predictions.json')
          raw=p.read_text(encoding='utf-8')
          if not raw.strip():
              import subprocess
              restored=subprocess.check_output(['git','show','HEAD:data/predictions.json'],text=True)
              if not restored.strip():
                  raise RuntimeError('predictions.json is empty and no committed recovery feed exists')
              p.write_text(restored,encoding='utf-8')
              raw=restored
              print('Recovered empty predictions.json from the checked-out committed feed')
          try:
              value=json.loads(raw)
          except json.JSONDecodeError:
              dec=json.JSONDecoder()
              first,end=dec.raw_decode(raw.lstrip())
              rest=raw.lstrip()[end:].strip()
              if not rest:
                  value=first
              else:
                  try:
                      second,_=dec.raw_decode(rest)
                  except json.JSONDecodeError:
                      second=None
                  if isinstance(first,list) and isinstance(second,list):
                      merged={str(x.get('event_id')):x for x in first if isinstance(x,dict) and x.get('event_id')}
                      for x in second:
                          if isinstance(x,dict) and x.get('event_id'): merged[str(x['event_id'])]=x
                      value=list(merged.values())
                  elif isinstance(first,list):
                      value=first
                  else:
                      raise RuntimeError('prediction feed contains an unsupported trailing payload')
              p.write_text(json.dumps(value,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              print(f'Sanitized predictions.json: {len(value)} rows')
          else:
              print(f'Prediction feed valid JSON: {len(value) if isinstance(value,list) else "object"}')
          PY
      - name: Refine weak-signal tennis analytics
        run: python scripts/calibrate_tennis_analytics.py
      # Basketball is retired from active production until a complete
      # competitive history and current market source are available.
      - name: Build current empirical performance snapshot from previous settled predictions
        continue-on-error: true
        run: PYTHONPATH=. python scripts/current_performance.py
      - name: Fit walk-forward statistical calibration
        continue-on-error: true
        run: PYTHONPATH=. python scripts/calibrate_models.py
      - name: Apply independent statistical model, market benchmark and value layer
        run: PYTHONPATH=. python scripts/model_upgrade.py
      - name: Assert football ensemble audit is fresh and paper-only
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("data/football_prequential_validation.json")
          if not path.exists():
              raise SystemExit("ABORT: football ensemble validation audit was not generated")
          audit = json.loads(path.read_text(encoding="utf-8"))
          generated = datetime.fromisoformat(audit["generated_at_utc"])
          age_seconds = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds()
          if age_seconds < -30 or age_seconds > 600:
              raise SystemExit(f"ABORT: football ensemble audit is stale or future-dated ({age_seconds:.1f}s)")
          if audit.get("model_version") != "5.1-fixture-ready-prequential-ensemble":
              raise SystemExit("ABORT: unexpected football ensemble model version")
          if audit.get("mode") != "PAPER_RESEARCH_ONLY":
              raise SystemExit("ABORT: football ensemble audit must remain research-only")
          if audit.get("validation_report_status") == "VALIDATION_ERROR":
              raise SystemExit("ABORT: football ensemble validation failed; refusing silent publication")
          for key in ("live_money_approved", "ticket_release_approved", "release_gates_changed"):
              if audit.get(key) is not False:
                  raise SystemExit(f"ABORT: football ensemble changed release policy ({key})")
          scopes = audit.get("validated_competition_scopes") or {}
          for league, gate in (audit.get("global_blend_scope_gates") or {}).items():
              if gate.get("passed") and league not in scopes:
                  raise SystemExit(f"ABORT: {league} passed its global-model holdout but was not released into validated scopes")
          print(json.dumps({
              "generated_at_utc": audit["generated_at_utc"],
              "validation_report_status": audit.get("validation_report_status"),
              "validated_competition_scopes": scopes,
              "global_blend_scope_gates": audit.get("global_blend_scope_gates"),
              "validated_scope_prediction_counts": audit.get("validated_scope_prediction_counts"),
              "fixture_model_readiness_counts": audit.get("fixture_model_readiness_counts"),
              "validated_model_prediction_updates": audit.get("validated_model_prediction_updates"),
              "release_policy": "publish each ready fixture independently; paper-only; no ticket or real-money approval",
          }, indent=2))
          PY
      - name: Finalize current SportyBet model edge and EV signals
        run: python scripts/finalize_value_signals.py
      - name: Build reusable team and player behavior profiles
        continue-on-error: true
        run: PYTHONPATH=. python scripts/build_behavior_profiles.py
      - name: Build verified individual athlete behavior observations
        continue-on-error: true
        run: PYTHONPATH=. python scripts/build_individual_behavior.py
      - name: Attach behavior context to next-match predictions
        continue-on-error: true
        run: PYTHONPATH=. python scripts/apply_behavior_context.py
      - name: Validate team behavior features with walk-forward research benchmark
        continue-on-error: true
        run: PYTHONPATH=. python scripts/behavior_validation.py
      - name: Record clean V4 paper ledger and validation metrics
        continue-on-error: true
        run: PYTHONPATH=. python scripts/v4_validation.py
      - name: Rebuild walk-forward Football council on refreshed domestic and Champions League history
        run: python scripts/football_model_council.py
      - name: Assert model-council remains research-only unless evidence passes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          council = json.loads(Path("data/football_model_council.json").read_text(encoding="utf-8"))
          assert council.get("mode") == "PAPER_RESEARCH_ONLY", "Football council must remain paper/research only"
          assert council.get("production_pick_unchanged") is True, "Council changed the published production pick contract"
          assert council.get("builder_eligibility_unchanged") is True, "Council changed ticket eligibility"
          overall = council.get("overall") or {}
          ucl = council.get("by_league", {}).get("Champions League") or {}
          print(json.dumps({"overall": overall, "champions_league": ucl}, indent=2))
          PY
      - name: Run empirical model risk gate
        continue-on-error: true
        run: python scripts/model_guard.py
      - name: Run prediction QA gate
        run: python qa/prediction_qa.py
      - name: Evaluate all settled sports, tournaments and selections
        continue-on-error: true
        run: PYTHONPATH=. python scripts/sports_evaluation.py
      - name: Apply conservative accuracy elevation candidate gate
        continue-on-error: true
        run: PYTHONPATH=. python scripts/selective_prediction_gate.py
      - name: Validate selection-gate output isolation
        run: python scripts/test_selection_gate_contract.py --require-generated-artifacts
      - name: Generate prediction-type, confidence, league and model breakdown
        continue-on-error: true
        run: PYTHONPATH=. python scripts/prediction_breakdown.py
      - name: Verify append-only performance ledger
        run: PYTHONPATH=. python scripts/verify_performance_ledger.py

      - name: Assert prediction feed is publishable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/predictions.json')
          raw = path.read_text(encoding='utf-8').strip()
          if not raw:
              raise SystemExit('ABORT: predictions.json is empty after generation')
          data = json.loads(raw)
          if not isinstance(data, list) or len(data) < 10:
              raise SystemExit(f'ABORT: predictions.json contains {len(data) if isinstance(data,list) else "non-list"} rows')
          status = json.loads(Path('data/pipeline_status.json').read_text(encoding='utf-8'))
          reported = int(status.get('prediction_count') or 0)
          if reported and len(data) < min(reported, 10):
              raise SystemExit(f'ABORT: feed rows {len(data)} inconsistent with pipeline prediction_count {reported}')
          print(f'Publishable prediction feed verified: {len(data)} rows; reported count={reported}')
          PY
      - name: Commit generated data and QA report
        id: commit-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_pool.json data/value_signal_status.json data/value_trial_ledger.json data/prediction_history.json data/football_performance.json data/pipeline_status.json data/risk_gate.json data/calibration.json data/football_team_history.json data/behavior_profiles.json data/individual_behavior.json data/behavior_validation.json data/v4_paper_ledger.json data/v4_validation.json data/prediction_breakdown.json data/sports_evaluation.json data/sportybet_odds_snapshot.json data/football_prequential_validation.json qa/report.json
          # Keep independently refreshed aggregate-performance snapshots from
          # concurrent writers on main. Replaying these generated reports
          # caused rebase conflicts and prevented publication.
          git restore --source=HEAD --staged --worktree -- data/accuracy.json data/current_performance.json data/tennis_performance.json data/football_model_council.json
          # Unified Upcoming is the sole publisher for these three artifacts:
          # it must derive the gate/candidate pool from the prediction commit
          # that has just landed. If the model pipeline also commits them, its
          # push races the board and leaves the public board stale indefinitely.
          git add -u data qa scripts/expansion_pipeline.py
          git restore --source=HEAD --staged --worktree -- data/selection_candidates.json data/selection_gate.json data/selection_gate_selected.json
          if [ -f data/nba_fallback.json ]; then git add data/nba_fallback.json; fi
          if git diff --cached --quiet; then
            echo "No generated data or QA changes."
            exit 0
          fi
          git commit -m "🤖 Refresh scheduled prediction pipeline"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push race detected; rebasing generated commit onto latest main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict; aborting to avoid overwriting another workflow's generated data."
              git rebase --abort || true
              exit 1
            }
          done
          exit 1
# Operational heartbeat trigger: keep the scheduled core prediction pipeline active.
