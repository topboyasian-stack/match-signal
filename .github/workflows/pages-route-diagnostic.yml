name: Temporary Cloudflare Pages Route Diagnostic

on:
  push:
    branches:
      - diagnostics/pages-route-check-20261013
    paths:
      - ".github/workflows/pages-route-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out current production-monitor code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser monitor dependency
        run: npm install --no-save playwright

      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: qualified-best-chromium-${{ runner.os }}-v1
          restore-keys: |
            qualified-best-chromium-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Re-check Qualified Best in a real browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFIED_BEST_URL: https://match-signal.pages.dev/qualified-best.html
        run: node scripts/qualified_best_monitor.mjs

      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-best-recheck-${{ github.run_id }}
          path: qualified-best-monitor-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Football league images render in the production browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error.message || error)));
          const response = await page.goto('https://match-signal.pages.dev/football.html?logoCheck=' + Date.now(), {
            waitUntil: 'domcontentloaded',
            timeout: 25000
          });
          if (!response || !response.ok()) throw new Error('Football page HTTP ' + (response?.status() ?? 'no response'));
          await page.waitForSelector('#leagueGrid .ms-league', { timeout: 20000 });
          await page.waitForFunction(() => {
            const cards = [...document.querySelectorAll('#leagueGrid .ms-league')];
            const names = cards.map(card => card.querySelector('h3')?.textContent.trim());
            const needed = ['La Liga', 'Champions League'];
            return needed.every(name => names.includes(name)) &&
              cards.every(card => card.querySelector('.ms-competition-logo, .ms-competition-logo-fallback'));
          }, { timeout: 20000 });
          await page.evaluate(() => {
            document.querySelectorAll('#leagueGrid .ms-competition-logo').forEach(img => { img.loading = 'eager'; });
          });
          await page.waitForFunction(() => {
            return [...document.querySelectorAll('#leagueGrid .ms-competition-logo')].every(img => img.complete);
          }, { timeout: 15000 }).catch(() => {});
          const result = await page.evaluate(() => {
            const cards = [...document.querySelectorAll('#leagueGrid .ms-league')];
            return {
              page_title: document.title,
              card_count: cards.length,
              cards: cards.map(card => {
                const name = card.querySelector('h3')?.textContent.trim() || '';
                const img = card.querySelector('.ms-competition-logo');
                const fallback = card.querySelector('.ms-competition-logo-fallback');
                return {
                  league: name,
                  logo_url: img?.getAttribute('src') || null,
                  logo_loaded: Boolean(img && img.complete && img.naturalWidth > 0),
                  fallback_label: fallback?.textContent || null
                };
              })
            };
          });
          const required = ['La Liga', 'Champions League'];
          const missing = required.filter(name => !result.cards.some(card => card.league === name && card.logo_loaded));
          result.page_errors = pageErrors;
          result.required_examples_loaded = missing.length === 0;
          console.log('FOOTBALL_LOGO_BROWSER_RESULT ' + JSON.stringify(result));
          await browser.close();
          if (missing.length) throw new Error('Required competition logos did not load as images: ' + missing.join(', '));
          if (pageErrors.length) throw new Error('Football page runtime errors: ' + pageErrors.join('; '));
          NODE

      - name: Compare production alias, latest deployment URL, and last known successful deployment
        run: |
          node --input-type=module <<'NODE'
          const bases = [
            { label: 'production-domain', url: 'https://match-signal.pages.dev' },
            { label: 'latest-deployment-preview', url: 'https://9f81093f.match-signal.pages.dev' },
            { label: 'previous-successful-deployment-preview', url: 'https://1990e345.match-signal.pages.dev' }
          ];
          const paths = [
            '/',
            '/football.html',
            '/qualified-best.html',
            '/league-logos.js?diagnostic=20261013',
            '/sport-hubs.css?diagnostic=20261013',
            '/data/unified_upcoming.json'
          ];
          const results = [];
          for (const base of bases) {
            for (const path of paths) {
              const url = base.url + path;
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(12000),
                  headers: { 'user-agent': 'Match-Signal-Pages-Diagnostic/1.0', 'cache-control': 'no-cache' }
                });
                const body = await response.text();
                const item = {
                  host: base.label,
                  path,
                  status: response.status,
                  ok: response.ok,
                  content_type: response.headers.get('content-type'),
                  server: response.headers.get('server'),
                  cf_ray: response.headers.get('cf-ray'),
                  location: response.headers.get('location'),
                  body_prefix: body.replace(/\\s+/g, ' ').slice(0, 260)
                };
                results.push(item);
                console.log(JSON.stringify(item));
              } catch (error) {
                const item = { host: base.label, path, error: String(error?.message || error) };
                results.push(item);
                console.log(JSON.stringify(item));
              }
            }
          }
          const summary = bases.map(base => {
            const rows = results.filter(row => row.host === base.label);
            return {
              host: base.label,
              total: rows.length,
              http_200: rows.filter(row => row.status === 200).length,
              http_5xx: rows.filter(row => row.status >= 500).length,
              network_errors: rows.filter(row => row.error).length
            };
          });
          console.log('DIAGNOSTIC_SUMMARY ' + JSON.stringify(summary));
          NODE
