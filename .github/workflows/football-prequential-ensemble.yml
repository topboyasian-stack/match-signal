name: Football prequential ensemble regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/independent_football_model.py'
      - '.github/workflows/football-prequential-ensemble.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/independent_football_model.py'
      - '.github/workflows/football-prequential-ensemble.yml'

permissions:
  contents: read

jobs:
  regression-and-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile and run offline regressions
        run: |
          python -m py_compile scripts/football_prequential_ensemble.py scripts/test_football_prequential_ensemble.py
          python scripts/test_football_prequential_ensemble.py
      - name: Run strict chronological development and holdout evaluation
        run: |
          python scripts/football_prequential_ensemble.py --output /tmp/football-prequential-ensemble.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/football-prequential-ensemble.json').read_text())
          assert report['mode']=='PAPER_RESEARCH_ONLY'
          assert report['strict_pre_kickoff_cutoff'] is True
          assert report['market_independent'] is True
          assert report['development_n'] > 0 and report['holdout_n'] > 0
          assert report['promotion_allowed'] is False or report['holdout_n'] >= 60
          print(json.dumps({
            'eligible': report['total_eligible'],
            'development_n': report['development_n'],
            'holdout_n': report['holdout_n'],
            'development_fit': report['development_fit'],
            'holdout_metrics': report['holdout_metrics'],
            'promotion_allowed': report['promotion_allowed']
          }, indent=2))
          PY
      - name: Preserve full experiment report
        uses: actions/upload-artifact@v4
        with:
          name: football-prequential-ensemble-report
          path: /tmp/football-prequential-ensemble.json
          if-no-files-found: error
