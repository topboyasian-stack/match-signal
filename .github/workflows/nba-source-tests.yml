name: Validate NBA historical source and season gates

on:
  pull_request:
    paths:
      - 'scripts/expansion_pipeline.py'
      - 'scripts/test_expansion_sources.py'
      - 'scripts/nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/live_expansion_pipeline.py'
      - 'scripts/settle_nba_totals.py'
      - 'scripts/test_nba_sportybet_totals.py'
      - 'basketball-live.js'
      - 'basketball.html'
      - 'scripts/test_basketball_desk_contract.mjs'
      - 'scripts/test_nba_live_projection.mjs'
      - 'scripts/record_nba_live_behavior.py'
      - 'scripts/test_record_nba_live_behavior.py'
      - 'scripts/nba_live_totals_walk_forward.py'
      - 'scripts/test_nba_live_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/test_nba_live_projection.mjs'
      - '.github/workflows/nba-source-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/expansion_pipeline.py'
      - 'scripts/test_expansion_sources.py'
      - 'scripts/nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/live_expansion_pipeline.py'
      - 'scripts/settle_nba_totals.py'
      - 'scripts/test_nba_sportybet_totals.py'
      - 'basketball-live.js'
      - 'basketball.html'
      - 'scripts/test_basketball_desk_contract.mjs'
      - 'scripts/test_nba_live_projection.mjs'
      - '.github/workflows/nba-source-tests.yml'

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline imports
        run: python -m pip install --upgrade requests pandas
      - name: Syntax-check NBA live desk and compile pipeline
        run: |
          node --check basketball-live.js
          python -m py_compile scripts/expansion_pipeline.py scripts/live_expansion_pipeline.py scripts/run_live_expansion.py scripts/settle_expansion.py scripts/settle_nba_totals.py scripts/nba_totals_walk_forward.py scripts/test_expansion_sources.py scripts/test_nba_totals_walk_forward.py scripts/test_nba_sportybet_totals.py
      - name: Run Basketball desk contract regression
        run: node scripts/test_basketball_desk_contract.mjs
      - name: Run NBA live projection and evidence-gate tests
        run: node scripts/test_nba_live_projection.mjs
      - name: Run NBA source and season-isolation tests
        run: |
          python scripts/test_expansion_sources.py
          python scripts/test_nba_totals_walk_forward.py
          python scripts/test_nba_sportybet_totals.py
          python scripts/test_record_nba_live_behavior.py
          python scripts/test_nba_live_totals_walk_forward.py
