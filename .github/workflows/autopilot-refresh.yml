name: Match Signal Autopilot Refresh

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal PDL Prediction Feed"
      - "Match Signal Live Prediction Pipeline"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/autopilot_guard.py'
      - 'scripts/football_forward_readiness.py'
      - 'scripts/unified_upcoming.py'
      - 'scripts/system_health_audit.py'
      - 'live.html'
      - '.github/workflows/autopilot-refresh.yml'

permissions:
  contents: write

# V5 publication retry: rebuild against latest main after concurrent data writers.

concurrency:
  # Autopilot may publish derived artifacts, but it must never cancel the core prediction publisher.
  group: match-signal-autopilot-publish
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile derived/health modules
        run: python -m py_compile scripts/autopilot_guard.py scripts/football_forward_readiness.py scripts/unified_upcoming.py scripts/system_health_audit.py

      - name: Build football forward-planning readiness
        run: python scripts/football_forward_readiness.py

      - name: Build unified all-sports upcoming/prediction board
        run: python scripts/unified_upcoming.py

      - name: Run whole-system health audit
        run: python scripts/system_health_audit.py

      - name: Run autonomous freshness and source coverage guard
        run: python scripts/autopilot_guard.py

      - name: Publish derived readiness, unified board and health
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autopilot_status.json data/football_forward_readiness.json data/unified_upcoming.json data/system_health.json
          if git diff --cached --quiet; then
            echo "Autopilot derived layer already current."
            exit 0
          fi
          git commit -m "🤖 Refresh derived readiness and health layer"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Derived layer publication succeeded."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/football_forward_readiness.py
            python scripts/unified_upcoming.py
            python scripts/system_health_audit.py
            python scripts/autopilot_guard.py
            git add data/autopilot_status.json data/football_forward_readiness.json data/unified_upcoming.json data/system_health.json
            if git diff --cached --quiet; then
              echo "Latest main already contains the derived layer."
              exit 0
            fi
            git commit -m "🤖 Refresh derived readiness and health layer"
            sleep $((attempt * 2))
          done
          exit 1
