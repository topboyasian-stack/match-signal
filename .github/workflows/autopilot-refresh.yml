name: Match Signal Autopilot Refresh

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal PDL Prediction Feed"
      - "Match Signal Live Prediction Pipeline"
      - "Match Signal Tennis Forward Window"
      - "Match Signal Football Statistical History"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/autopilot_guard.py'
      - 'scripts/football_forward_readiness.py'
      - 'scripts/system_health_audit.py'
      - 'scripts/independent_football_model.py'
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/model_upgrade.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/test_model_upgrade_football_ensemble.py'
      - 'live.html'
      - '.github/workflows/autopilot-refresh.yml'

permissions:
  contents: write

# Autopilot also applies competition models selected on development data and passed
# on an untouched chronological holdout. This updates research forecasts, never
# live-money or ticket eligibility. Unified Upcoming owns the shared board and health.
concurrency:
  # A new heartbeat supersedes stale readiness-only work. It cannot cancel the
  # Unified Upcoming publisher because it uses a different concurrency group.
  group: match-signal-autopilot-publish
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile derived, statistical and health modules
        run: python -m py_compile scripts/autopilot_guard.py scripts/football_forward_readiness.py scripts/system_health_audit.py scripts/independent_football_model.py scripts/football_model_council.py scripts/football_prequential_ensemble.py scripts/model_upgrade.py scripts/value_decision.py

      - name: Test prequential statistical model and leakage boundaries
        run: python scripts/test_football_prequential_ensemble.py

      - name: Test validated model application preserves ticket boundaries
        run: python scripts/test_model_upgrade_football_ensemble.py

      - name: Build walk-forward Football model council when history exists
        shell: bash
        run: |
          if [ -s data/football_team_history.json ] && grep -q '"event_id"' data/football_team_history.json; then
            python scripts/football_model_council.py
          else
            echo "Football team history unavailable; preserving prior council artifact."
          fi

      - name: Apply validated competition models to current football forecasts
        run: python scripts/model_upgrade.py

      - name: Verify validated forecast application and protected release flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('data/football_prequential_validation.json').read_text())
          predictions = json.loads(Path('data/predictions.json').read_text())
          if audit.get('validation_report_status') != 'EVALUATED':
              raise SystemExit(f"Football model evaluation is not current: {audit.get('validation_report_status')}")
          if audit.get('live_money_approved') is not False or audit.get('ticket_release_approved') is not False or audit.get('release_gates_changed') is not False:
              raise SystemExit('Model application changed a protected betting/ticket release boundary.')
          applied = [row for row in predictions if row.get('sport') == 'football' and (row.get('football_model_validation') or {}).get('status') == 'RESEARCH_SCOPE_VALIDATED']
          for row in applied:
              probs = row.get('probabilities') or {}
              total = sum(float(probs.get(k, 0)) for k in ('p1', 'draw', 'p2'))
              if not 0.999 <= total <= 1.001:
                  raise SystemExit(f"Invalid probability vector for {row.get('event_id')}: {total}")
              for key in ('betting_qualified', 'qualified_for_builder', 'builder_eligible', 'real_money_eligible'):
                  if row.get(key) is True:
                      raise SystemExit(f"Model application unexpectedly enabled {key} for {row.get('event_id')}")
          expected = int(audit.get('validated_model_prediction_updates') or 0)
          if len(applied) != expected:
              raise SystemExit(f"Audit says {expected} model updates but {len(applied)} current rows carry the validated model.")
          print(f"Validated statistical model applied to {len(applied)} football forecasts; ticket and real-money release remain closed.")
          print(json.dumps({'scope_counts': audit.get('validated_scope_prediction_counts'), 'fixture_readiness': audit.get('fixture_model_readiness_counts')}, indent=2))
          PY

      - name: Build football forward-planning readiness
        run: python scripts/football_forward_readiness.py

      - name: Run whole-system health audit
        run: python scripts/system_health_audit.py

      - name: Run autonomous freshness and source coverage guard
        run: python scripts/autopilot_guard.py

      - name: Publish validated football forecasts, readiness and autopilot status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/football_prequential_validation.json data/autopilot_status.json data/football_model_council.json data/football_forward_readiness.json
          if git diff --cached --quiet; then
            echo "Autopilot-owned readiness artifacts already current."
            exit 0
          fi
          git commit -m "🤖 Apply validated football models and refresh readiness"
          for attempt in 1 2 3 4 5; do
            # Other Match Signal publishers run concurrently. Rebase the prepared
            # model snapshot onto the newest main immediately before pushing it.
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Forecast/source artifacts changed concurrently; rebuild on latest main."
              git rebase --abort || true
              git reset --hard origin/main
              if [ -s data/football_team_history.json ] && grep -q '"event_id"' data/football_team_history.json; then
                python scripts/football_model_council.py
              fi
              python scripts/model_upgrade.py
              python scripts/football_forward_readiness.py
              python scripts/system_health_audit.py
              python scripts/autopilot_guard.py
              git add data/predictions.json data/football_prequential_validation.json data/autopilot_status.json data/football_model_council.json data/football_forward_readiness.json
              if git diff --cached --quiet; then
                echo "Latest main already contains the current validated forecast artifacts."
                exit 0
              fi
              git commit -m "🤖 Apply validated football models and refresh readiness"
              sleep $((attempt * 2))
              continue
            fi

            if git push origin main; then
              echo "Validated football forecasts and readiness published successfully."
              exit 0
            fi

            echo "main advanced during publication attempt $attempt; rebase and retry."
            sleep $((attempt * 2))
          done
          exit 1
