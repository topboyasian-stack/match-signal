name: Match Signal Autopilot Refresh

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/predict_today.py'
      - 'scripts/run_pipeline.py'
      - 'scripts/scoped_pipeline.py'
      - 'scripts/production_pipeline.py'
      - 'scripts/autopilot_guard.py'
      - 'live.html'
      - '.github/workflows/autopilot-refresh.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile production Python modules
        run: python -m py_compile scripts/predict_today.py scripts/run_pipeline.py scripts/scoped_pipeline.py scripts/production_pipeline.py scripts/autopilot_guard.py

      - name: Refresh current football + ATP/WTA predictions transactionally
        run: python scripts/scoped_pipeline.py

      - name: Run autonomous freshness and source coverage guard
        run: python scripts/autopilot_guard.py

      - name: Publish refreshed production data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/prediction_history.json data/accuracy.json data/pipeline_status.json data/autopilot_status.json
          if git diff --cached --quiet; then
            echo "Autopilot checked the feed; no data changes were required."
            exit 0
          fi
          git commit -m "🤖 Autopilot refresh current predictions"
          git push origin main
