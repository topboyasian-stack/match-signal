name: AI Analyst Foundation Tests

on:
  pull_request:
    paths:
      - 'docs/AI_ANALYST_UPGRADE.md'
      - 'docs/PREDICTION_DESK_POLICY.md'
      - 'schemas/user-ticket-review.schema.json'
      - 'scripts/audit_user_ticket_review.py'
      - 'scripts/test_user_ticket_review.py'
      - '.github/workflows/ai-analyst-foundation-tests.yml'
      - 'docs/AI_ANALYST_SETUP.md'
      - 'analyst.html'
      - 'analyst.js'
      - 'functions/_shared/analyst.mjs'
      - 'functions/api/analyst/**'
      - 'scripts/test_analyst_module.mjs'
      - 'scripts/test_analyst_routes.mjs'
      - 'scripts/unified_upcoming.py'
      - 'scripts/efootball_desk_learning.py'
      - 'scripts/test_upcoming_settlement_retention.py'
      - 'scripts/predict_today.py'
      - 'scripts/tennis_forward_window.py'
      - 'scripts/test_upcoming_desk_policy.py'
      - 'scripts/test_tennis_forward_publication.py'
      - 'scripts/test_desk_quote_contract.mjs'
      - 'scripts/test_prediction_desk_gates.mjs'
      - 'scripts/odds_ticket_tracker.py'
      - 'scripts/test_odds_ticket_tracker.py'
      - 'scripts/odds_builder.py'
      - 'expansion-odds-builder.js'
      - 'scripts/test_odds_builder_qualification_monitor.mjs'
      - 'odds-builder.html'
      - '.github/workflows/odds-ticket-tracker.yml'
      - '.github/workflows/cloudflare-pages.yml'
      - '.github/workflows/unified-upcoming.yml'
      - '.github/workflows/tennis-forward-window.yml'
      - 'sport-hubs.js'
      - 'sport-hubs.css'
      - 'upcoming.html'
      - 'index.html'
      - 'analyst.html'
      - '.github/workflows/autopilot-refresh.yml'
  push:
    branches: [main, ai-analyst-foundation]
    paths:
      - 'docs/AI_ANALYST_UPGRADE.md'
      - 'docs/PREDICTION_DESK_POLICY.md'
      - 'schemas/user-ticket-review.schema.json'
      - 'scripts/audit_user_ticket_review.py'
      - 'scripts/test_user_ticket_review.py'
      - '.github/workflows/ai-analyst-foundation-tests.yml'
      - 'scripts/test_analyst_module.mjs'
      - 'scripts/test_analyst_routes.mjs'
      - 'functions/api/analyst/**'
      - 'functions/_shared/analyst.mjs'
      - 'analyst.js'
      - 'analyst.html'
      - 'docs/AI_ANALYST_SETUP.md'
      - 'scripts/unified_upcoming.py'
      - 'scripts/efootball_desk_learning.py'
      - 'scripts/test_upcoming_settlement_retention.py'
      - 'scripts/predict_today.py'
      - 'scripts/tennis_forward_window.py'
      - 'scripts/test_upcoming_desk_policy.py'
      - 'scripts/test_tennis_forward_publication.py'
      - 'scripts/test_desk_quote_contract.mjs'
      - 'scripts/test_prediction_desk_gates.mjs'
      - 'scripts/odds_ticket_tracker.py'
      - 'scripts/test_odds_ticket_tracker.py'
      - 'scripts/odds_builder.py'
      - 'expansion-odds-builder.js'
      - 'odds-builder.html'
      - '.github/workflows/odds-ticket-tracker.yml'
      - '.github/workflows/cloudflare-pages.yml'
      - '.github/workflows/unified-upcoming.yml'
      - '.github/workflows/tennis-forward-window.yml'
      - 'sport-hubs.js'
      - 'sport-hubs.css'
      - 'upcoming.html'
      - 'index.html'
      - 'analyst.html'
      - '.github/workflows/autopilot-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-private-evidence-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON Schema syntax
        run: python -m json.tool schemas/user-ticket-review.schema.json > /dev/null
      - name: Run O/U line and evidence tests
        run: python scripts/test_user_ticket_review.py
      - name: Install test dependencies
        run: python -m pip install --upgrade requests
      - name: Run Prediction Desk freshness and exact-line evidence tests
        run: python scripts/test_upcoming_desk_policy.py
      - name: Run settlement reconciliation and score replay regressions
        run: python scripts/test_upcoming_settlement_retention.py
      - name: Run exact-line stale-quote display contract tests
        run: node scripts/test_desk_quote_contract.mjs
      - name: Test tennis forward publication retry contract
        run: python scripts/test_tennis_forward_publication.py
      - name: Compile changed Prediction Desk Python modules
        run: python -m py_compile scripts/unified_upcoming.py scripts/predict_today.py scripts/tennis_forward_window.py scripts/system_health_audit.py scripts/selection_candidate_collector.py scripts/efootball_desk_learning.py scripts/test_upcoming_desk_policy.py scripts/test_upcoming_settlement_retention.py scripts/test_tennis_forward_publication.py scripts/odds_ticket_tracker.py scripts/odds_builder.py scripts/test_odds_ticket_tracker.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stale paper-ticket archive regression tests
        run: python scripts/test_odds_ticket_tracker.py
      - name: Check Paper Ledger JavaScript syntax
        run: node --check expansion-odds-builder.js
      - name: Test Odds Builder qualification monitor contract
        run: node scripts/test_odds_builder_qualification_monitor.mjs
      - name: Run Prediction Desk qualification and calibration regressions
        run: node scripts/test_prediction_desk_gates.mjs
      - name: Run private analyst module tests
        run: node scripts/test_analyst_module.mjs
      - name: Run protected API route tests
        run: node scripts/test_analyst_routes.mjs
      - name: Check analyst JavaScript syntax
        run: |
          node --check analyst.js
          node --check sport-hubs.js
          node --check functions/_shared/analyst.mjs
          node --check functions/api/analyst/records.js
          node --check functions/api/analyst/chat.js
          node --check functions/api/analyst/parse-ticket.js
