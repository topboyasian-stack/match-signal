name: NBA totals probability and value research

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "NBA totals SportyBet market-225 price capture"
      - "NBA totals settlement ledger"
    types: [completed]
  schedule:
    # SportyBet capture runs at :07/:22/:37/:52 and settlement at :10/:25/:40/:55.
    # Score only after both jobs have had time to publish, never before the new evidence exists.
    - cron: '12,27,42,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/nba_totals_probability_value_experiment.py'
      - 'scripts/test_nba_totals_probability_value_experiment.py'
      - 'scripts/nba_totals_report_refresh_gate.py'
      - 'scripts/test_nba_totals_report_refresh_gate.py'
      - '.github/workflows/nba-totals-probability-value.yml'

permissions:
  contents: write

concurrency:
  group: nba-totals-probability-value-research
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression-test NBA report refresh gate
        run: PYTHONPATH=scripts python scripts/test_nba_totals_report_refresh_gate.py

      - name: Check whether new evidence warrants a report refresh
        id: refresh_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_report_refresh_gate import should_refresh_report

          def parse(value):
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return parsed.replace(tzinfo=timezone.utc) if parsed.tzinfo is None else parsed.astimezone(timezone.utc)
              except (TypeError, ValueError):
                  return None

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name not in {"workflow_run", "schedule"}:
              print("run=true")
              print("reason=push_or_manual_validation")
              raise SystemExit(0)

          report = json.loads(Path("data/nba_totals_probability_value_experiment.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("data/nba_totals_ledger.json").read_text(encoding="utf-8"))
          price_status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          snapshots = json.loads(Path("data/nba_totals_publication_snapshots.json").read_text(encoding="utf-8"))
          report_time = parse(report.get("generated_at"))
          newest_data_time = max(
              (stamp for stamp in (
                  parse(ledger.get("updated_at")),
                  parse(price_status.get("checked_at")),
                  *(parse(row.get("published_at")) for row in snapshots
                    if isinstance(row, dict) and row.get("totals_model_version") == "nba-total-v5.1-pace-efficiency-calibrated")
              ) if stamp is not None),
              default=None,
          )
          now = datetime.now(timezone.utc)
          age_minutes = (now - report_time).total_seconds() / 60 if report_time else float("inf")
          stale = report_time is None or (newest_data_time is not None and newest_data_time > report_time)
          should_run = should_refresh_report(event_name, report_time, newest_data_time, now)
          print(f"run={'true' if should_run else 'false'}")
          print(f"report_age_minutes={age_minutes:.2f}" if report_time else "report_age_minutes=unknown")
          if should_run and event_name == "workflow_run" and stale:
              print("reason=event_driven_refresh_on_newer_evidence")
          else:
              print("reason=stale_evidence_and_report_at_least_10_minutes_old" if should_run else "reason=report_fresh_or_refresh_throttled")
          PY

      - name: Install free research dependencies
        if: steps.refresh_gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Assert NBA research report runs after capture and settlement
        if: steps.refresh_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def cron(path):
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r"cron:\s*'([^']+)'", text)
              assert match, f"Missing explicit schedule in {path}"
              return match.group(1)

          capture = cron(".github/workflows/nba-totals-price-capture.yml")
          settlement = cron(".github/workflows/nba-totals-settlement.yml")
          report = cron(".github/workflows/nba-totals-probability-value.yml")
          assert capture == "7,22,37,52 * * * *", capture
          assert settlement == "10,25,40,55 * * * *", settlement
          assert report == "12,27,42,57 * * * *", report
          settlement_text = Path(".github/workflows/nba-totals-settlement.yml").read_text(encoding="utf-8")
          assert "workflow_run:" in settlement_text, "Settlement needs an event-driven backup after price capture."
          assert '"NBA totals SportyBet market-225 price capture"' in settlement_text
          assert "age_minutes >= 10" in settlement_text, "Capture-triggered settlement must be throttled by ledger freshness."
          print("Schedule order and event-driven settlement backup verified.")
          PY

      - name: Compile and test probability/value logic
        if: steps.refresh_gate.outputs.run == 'true'
        run: |
          python -m py_compile scripts/nba_totals_probability_value_experiment.py scripts/test_nba_totals_probability_value_experiment.py
          PYTHONPATH=scripts python scripts/test_nba_totals_probability_value_experiment.py

      - name: Run residual-calibrated SportyBet value diagnostics
        if: steps.refresh_gate.outputs.run == 'true'
        run: PYTHONPATH=scripts python scripts/nba_totals_probability_value_experiment.py

      - name: Verify paper-only and holdout restrictions
        if: steps.refresh_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/nba_totals_probability_value_experiment.json").read_text(encoding="utf-8"))
          assert report.get("paper_only") is True
          assert report.get("prospective_holdout_used_for_calibration") is False
          assert report.get("prospective_holdout_cutoff_utc") == "2026-11-02T02:00:00+00:00"
          assert report.get("model_projection_market_blind") is True
          assert report.get("market_prices_used_as_model_inputs") is False
          assert report.get("release_decision") == "RESEARCH_ONLY"
          assert report.get("live_value_decisions_authorized") is False
          assert "settled_v5_clv_diagnostics" in report
          assert "settled_v5_probability_score_summary" in report
          assert "prospective_pregame_snapshot_coverage" in report
          assert "prospective_probability_score_summary" in report
          prospective = report["prospective_probability_score_summary"]
          coverage = report["prospective_pregame_snapshot_coverage"]
          assert prospective.get("n", 0) >= 0
          assert prospective.get("sufficient_for_probability_validation") is (prospective.get("n", 0) >= 30)
          assert coverage.get("prospective_settled_selections_with_exact_snapshot_match", 0) <= coverage.get("prospective_settled_unique_market_selections", 0)
          assert coverage.get("prospective_unique_fixtures_with_verified_fresh_market_225_snapshot", 0) <= coverage.get("prospective_unique_fixtures_with_any_snapshot", 0)
          historical_probability = report.get("historical_probability_validation", {})
          assert historical_probability.get("unique_validation_games", 0) >= 100
          assert len(historical_probability.get("by_line_offset", [])) == 7
          assert historical_probability.get("not_a_sportybet_market_backtest") is True
          clv = report["settled_v5_clv_diagnostics"]
          assert clv.get("is_official_bookmaker_close") is not True
          assert all(row.get("is_official_bookmaker_close") is False for row in clv.get("fixtures", []) if "is_official_bookmaker_close" in row)
          print("Historical probability observations:", historical_probability["synthetic_game_line_observations"])
          print("Historical probability Brier:", historical_probability["model_brier"])
          print("Coinflip Brier:", historical_probability["coinflip_baseline_brier"])
          print("Residual calibration:", report["calibration_protocol"]["coverage_check"])
          print("Calibration residuals:", report["calibration_protocol"]["calibration_residuals_n"])
          print("Settled v5 market records:", report["settled_v5_market_count"])
          print("Near-close observations:", clv["near_close_observations"])
          print("Brier score sample:", report["settled_v5_probability_score_summary"]["n"])
          print("Fresh exact market-225 diagnostics:", report["upcoming_value_diagnostics_count"])
          print("Prospective settled bets:", report["prospective_settled_market_bets_after_cutoff"])
          print("Prospective model probability score sample:", prospective["n"])
          print("Prospective exact snapshot linkage:", coverage["prospective_settled_selections_with_exact_snapshot_match"])
          print("Historical event-clustered diagnostics:", historical_probability["event_clustered_score_diagnostics"])
          PY

      - name: Publish value research report without overwriting newer main
        if: steps.refresh_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+topboyasian-stack@users.noreply.github.com'
          candidate='/tmp/nba_totals_probability_value_experiment.json'
          cp data/nba_totals_probability_value_experiment.json "$candidate"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$candidate" data/nba_totals_probability_value_experiment.json
            git add data/nba_totals_probability_value_experiment.json
            if git diff --cached --quiet; then
              echo 'The same NBA probability/value report is already published.'
              exit 0
            fi
            git commit -m 'Publish NBA totals probability and value research'
            if git push origin HEAD:main; then
              echo 'NBA probability/value report published.'
              exit 0
            fi
            echo 'Concurrent main update; retrying.'
            sleep $((attempt * 2))
          done
          echo 'Could not publish the NBA probability/value report after five attempts.' >&2
          exit 1
