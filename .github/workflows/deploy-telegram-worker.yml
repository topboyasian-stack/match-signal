name: Deploy Match Signal Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - 'telegram-worker/**'
      - '.github/workflows/deploy-telegram-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        working-directory: telegram-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL=$(grep -Eo 'https://match-signal-telegram\.[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1)
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine deployed workers.dev URL"
            exit 1
          fi
          echo "Deployed Worker: $WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN secret"
            exit 1
          fi
          WEBHOOK_SECRET=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          RESPONSE=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}/telegram/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
