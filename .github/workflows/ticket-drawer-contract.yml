name: Match Signal Ticket Drawer Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'basketball.html'
      - 'football.html'
      - 'tennis.html'
      - 'odds-builder.html'
      - 'ticket-drawer.js'
      - 'ticket-drawer.css'
      - 'functions/api/sportybet-booking.js'
      - 'basketball-live.js'
      - 'scripts/test_ticket_drawer_contract.py'
      - 'scripts/test_sportybet_booking_resilience.mjs'
      - '.github/workflows/ticket-drawer-contract.yml'
  push:
    branches: [main]
    paths:
      - 'basketball.html'
      - 'football.html'
      - 'tennis.html'
      - 'odds-builder.html'
      - 'ticket-drawer.js'
      - 'ticket-drawer.css'
      - 'functions/api/sportybet-booking.js'
      - 'basketball-live.js'
      - 'scripts/test_ticket_drawer_contract.py'
      - '.github/workflows/ticket-drawer-contract.yml'

permissions:
  contents: read

jobs:
  ticket-drawer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check drawer and Cloudflare booking handler syntax
        run: |
          node --check ticket-drawer.js
          node --check functions/api/sportybet-booking.js
          node --check scripts/test_sportybet_booking_resilience.mjs
      - name: Check live booking and sport-desk contract
        run: |
          python scripts/test_ticket_drawer_contract.py
          node scripts/test_sportybet_booking_resilience.mjs
      - name: Verify production booking endpoint returns JSON for rejected tickets
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://match-signal.pages.dev/api/sportybet-booking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Cache-Control': 'no-store' },
            body: JSON.stringify({ mode: 'manual', manual_selections: [] }),
            cache: 'no-store',
            signal: AbortSignal.timeout(15000)
          });
          const raw = await response.text();
          const contentType = String(response.headers.get('content-type') || '').toLowerCase();
          let payload = null;
          try { payload = JSON.parse(raw); } catch {}
          if (response.status !== 422 ||
              !contentType.includes('application/json') ||
              payload?.error !== 'INVALID_MANUAL_LEG_COUNT' ||
              payload?.booking_code) {
            throw new Error('Production booking endpoint did not return the expected JSON validation response: HTTP ' +
              response.status + ', content-type ' + contentType + ', body ' + raw.replace(/\\s+/g, ' ').slice(0, 240));
          }
          console.log('Production booking endpoint returned HTTP 422 JSON; invalid/empty ticket was rejected and no code was generated.');
          NODE
