name: NBA totals capture freshness watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-totals-capture-watchdog.yml'
      - '.github/workflows/nba-totals-price-capture.yml'
      - '.github/workflows/nba-totals-settlement.yml'
      - '.github/workflows/nba-totals-probability-value.yml'
      - 'scripts/nba_totals_capture_watchdog.py'
      - 'scripts/test_nba_totals_capture_watchdog.py'
  schedule:
    # Run five minutes after capture slots; recover only when the last exact
    # SportyBet market-225 capture is stale and no capture is active.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Unified Upcoming Board"
      - "Deploy Match Signal to Cloudflare Pages"
      - "NBA totals settlement ledger"
      - "NBA totals SportyBet market-225 price capture"
      - "NBA totals probability and value research"
    types: [completed]
permissions:
  actions: write
  contents: read

concurrency:
  # Keep the cron watchdog in its own queue. Workflow-run recovery events can
  # arrive in bursts and must not cancel a pending scheduled freshness check.
  group: nba-totals-capture-freshness-watchdog-${{ github.event_name == 'schedule' && 'scheduled' || (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'recovery' || 'event-driven' }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Match Signal Live Expansion' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'Match Signal Unified Upcoming Board' && github.event.workflow_run.conclusion == 'success') || github.event.workflow_run.name == 'Deploy Match Signal to Cloudflare Pages' || (github.event.workflow_run.name == 'NBA totals settlement ledger' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'NBA totals SportyBet market-225 price capture' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'NBA totals probability and value research' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Re-enable NBA research and capture schedules after delivery gaps
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            nba-totals-price-capture.yml \
            nba-totals-probability-value.yml \
            nba-totals-settlement.yml \
            nba-totals-capture-watchdog.yml \
            live-expansion.yml; do
            echo "Ensuring scheduled workflow is enabled: $workflow"
            workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')"
            echo "Workflow state before schedule re-arm: $workflow_state"
            # Reassert the active state even when GitHub reports active; schedule delivery
            # can lag behind the workflow metadata after long gaps.
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
            workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')"
            echo "Workflow state after schedule re-arm: $workflow_state"
            if [ "$workflow_state" != "active" ]; then
              echo "Scheduled workflow is not active after recovery: $workflow (state=$workflow_state)" >&2
              exit 1
            fi
            echo "Verified active scheduled workflow: $workflow"
          done

      - name: Test stale-capture recovery policy
        run: PYTHONPATH=scripts python scripts/test_nba_totals_capture_watchdog.py

      - name: Count queued or running capture workflows
        id: active_capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba-totals-price-capture.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active NBA price-capture runs: $active"

      - name: Decide whether a recovery capture is needed
        id: freshness
        env:
          ACTIVE_CAPTURE_RUNS: ${{ steps.active_capture.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import capture_age_minutes, should_dispatch_capture

          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          checked_at = status.get("checked_at")
          now = datetime.now(timezone.utc)
          active = int(os.environ.get("ACTIVE_CAPTURE_RUNS", "0"))
          age = capture_age_minutes(checked_at, now)
          dispatch = should_dispatch_capture(checked_at, now, active_capture_runs=active, max_age_minutes=10)
          print(f"dispatch={'true' if dispatch else 'false'}")
          print(f"capture_age_minutes={age:.2f}" if age is not None else "capture_age_minutes=unknown")
          if dispatch:
              print("reason=stale_capture_and_no_active_capture_run")
          elif active:
              print("reason=capture_already_queued_or_running")
          else:
              print("reason=latest_capture_within_freshness_window")
          PY

      - name: Dispatch recovery capture
        if: steps.freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nba-totals-price-capture.yml --ref main
          echo "Dispatched the existing exact SportyBet market-225 capture workflow."

      - name: Count queued or running NBA model refresh workflows
        id: active_model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live-expansion.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active NBA model refresh runs: $active"

      - name: Decide whether the NBA pre-game model publication is stale
        id: model_freshness
        env:
          ACTIVE_MODEL_RUNS: ${{ steps.active_model.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import (
              should_dispatch_model_refresh,
              stale_upcoming_prediction_count,
          )

          now = datetime.now(timezone.utc)
          try:
              predictions = json.loads(Path("data/nba_predictions.json").read_text(encoding="utf-8"))
          except Exception:
              predictions = None
          try:
              status = json.loads(Path("data/expansion_status.json").read_text(encoding="utf-8"))
          except Exception:
              status = {}
          nba_status = (status.get("competitions") or {}).get("NBA") or {}
          schedule_count = int(nba_status.get("current_fixtures") or 0)
          if isinstance(predictions, list):
              upcoming = []
              for row in predictions:
                  if not isinstance(row, dict):
                      continue
                  try:
                      start = datetime.fromisoformat(str(row.get("start_time") or "").replace("Z", "+00:00"))
                      if start.tzinfo is None:
                          start = start.replace(tzinfo=timezone.utc)
                      if start.astimezone(timezone.utc) > now:
                          upcoming.append(row)
                  except ValueError:
                      continue
              # A known populated NBA schedule with no upcoming forecasts is a stale publication too.
              if schedule_count > 0 and not upcoming:
                  predictions = None

          stale_count = stale_upcoming_prediction_count(predictions, now)
          active = int(os.environ.get("ACTIVE_MODEL_RUNS", "0"))
          dispatch = should_dispatch_model_refresh(
              predictions,
              status.get("updated_at"),
              now,
              active_model_runs=active,
              max_age_hours=6,
              min_retry_minutes=30,
          )
          print(f"stale_upcoming_predictions={stale_count if stale_count is not None else 'unknown'}")
          print(f"nba_schedule_fixtures={schedule_count}")
          print(f"active_model_runs={active}")
          print(f"dispatch={'true' if dispatch else 'false'}")
          if dispatch:
              print("reason=stale_or_missing_pregame_model_and_no_active_run_after_retry_cooldown")
          elif active:
              print("reason=model_refresh_already_queued_or_running")
          elif stale_count == 0:
              print("reason=upcoming_model_projections_within_six_hour_window")
          else:
              print("reason=recent_model_attempt_cooldown_or_future_status_clock_skew")
          PY

      - name: Dispatch NBA pre-game model recovery
        if: steps.model_freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run live-expansion.yml --ref main
          echo "Dispatched the existing NBA model/fixture refresh; basketball release remains research-only."

      - name: Count queued or running ESPN settlement workflows
        id: active_settlement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba-totals-settlement.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active official ESPN settlement runs: $active"

      - name: Decide whether official ESPN settlement is stale
        id: settlement_freshness
        env:
          ACTIVE_SETTLEMENT_RUNS: ${{ steps.active_settlement.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import capture_age_minutes, should_dispatch_settlement

          try:
              ledger = json.loads(Path("data/nba_totals_ledger.json").read_text(encoding="utf-8"))
          except Exception:
              ledger = {}
          updated_at = ledger.get("updated_at")
          now = datetime.now(timezone.utc)
          active = int(os.environ.get("ACTIVE_SETTLEMENT_RUNS", "0"))
          age = capture_age_minutes(updated_at, now)
          dispatch = should_dispatch_settlement(
              updated_at, now, active_settlement_runs=active, max_age_minutes=15
          )
          print(f"dispatch={'true' if dispatch else 'false'}")
          print(f"ledger_age_minutes={age:.2f}" if age is not None else "ledger_age_minutes=unknown")
          print(f"active_settlement_runs={active}")
          if dispatch:
              print("reason=ledger_stale_and_no_active_settlement_run")
          elif active:
              print("reason=settlement_already_queued_or_running")
          else:
              print("reason=settlement_ledger_within_15_minute_window")
          PY

      - name: Dispatch stale official ESPN settlement recovery
        if: steps.settlement_freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nba-totals-settlement.yml --ref main
          echo "Dispatched the existing official ESPN settlement workflow; no synthetic settlements were added."

      - name: Count queued or running NBA totals research refreshes
        id: active_research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba-totals-probability-value.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active NBA totals research refreshes: $active"

      - name: Decide whether the NBA totals research report is stale
        id: research_freshness
        env:
          ACTIVE_CAPTURE_RUNS: ${{ steps.active_capture.outputs.count }}
          ACTIVE_RESEARCH_RUNS: ${{ steps.active_research.outputs.count }}
          ACTIVE_SETTLEMENT_RUNS: ${{ steps.active_settlement.outputs.count }}
          SETTLEMENT_DISPATCHED: ${{ steps.settlement_freshness.outputs.dispatch }}
          MODEL_REFRESH_DISPATCHED: ${{ steps.model_freshness.outputs.dispatch }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import (
              capture_age_minutes,
              should_dispatch_probability_report,
          )

          now = datetime.now(timezone.utc)
          try:
              report = json.loads(Path("data/nba_totals_probability_value_experiment.json").read_text(encoding="utf-8"))
              generated_at = report.get("generated_at")
          except Exception:
              generated_at = None

          source_values = []
          for path, key in (
              ("data/nba_totals_price_capture_status.json", "checked_at"),
              ("data/nba_totals_ledger.json", "updated_at"),
              ("data/nba_totals_oos_value_test.json", "generated_at"),
          ):
              try:
                  payload = json.loads(Path(path).read_text(encoding="utf-8"))
                  value = payload.get(key)
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  source_values.append(parsed.astimezone(timezone.utc))
              except Exception:
                  continue
          latest_source = max(source_values) if source_values else None
          source_updated_at = latest_source.isoformat() if latest_source else None

          active_capture = int(os.environ.get("ACTIVE_CAPTURE_RUNS", "0"))
          active_research = int(os.environ.get("ACTIVE_RESEARCH_RUNS", "0"))
          active_settlement = int(os.environ.get("ACTIVE_SETTLEMENT_RUNS", "0"))
          settlement_dispatched = os.environ.get("SETTLEMENT_DISPATCHED", "").lower() == "true"
          model_dispatched = os.environ.get("MODEL_REFRESH_DISPATCHED", "").lower() == "true"
          age = capture_age_minutes(generated_at, now)
          dispatch = should_dispatch_probability_report(
              generated_at,
              source_updated_at,
              now,
              active_research_runs=active_research,
              active_settlement_runs=active_settlement,
              active_capture_runs=active_capture,
              settlement_dispatched=settlement_dispatched,
              max_age_minutes=15,
          ) and not model_dispatched

          print(f"report_age_minutes={age:.2f}" if age is not None else "report_age_minutes=unknown")
          print(f"latest_source_updated_at={source_updated_at or 'unknown'}")
          print(f"active_capture_runs={active_capture}")
          print(f"active_research_runs={active_research}")
          print(f"active_settlement_runs={active_settlement}")
          print(f"settlement_dispatched={str(settlement_dispatched).lower()}")
          print(f"model_refresh_dispatched={str(model_dispatched).lower()}")
          print(f"dispatch={'true' if dispatch else 'false'}")
          if dispatch:
              print("reason=report_at_least_15_minutes_old_and_newer_capture_or_settlement_evidence_exists")
          elif active_capture:
              print("reason=wait_for_fresh_immutable_capture_before_report_refresh")
          elif active_research:
              print("reason=research_refresh_already_queued_or_running")
          elif active_settlement or settlement_dispatched:
              print("reason=wait_for_official_ESPN_settlement_before_report_refresh")
          elif model_dispatched:
              print("reason=wait_for_new_model_publication_before_refreshing_report")
          else:
              print("reason=report_current_for_latest_evidence")
          PY

      - name: Dispatch stale NBA totals research report recovery
        if: steps.research_freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nba-totals-probability-value.yml --ref main
          echo "Dispatched the existing NBA totals probability/value research workflow; all release gates remain unchanged."
