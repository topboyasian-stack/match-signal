name: NBA totals capture freshness watchdog

on:
  schedule:
    # Run halfway between 10-minute capture slots; recover only when the last
    # exact SportyBet market-225 capture is stale and no capture is active.
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Unified Upcoming Board"
      - "Deploy Match Signal to Cloudflare Pages"
      - "NBA totals settlement ledger"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/nba_totals_capture_watchdog.py'
      - 'scripts/test_nba_totals_capture_watchdog.py'
      - '.github/workflows/nba-totals-capture-watchdog.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: nba-totals-capture-freshness-watchdog
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Match Signal Live Expansion' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'Match Signal Unified Upcoming Board' && github.event.workflow_run.conclusion == 'success') || github.event.workflow_run.name == 'Deploy Match Signal to Cloudflare Pages' || (github.event.workflow_run.name == 'NBA totals settlement ledger' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Re-enable NBA research and capture schedules after delivery gaps
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            nba-totals-price-capture.yml \
            nba-totals-probability-value.yml \
            nba-totals-settlement.yml \
            nba-totals-capture-watchdog.yml \
            live-expansion.yml; do
            echo "Ensuring scheduled workflow is enabled: $workflow"
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
          done

      - name: Test stale-capture recovery policy
        run: PYTHONPATH=scripts python scripts/test_nba_totals_capture_watchdog.py

      - name: Count queued or running capture workflows
        id: active_capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba-totals-price-capture.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active NBA price-capture runs: $active"

      - name: Decide whether a recovery capture is needed
        id: freshness
        env:
          ACTIVE_CAPTURE_RUNS: ${{ steps.active_capture.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import capture_age_minutes, should_dispatch_capture

          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          checked_at = status.get("checked_at")
          now = datetime.now(timezone.utc)
          active = int(os.environ.get("ACTIVE_CAPTURE_RUNS", "0"))
          age = capture_age_minutes(checked_at, now)
          dispatch = should_dispatch_capture(checked_at, now, active_capture_runs=active, max_age_minutes=10)
          print(f"dispatch={'true' if dispatch else 'false'}")
          print(f"capture_age_minutes={age:.2f}" if age is not None else "capture_age_minutes=unknown")
          if dispatch:
              print("reason=stale_capture_and_no_active_capture_run")
          elif active:
              print("reason=capture_already_queued_or_running")
          else:
              print("reason=latest_capture_within_freshness_window")
          PY

      - name: Dispatch recovery capture
        if: steps.freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nba-totals-price-capture.yml --ref main
          echo "Dispatched the existing exact SportyBet market-225 capture workflow."

      - name: Count queued or running NBA model refresh workflows
        id: active_model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live-expansion.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active NBA model refresh runs: $active"

      - name: Decide whether the NBA pre-game model publication is stale
        id: model_freshness
        env:
          ACTIVE_MODEL_RUNS: ${{ steps.active_model.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import (
              should_dispatch_model_refresh,
              stale_upcoming_prediction_count,
          )

          now = datetime.now(timezone.utc)
          try:
              predictions = json.loads(Path("data/nba_predictions.json").read_text(encoding="utf-8"))
          except Exception:
              predictions = None
          try:
              status = json.loads(Path("data/expansion_status.json").read_text(encoding="utf-8"))
          except Exception:
              status = {}
          nba_status = (status.get("competitions") or {}).get("NBA") or {}
          schedule_count = int(nba_status.get("current_fixtures") or 0)
          if isinstance(predictions, list):
              upcoming = []
              for row in predictions:
                  if not isinstance(row, dict):
                      continue
                  try:
                      start = datetime.fromisoformat(str(row.get("start_time") or "").replace("Z", "+00:00"))
                      if start.tzinfo is None:
                          start = start.replace(tzinfo=timezone.utc)
                      if start.astimezone(timezone.utc) > now:
                          upcoming.append(row)
                  except ValueError:
                      continue
              # A known populated NBA schedule with no upcoming forecasts is a stale publication too.
              if schedule_count > 0 and not upcoming:
                  predictions = None

          stale_count = stale_upcoming_prediction_count(predictions, now)
          active = int(os.environ.get("ACTIVE_MODEL_RUNS", "0"))
          dispatch = should_dispatch_model_refresh(
              predictions,
              status.get("updated_at"),
              now,
              active_model_runs=active,
              max_age_hours=6,
              min_retry_minutes=30,
          )
          print(f"stale_upcoming_predictions={stale_count if stale_count is not None else 'unknown'}")
          print(f"nba_schedule_fixtures={schedule_count}")
          print(f"active_model_runs={active}")
          print(f"dispatch={'true' if dispatch else 'false'}")
          if dispatch:
              print("reason=stale_or_missing_pregame_model_and_no_active_run_after_retry_cooldown")
          elif active:
              print("reason=model_refresh_already_queued_or_running")
          elif stale_count == 0:
              print("reason=upcoming_model_projections_within_six_hour_window")
          else:
              print("reason=recent_model_attempt_cooldown_or_future_status_clock_skew")
          PY

      - name: Dispatch NBA pre-game model recovery
        if: steps.model_freshness.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run live-expansion.yml --ref main
          echo "Dispatched the existing NBA model/fixture refresh; basketball release remains research-only."
