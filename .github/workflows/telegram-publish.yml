name: Publish Match Signal to Telegram

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: match-signal-telegram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest generated data
        uses: actions/checkout@v4

      - name: Build stable signal fingerprint
        id: fingerprint
        shell: bash
        run: |
          python - <<'PY' > /tmp/signal-fingerprint
          import hashlib, json
          from datetime import datetime, timezone, timedelta

          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      value = json.load(f)
                  return value if isinstance(value, list) else []
              except Exception:
                  return []

          predictions = load('data/predictions.json')
          basketball = load('data/basketball_predictions.json')
          now = datetime.now(timezone.utc)
          cutoff = now + timedelta(hours=30)
          rows = []
          for p in predictions + basketball:
              raw = p.get('start_time') or p.get('commence_time')
              try:
                  start = datetime.fromisoformat(raw.replace('Z', '+00:00'))
              except Exception:
                  continue
              if start < now - timedelta(hours=2) or start > cutoff:
                  continue
              if float(p.get('confidence') or 0) >= 0.55 or p.get('qualified_signal') is True:
                  rows.append((start, p))
          rows.sort(key=lambda item: item[0])
          rows = rows[:8]

          identity = []
          for _, p in rows:
              identity.append({
                  'sport': p.get('sport'),
                  'event_id': p.get('event_id') or p.get('id'),
                  'start_time': p.get('start_time') or p.get('commence_time'),
                  'player_1': p.get('player_1'),
                  'player_2': p.get('player_2'),
                  'home_team': p.get('home_team') or p.get('team_1') or p.get('player_1'),
                  'away_team': p.get('away_team') or p.get('team_2') or p.get('player_2'),
                  'pick': p.get('pick') or p.get('selection') or p.get('prediction'),
                  'market': p.get('market'),
              })
          payload = json.dumps(identity, sort_keys=True, separators=(',', ':'))
          digest = hashlib.sha256(payload.encode()).hexdigest()
          print(f'hash={digest}')
          print(f'count={len(identity)}')
          PY
          cat /tmp/signal-fingerprint
          HASH=$(sed -n 's/^hash=//p' /tmp/signal-fingerprint)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore publication marker
        id: telegram-cache
        uses: actions/cache/restore@v4
        with:
          path: .telegram-published
          key: match-signal-telegram-v2-${{ steps.fingerprint.outputs.hash }}

      - name: Publish qualified signals
        if: steps.telegram-cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat_id:
              raise SystemExit('Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret')

          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      value = json.load(f)
                  return value if isinstance(value, list) else []
              except Exception:
                  return []

          def pct(v):
              return f'{float(v or 0)*100:.1f}%'

          def esc(v):
              return str(v or '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          predictions = load('data/predictions.json')
          basketball = load('data/basketball_predictions.json')
          now = datetime.now(timezone.utc)
          cutoff = now + timedelta(hours=30)
          rows = []
          for p in predictions + basketball:
              raw = p.get('start_time') or p.get('commence_time')
              try:
                  start = datetime.fromisoformat(raw.replace('Z', '+00:00'))
              except Exception:
                  continue
              if start < now - timedelta(hours=2) or start > cutoff:
                  continue
              if float(p.get('confidence') or 0) >= 0.55 or p.get('qualified_signal') is True:
                  p['_start'] = start
                  rows.append(p)

          rows.sort(key=lambda p: p['_start'])
          rows = rows[:8]
          if not rows:
              print('No qualified upcoming signals to publish.')
              raise SystemExit(0)

          blocks = ['📡 <b>MATCH SIGNAL — LIVE PICKS</b>']
          for p in rows:
              sport = str(p.get('sport', '')).lower()
              if sport == 'basketball':
                  home = p.get('home_team') or p.get('team_1') or 'Home'
                  away = p.get('away_team') or p.get('team_2') or 'Away'
                  market = p.get('market') or 'O/U'
                  pick = p.get('pick') or p.get('selection') or 'Qualified signal'
                  blocks.append(f'🏀 <b>{esc(home)} vs {esc(away)}</b>\n{esc(market)}: <b>{esc(pick)}</b> — {pct(p.get("confidence"))}')
              elif sport == 'tennis':
                  pick = p.get('player_1') if p.get('pick') == 'p1' else p.get('player_2') if p.get('pick') == 'p2' else p.get('pick')
                  blocks.append(f'🎾 <b>{esc(p.get("player_1"))} vs {esc(p.get("player_2"))}</b>\nPick: <b>{esc(pick)}</b> — {pct(p.get("confidence"))}')
              else:
                  home = p.get('home_team') or p.get('team_1') or 'Home'
                  away = p.get('away_team') or p.get('team_2') or 'Away'
                  pick = p.get('pick') or p.get('prediction') or 'Qualified signal'
                  blocks.append(f'⚽ <b>{esc(home)} vs {esc(away)}</b>\nPick: <b>{esc(pick)}</b> — {pct(p.get("confidence"))}')

          blocks.append('\n<a href="https://topboyasian-stack.github.io/match-signal/">Open Match Signal →</a>')
          payload = json.dumps({
              'chat_id': chat_id,
              'text': '\n\n'.join(blocks),
              'parse_mode': 'HTML',
              'disable_web_page_preview': True,
          }).encode()
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.loads(response.read().decode())
          if not result.get('ok'):
              raise SystemExit(result)
          open('.telegram-published', 'w', encoding='utf-8').write('published\n')
          print('Telegram publication succeeded.')
          PY

      - name: Save publication marker
        if: steps.telegram-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .telegram-published
          key: match-signal-telegram-v2-${{ steps.fingerprint.outputs.hash }}
