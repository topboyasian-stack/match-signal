# Virtual Lab v1.2 — canonical collector/trace contract
name: Match Signal Virtual Lab Collector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/virtual-lab-collector.yml'
      - 'scripts/virtual_lab_collector.py'
      - 'scripts/virtual_lab_model_eval.py'
      - 'scripts/virtual_lab_participant_profiles.py'
      - 'scripts/virtual_lab_confirmed_participants.py'
      - 'virtual-lab-confirmed-watch.js'
      - 'data/virtual_lab_participants/efootball_confirmed_watch.json'
      - 'data/virtual_lab_confirmed_participants.json'
      - 'scripts/virtual_lab_eligibility.py'
      - 'scripts/validate_virtual_lab_v1.py'
      - 'virtual-lab-app.js'
      - 'research.html'
      - 'virtual-lab/**'
      - 'data/virtual_lab_participants/**'
      - 'data/virtual_lab_archive/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-virtual-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Syntax-check Virtual Lab v1 engine
        run: node --check virtual-lab-app.js
      - name: Syntax-check Virtual Lab confirmed watch renderer
        run: node --check virtual-lab-confirmed-watch.js

      - name: Syntax-check collector
        run: python -m py_compile scripts/virtual_lab_collector.py
      - name: Syntax-check model evaluation engine
        run: python -m py_compile scripts/virtual_lab_model_eval.py
      - name: Syntax-check participant profile engine
        run: python -m py_compile scripts/virtual_lab_participant_profiles.py
      - name: Syntax-check confirmed participant tracker
        run: python -m py_compile scripts/virtual_lab_confirmed_participants.py
      - name: Syntax-check eligibility engine
        run: python -m py_compile scripts/virtual_lab_eligibility.py

      - name: Run Virtual Lab v1 capture + settlement
        run: python scripts/virtual_lab_collector.py

      - name: Run Virtual Lab v1 repository contract
        run: python scripts/validate_virtual_lab_v1.py

      - name: Validate product namespace contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          watch=json.loads(Path('data/virtual_lab_participants/efootball_confirmed_watch.json').read_text())
          products={str(x.get('product')) for x in watch.get('participants',[])}
          assert products <= {'efootball_gt'}, f'confirmed watch contamination: {products}'
          assert len(watch.get('participants',[])) == 9, 'confirmed eFootball watch unexpectedly changed'
          print('Confirmed eFootball watch namespace OK:', sorted(products), len(watch.get('participants',[])))
          PY

      - name: Run strict chronological model evaluation
        run: python scripts/virtual_lab_model_eval.py

      - name: Build participant performance profiles
        run: python scripts/virtual_lab_participant_profiles.py
      - name: Track official results for confirmed participants
        run: python scripts/virtual_lab_confirmed_participants.py

      - name: Recalculate league and line eligibility
        run: python scripts/virtual_lab_eligibility.py

      - name: Validate collector artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              'data/virtual_lab_pending.json',
              'data/virtual_lab_history.json',
              'data/virtual_lab_status.json',
              'data/virtual_lab_eligibility.json',
              'data/virtual_lab_model_eval.json',
              'data/virtual_lab_participant_profiles.json',
              'data/virtual_lab_confirmed_participants.json',
              'data/virtual_lab_confirmed_participant_results.json',
              'data/virtual_lab_participants/registry.json',
          ]:
              p = Path(name)
              data = json.loads(p.read_text())
              print(name, 'OK', len(data) if isinstance(data, list) else 'object')
          PY

      - name: Publish collector artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git add data/virtual_lab_pending.json data/virtual_lab_history.json data/virtual_lab_status.json data/virtual_lab_eligibility.json data/virtual_lab_model_eval.json data/virtual_lab_participant_profiles.json data/virtual_lab_confirmed_participant_results.json data/virtual_lab_participants/registry.json data/virtual_lab_archive/settlements

            if git diff --cached --quiet; then
              echo "Virtual Lab collector produced no data changes."
              exit 0
            fi

            git commit -m "🤖 Collect and settle Virtual Lab observations"

            if git push origin main; then
              echo "Virtual Lab collector publication succeeded on attempt $attempt."
              exit 0
            fi

            echo "Concurrent main update detected; rebuilding from latest main (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/virtual_lab_collector.py
            python scripts/virtual_lab_model_eval.py
            python scripts/virtual_lab_participant_profiles.py
            python scripts/virtual_lab_confirmed_participants.py
            python scripts/virtual_lab_eligibility.py
          done

          echo "Virtual Lab collector could not publish after retries."
          exit 1
