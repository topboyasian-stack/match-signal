# Virtual Lab v1.3 — canonical collector/trace contract + eFootball distribution evaluation
# 2026-10-31: force an immediate collector run after the participant-history freshness watchdog was repaired.
name: Match Signal Virtual Lab Collector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/virtual-lab-collector.yml'
      - 'scripts/virtual_lab_collector.py'
      - 'scripts/virtual_lab_model_eval.py'
      - 'scripts/test_virtual_lab_model_eval.py'
      - 'scripts/test_workflow_trigger_boundaries.py'
      - 'scripts/virtual_lab_participant_profiles.py'
      - 'scripts/virtual_lab_confirmed_participants.py'
      - 'scripts/virtual_lab_h2h_enricher.py'
      - 'virtual-lab-confirmed-watch.js'
      # Manual watch input remains a trigger, but generated H2H/archive files below are intentionally excluded
      # to prevent the collector's own publication from immediately launching a second full 12-minute run.
      - 'data/virtual_lab_participants/efootball_confirmed_watch.json'
      - 'scripts/virtual_lab_eligibility.py'
      - 'scripts/validate_virtual_lab_v1.py'
      - 'virtual-lab-app.js'
      - 'research.html'
      - 'virtual-lab/**'
  schedule:
    # This full settlement/evaluation pass recently took about 12 minutes. Keep it
    # on a 15-minute cadence; the separate live-feed sync and Unified Upcoming board
    # retain their faster schedules for current fixtures and SportyBet prices.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  # Touch-triggered self-check: this workflow must be runnable immediately after remediation.

permissions:
  actions: write
  contents: write

concurrency:
  group: match-signal-virtual-lab-collector
  # The full collector can take longer than its 15-minute schedule. Never cancel an
  # active settlement/model run during artifact publication; queue the next run instead.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Syntax-check Virtual Lab v1 engine
        run: node --check virtual-lab-app.js
      - name: Syntax-check Virtual Lab confirmed watch renderer
        run: node --check virtual-lab-confirmed-watch.js

      - name: Test automated workflow trigger boundaries
        run: python scripts/test_workflow_trigger_boundaries.py

      - name: Syntax-check collector
        run: python -m py_compile scripts/virtual_lab_collector.py
      - name: Syntax-check model evaluation engine
        run: python -m py_compile scripts/virtual_lab_model_eval.py
      - name: Syntax-check participant lifecycle collector
        run: python -m py_compile scripts/virtual_lab_collector.py

      - name: Syntax-check participant profile engine
        run: python -m py_compile scripts/virtual_lab_participant_profiles.py
      - name: Syntax-check confirmed participant tracker
        run: python -m py_compile scripts/virtual_lab_confirmed_participants.py
      - name: Syntax-check external H2H enricher
        run: python -m py_compile scripts/virtual_lab_h2h_enricher.py
      - name: Syntax-check eligibility engine
        run: python -m py_compile scripts/virtual_lab_eligibility.py

      - name: Run Virtual Lab v1 capture + settlement
        run: python scripts/virtual_lab_collector.py

      - name: Run Virtual Lab v1 repository contract
        run: python scripts/validate_virtual_lab_v1.py

      - name: Recompute system health after Virtual Lab refresh
        run: python scripts/system_health_audit.py

      - name: Validate optional manual watch namespace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          watch=json.loads(Path('data/virtual_lab_participants/efootball_confirmed_watch.json').read_text())
          products={str(x.get('product')) for x in watch.get('participants',[])}
          assert products <= {'efootball_gt'}, f'confirmed watch contamination: {products}'
          print('Optional manual eFootball watch namespace OK:', sorted(products), len(watch.get('participants',[])))
          PY

      - name: Regression-test accelerated line-ladder fit
        run: python scripts/test_virtual_lab_model_eval.py

      - name: Run strict chronological model evaluation
        run: python scripts/virtual_lab_model_eval.py

      - name: Build participant performance profiles
        run: python scripts/virtual_lab_participant_profiles.py
      - name: Capture prospective external H2H context
        run: python scripts/virtual_lab_h2h_enricher.py

      - name: Track official results for confirmed participants
        run: python scripts/virtual_lab_confirmed_participants.py

      - name: Recalculate league and line eligibility
        run: python scripts/virtual_lab_eligibility.py

      - name: Assert feed-driven participant discovery is alive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('data/virtual_lab_status.json').read_text())
          lifecycle=json.loads(Path('data/virtual_lab_participant_lifecycle.json').read_text())
          current=int(status.get('upcoming_events') or 0)
          active=int(lifecycle.get('active_count') or 0)+int(lifecycle.get('live_count') or 0)+int(lifecycle.get('upcoming_count') or 0)
          print('Current virtual fixtures:', current)
          print('Active/live/upcoming participant identities:', active)
          print('Lifecycle discovery mode:', lifecycle.get('discovery_mode'))
          if current>0 and active<=0:
              raise SystemExit('ABORT: live virtual feed has fixtures but participant lifecycle discovered zero active identities')
          if lifecycle.get('discovery_mode') != 'feed_driven':
              raise SystemExit('ABORT: participant lifecycle is not feed-driven')
          PY

      - name: Validate collector artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              'data/virtual_lab_pending.json',
              'data/virtual_lab_history.json',
              'data/virtual_lab_status.json',
              'data/virtual_lab_eligibility.json',
              'data/virtual_lab_model_eval.json',
              'data/virtual_lab_participant_profiles.json',
              'data/virtual_lab_participant_h2h.json',
              'data/virtual_lab_external_h2h.json',
              'data/virtual_lab_confirmed_participants.json',
              'data/virtual_lab_confirmed_participant_results.json',
              'data/virtual_lab_participants/registry.json',
              'data/virtual_lab_participant_lifecycle.json',
          ]:
              p = Path(name)
              data = json.loads(p.read_text())
              print(name, 'OK', len(data) if isinstance(data, list) else 'object')
          PY

      - name: Publish collector artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reconcile with latest main before every push. Do not spend two minutes
          # pushing a 50MB snapshot that is already guaranteed to be rejected.
          # Only regenerate the expensive research snapshot for a true same-file
          # conflict, never for ordinary concurrent board/Builder commits.
          stage_outputs() {
            git add data/virtual_lab_pending.json data/virtual_lab_history.json data/virtual_lab_status.json data/virtual_lab_eligibility.json data/virtual_lab_model_eval.json data/virtual_lab_participant_profiles.json data/virtual_lab_participant_h2h.json data/virtual_lab_external_h2h.json data/virtual_lab_confirmed_participant_results.json data/virtual_lab_participants/registry.json data/virtual_lab_participant_lifecycle.json data/virtual_lab_archive/settlements
          }

          regenerate_after_conflict() {
            echo "Collector-owned files conflicted with a newer publication; rebuilding one coherent snapshot."
            git rebase --abort || true
            timeout --signal=TERM --kill-after=10s 45s env GIT_TERMINAL_PROMPT=0 git fetch origin main
            git reset --hard origin/main
            python scripts/virtual_lab_collector.py
            python scripts/virtual_lab_model_eval.py
            python scripts/virtual_lab_participant_profiles.py
            python scripts/virtual_lab_h2h_enricher.py
            python scripts/virtual_lab_confirmed_participants.py
            python scripts/virtual_lab_eligibility.py
            python scripts/system_health_audit.py
            stage_outputs
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Collect and settle Virtual Lab observations"
            fi
          }

          for attempt in 1 2 3 4 5; do
            stage_outputs
            if ! git diff --cached --quiet; then
              git commit -m "🤖 Collect and settle Virtual Lab observations"
            fi

            if ! timeout --signal=TERM --kill-after=10s 45s env GIT_TERMINAL_PROMPT=0 git fetch origin main; then
              echo "Could not fetch latest main before publish attempt $attempt." >&2
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
              continue
            fi

            if ! git rebase origin/main; then
              regenerate_after_conflict
            fi

            # The Unified Upcoming workflow owns the shared system-health artifact.
            # Do not rewrite it here: an unstaged system_health.json change makes the
            # next git rebase fail with "cannot rebase: You have unstaged changes",
            # which used to trigger an unnecessary full collector/model rebuild.
            # Unified Upcoming recalculates and publishes system health after this run.

            ahead="$(git rev-list --count origin/main..HEAD)"
            if [ "$ahead" -eq 0 ]; then
              echo "Virtual Lab collector artifacts already match latest main."
              exit 0
            fi

            # Main receives frequent independent updates. A bounded push is attempted
            # only after fetching/rebasing; retries fetch again at the top of the loop.
            if timeout --signal=TERM --kill-after=10s 90s env GIT_TERMINAL_PROMPT=0 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 push origin HEAD:main; then
              echo "Virtual Lab collector publication succeeded on attempt $attempt."
              exit 0
            fi

            echo "Publication attempt $attempt failed after a latest-main rebase; retrying without recomputing the model."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done

          echo "Virtual Lab collector could not publish after five bounded latest-main retries." >&2
          exit 1
