name: Match Signal SportyBet Pregame Snapshot Capture

on:
  schedule:
    # Capture only during the final 15 minutes before kickoff; ten-minute
    # cadence provides repeated chances to observe each exact market price.
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - "Match Signal Live Prediction Pipeline"
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Tennis Model V2"
      - "Match Signal Result Settlement"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize the immutable quote ledger with other main-branch data publishers.
  group: match-signal-data-publish
  cancel-in-progress: false

jobs:
  capture-pregame-quotes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests curl_cffi

      - name: Validate exact pregame snapshot contracts
        run: |
          python -m py_compile scripts/market_snapshot_freshness.py scripts/capture_sportybet_pregame_snapshots.py scripts/model_guard.py scripts/test_sportybet_pregame_capture_workflow.py
          python scripts/test_market_snapshot_freshness.py
          python scripts/test_capture_sportybet_pregame_snapshots.py
          python scripts/test_sportybet_pregame_capture_workflow.py
          python scripts/test_model_guard_active_scope.py

      - name: Capture exact SportyBet football and ATP prices once
        run: |
          python scripts/capture_sportybet_pregame_snapshots.py
          cp data/sportybet_pregame_snapshots.json /tmp/sportybet_pregame_captured.json

      - name: Publish append-only quote ledger and risk artifacts with race-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the original captured timestamps outside the worktree.
          # If another publisher wins the main-branch race, merge these exact
          # observations into the newest ledger; never refetch and retimestamp.
          for attempt in 1 2 3 4 5; do
            echo "Pregame ledger publication attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          target = Path("data/sportybet_pregame_snapshots.json")
          incoming_path = Path("/tmp/sportybet_pregame_captured.json")
          incoming = json.loads(incoming_path.read_text(encoding="utf-8"))
          remote = json.loads(target.read_text(encoding="utf-8")) if target.exists() else {"version": 1, "snapshots": []}

          remote_rows = remote.get("snapshots") if isinstance(remote.get("snapshots"), list) else []
          incoming_rows = incoming.get("snapshots") if isinstance(incoming.get("snapshots"), list) else []
          keys = {
              (str(row.get("event_id")), str(row.get("market_id")), str(row.get("captured_at")))
              for row in remote_rows if isinstance(row, dict)
          }
          added = 0
          for row in incoming_rows:
              if not isinstance(row, dict):
                  continue
              key = (str(row.get("event_id")), str(row.get("market_id")), str(row.get("captured_at")))
              if key in keys:
                  continue
              remote_rows.append(row)
              keys.add(key)
              added += 1

          remote_rows.sort(key=lambda row: (str(row.get("captured_at") or ""), str(row.get("event_id") or "")))
          remote_rows = remote_rows[-12000:]
          remote["version"] = 1
          remote["policy"] = incoming.get("policy") or remote.get("policy") or (
              "Append-only SportyBet NG exact winner snapshots; football market 1, "
              "ATP market 186; captured 0..15 minutes before kickoff only."
          )
          remote["snapshots"] = remote_rows
          if added or not target.exists():
              remote["updated_at"] = datetime.now(timezone.utc).isoformat()
          target.write_text(json.dumps(remote, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "remote_snapshots": len(remote_rows) - added,
              "captured_snapshots": len(incoming_rows),
              "new_snapshots_merged": added,
              "total_snapshots": len(remote_rows)
          }, indent=2))
          PY

            python scripts/model_guard.py
            git add data/sportybet_pregame_snapshots.json data/risk_gate.json data/value_trial_ledger.json
            if git diff --cached --quiet; then
              echo "No new qualifying pregame snapshots or risk-evidence changes."
              exit 0
            fi

            git commit -m "📈 Record immutable SportyBet pregame snapshots"
            if git push origin main; then
              echo "Pregame snapshot ledger published on attempt ${attempt}."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Could not publish the pregame snapshot ledger after five attempts." >&2
              exit 1
            fi
            echo "main advanced during publication; preserving the original quote timestamps and merging onto latest main."
            sleep $((attempt * 2))
          done
          exit 1
