name: Deploy Match Signal to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'nav-fix.js'
      - 'metrics-fix.js'
      - 'data/**'
      - 'functions/**'
      - 'expansion.js'
      - 'expansion-tennis-ou.js'
      - 'expansion-odds-builder.js'
      - 'live-model-trace.js'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Autopilot Refresh"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install production frontend fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              for src in ('./nav-fix.js','./metrics-fix.js','./live-timer.js'):
                  tag=f'<script src="{src}"></script>'
                  if tag not in text:
                      text=text.replace('</body>',tag+'\n</body>',1)
              marker='<style id="match-signal-nav-fix">'
              style=marker+'.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:9999;cursor:pointer!important;touch-action:manipulation}</style>'
              if marker not in text:
                  text=text.replace('</head>',style+'</head>',1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Verify production artifact
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s performance.html
          test -s live.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s data/predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          assert any(r.get('sport')=='football' for r in rows), 'no football rows'
          assert any(r.get('sport')=='tennis' for r in rows), 'no tennis rows'
          print(f'Prediction rows: {len(rows)}')
          PY

      - name: Resolve Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured"
            exit 1
          fi
          PROJECT=$(curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
            python -c 'import json,sys; d=json.load(sys.stdin); names=[p["name"] for p in d.get("result",[])]; print(next((n for n in names if n=="match-signal"), "")); print("Available Pages projects:", ", ".join(names), file=sys.stderr)')
          if [ -z "$PROJECT" ]; then
            echo "Cloudflare Pages project 'match-signal' was not found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          npx wrangler@latest pages deploy . --project-name="$PROJECT" --branch=main

      - name: Run production browser smoke tests
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = 'https://match-signal.pages.dev';
          const browser = await chromium.launch({headless:true});
          const pages = ['/','/expansion.html','/live.html','/basketball.html','/performance.html'];
          const failures = [];
          for (const path of pages) {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: '+m.text()); });
            try {
              const response = await page.goto(base+path, {waitUntil:'domcontentloaded', timeout:30000});
              if (!response || !response.ok()) failures.push(path+' HTTP '+(response?.status()||'unknown'));
              if (path === '/expansion.html') {
                await page.waitForSelector('#groups', {state:'attached', timeout:10000});
                await page.waitForSelector('#oddsBuilder', {state:'attached', timeout:10000});
                await page.waitForTimeout(3500);
                const groupText = await page.locator('#groups').innerText();
                const oddsText = await page.locator('#oddsBuilder').innerText();
                if (!groupText.trim()) failures.push(path+' Expansion renderer produced no fixture content');
                if (/Loading Odds Builder/i.test(oddsText)) failures.push(path+' Odds Builder remained in loading state');
              } else if (path === '/live.html') {
                await page.waitForSelector('#grid', {timeout:10000});
                await page.waitForSelector('#liveCount', {timeout:10000});
                await page.waitForTimeout(2500);
                const status = await page.locator('#statusText').innerText();
                if (/temporarily unavailable/i.test(status)) failures.push(path+' live status unavailable: '+status);
              } else if (path === '/') {
                await page.waitForSelector('#grid', {timeout:10000});
                await page.waitForTimeout(1200);
              }
            } catch (e) { failures.push(path+' '+e.message); }
            if (errors.length) failures.push(path+' browser errors: '+errors.join(' | '));
            await page.close();
          }
          await browser.close();
          if (failures.length) { console.error(failures.join('\\n')); process.exit(1); }
          console.log('Production browser smoke tests passed: '+pages.join(', '));
          NODE

      - name: Write deployment marker
        run: |
          echo "Cloudflare Pages deployment completed for commit $GITHUB_SHA"
