              if (!r.ok) failures.push('/api/sportybet-virtual-results '+source+' HTTP '+r.status);
              const payload=JSON.parse(body);
              if (payload?.ok!==true) failures.push('/api/sportybet-virtual-results '+source+' returned ok!=true');
              else console.log('Virtual Lab result proxy passed: '+source+' '+(payload.events?.length||0)+' events '+(payload.scopes?.length||0)+' scopes');
            } catch(e) { failures.push('/api/sportybet-virtual-results '+source+' '+e.message); }
          }

          try {
            const r = await fetch(base + '/api/sportybet-booking', {
              method: 'OPTIONS',
              headers: { 'Origin': base, 'Access-Control-Request-Method': 'POST' },
              cache: 'no-store'
            });
            if (r.status !== 204) failures.push('/api/sportybet-booking OPTIONS HTTP '+r.status);
            else console.log('SportyBet booking-code API route passed OPTIONS smoke test');
          } catch(e) { failures.push('/api/sportybet-booking OPTIONS '+e.message); }

          try {
            const dataResp = await fetch(base + '/data/odds_builder.json?bookingSmoke=' + Date.now(), {cache:'no-store'});
            if (!dataResp.ok) throw new Error('odds_builder.json HTTP '+dataResp.status);
            const data = await dataResp.json();
            const now = Date.now();
            const candidates = (Array.isArray(data?.batches)?data.batches:[])
              .map(b => {
                const legs = Array.isArray(b?.legs) ? b.legs : [];
                const future = legs.filter(l => {
                  const t = Date.parse(l?.start_time || '');
                  return Number.isFinite(t) && t > now + 120000;
                });
                return {...b, __future_legs: future};
              })
              .filter(b => b.__future_legs.length >= 2 && b.__future_legs.length <= 20)
              .sort((a,b) => b.__future_legs.length - a.__future_legs.length);
            let smoke = {
              verified_at: new Date().toISOString(),
              status: 'NOT_RUN',
              http_status: null,
              ok: false,
              batch_id: null,
              selection_count: 0,
              booking_code_available: false,
              error: null,
              message: null
            };
            if (!candidates.length) {
              smoke.status = 'NO_FUTURE_BATCH';
              console.log('SportyBet booking POST smoke test skipped: no fully future 2+ leg batch in production artifact');
            } else {
              let last = null;
              for (const batch of candidates.slice(0,3)) {
                const rr = await fetch(base + '/api/sportybet-booking', {
                  method: 'POST',
                  headers: {'Content-Type':'application/json','Accept':'application/json'},
                  body: JSON.stringify({batch_id: String(batch.batch_id)}),
                  cache: 'no-store'
                });
                const raw = await rr.text();
                let payload = null;
                try { payload = raw ? JSON.parse(raw) : null; } catch {}
                last = {rr,raw,payload,batch};
                if (payload && rr.ok && payload.ok === true && payload.booking_code) break;
              }
              const rr = last.rr, raw = last.raw, payload = last.payload, batch = last.batch;
              const volatileUnavailable = Boolean(
                Array.isArray(payload?.validation) &&
                payload.validation.length > 0 &&
                payload.validation.every(v => (v?.ok === true) || (v?.ok === false && v?.excluded === true)) &&
                payload.validation.some(v => v?.ok === false && v?.excluded === true && /exact SportyBet O\/U line or selected side is no longer available/i.test(String(v?.reason || ''))) &&
                ['TOO_FEW_AVAILABLE_SELECTIONS','NO_AVAILABLE_SELECTIONS'].includes(String(payload?.error || ''))
              );
              smoke.status = payload?.ok === true ? 'PASS' : volatileUnavailable ? 'VOLATILE_MARKET' : 'FAIL';
              smoke.http_status = rr.status;
              smoke.ok = Boolean((rr.ok && payload?.ok === true) || volatileUnavailable);
              smoke.batch_id = String(batch.batch_id || '');
              smoke.selection_count = Number(payload?.selection_count || batch.legs?.length || 0);
              smoke.booking_code_available = Boolean(payload?.booking_code);
              smoke.volatile_market = volatileUnavailable;
              smoke.error = payload?.error || null;
              smoke.message = payload?.message || (!payload ? 'Non-JSON response' : (volatileUnavailable ? 'The booking endpoint is healthy, but a current SportyBet leg changed or disappeared before the smoke request.' : null));
              if (!payload) smoke.raw_prefix = String(raw||'').replace(/\s+/g,' ').slice(0,240);
              if (payload?.validation) smoke.validation = payload.validation.slice(0,5);
              if (!smoke.ok) {
                 console.error('SportyBet booking validation diagnostics:', JSON.stringify(payload?.validation||[], null, 2));
                 console.error('SportyBet booking smoke payload:', JSON.stringify(payload||{raw_prefix:smoke.raw_prefix||null}, null, 2));
                 failures.push('/api/sportybet-booking POST smoke failed: HTTP '+rr.status+' '+(smoke.error||smoke.message||'unknown'));
               } else if (volatileUnavailable) {
                 console.log('SportyBet booking endpoint passed semantic smoke: exact batch validation worked, but one current market leg was unavailable at request time; no stale code was fabricated.');
               } else console.log('SportyBet booking POST smoke passed: '+smoke.selection_count+' selections; booking code returned');
            }
            writeFileSync('BOOKING-PRODUCTION-CHECK.json', JSON.stringify(smoke,null,2)+'\n');
          } catch(e) {
            const smoke={verified_at:new Date().toISOString(),status:'ERROR',http_status:null,ok:false,batch_id:null,selection_count:0,booking_code_available:false,error:String(e.message||e)};
            writeFileSync('BOOKING-PRODUCTION-CHECK.json', JSON.stringify(smoke,null,2)+'\n');
            failures.push('/api/sportybet-booking POST smoke '+String(e.message||e));
          }

          try {
            const params = new URLSearchParams({
              pageSize:'100',
              pageNum:'1',
              timeline:'168',
              sources:'efootball,vfootball',
              _t:String(Date.now())
            });
            const {r,body}=await get('/api/sportybet-virtual?'+params.toString());
            if (!r.ok) failures.push('/api/sportybet-virtual HTTP '+r.status);
            const payload=JSON.parse(body);
            const virtualEvents=Array.isArray(payload?.events)?payload.events:[];
            if (payload?.ok!==true) failures.push('/api/sportybet-virtual did not return ok=true');
            for (const [name,status] of Object.entries(payload?.source_status||{})) { if (status?.status==='ERROR') failures.push('/api/sportybet-virtual source '+name+' returned ERROR: '+(status.error||'unknown')); }
            if (virtualEvents.length && !virtualEvents.every(e => Object.prototype.hasOwnProperty.call(e,'score'))) failures.push('/api/sportybet-virtual normalized events are missing score field');
            if (!virtualEvents.length) failures.push('/api/sportybet-virtual returned no eFootball/virtual events');
            const cutoff = Date.now() - 120000;
            const stale = virtualEvents.filter(e => e.start_time_ms && Number(e.start_time_ms) < cutoff);
            if (stale.length) failures.push('/api/sportybet-virtual returned '+stale.length+' stale fixtures');
            if (!payload.upcoming_events_count && virtualEvents.length) failures.push('/api/sportybet-virtual missing upcoming_events_count');
            else {
              console.log('Virtual Lab live source passed: '+virtualEvents.length+' events '+JSON.stringify(payload.product_counts||{}));
              if (!payload.updated_at) failures.push('/api/sportybet-virtual missing updated_at');
              writeFileSync('LIVE-PRODUCTION-CHECK.json', JSON.stringify({
                endpoint:'/api/sportybet-virtual',
                verified_at:new Date().toISOString(),
                status:payload.status,
                events_count:virtualEvents.length,
                product_counts:payload.product_counts||{},
                source_status:payload.source_status||{},
                errors:payload.errors||[]
              },null,2)+'\n');
            }
          } catch(e) { failures.push('/api/sportybet-virtual '+e.message); }

          try {
            const {r,body}=await get('/data/odds_ticket_tracker.json');
            if (!r.ok) failures.push('/data/odds_ticket_tracker.json HTTP '+r.status);
            else {
              const t=JSON.parse(body);
              if (t?.mode!=='PAPER_ONLY') failures.push('/data/odds_ticket_tracker.json is not PAPER_ONLY');
              if (Number(t?.version||0)<2) failures.push('/data/odds_ticket_tracker.json tracker version is not current');
              if (!Array.isArray(t?.tickets)) failures.push('/data/odds_ticket_tracker.json tickets is not an array');
              for (const ticket of t.tickets||[]) {
                if (!ticket.ticket_id) failures.push('/data/odds_ticket_tracker.json ticket missing ticket_id');
                if (!ticket.snapshot_fingerprint) failures.push('/data/odds_ticket_tracker.json ticket missing snapshot_fingerprint');
                if (!Array.isArray(ticket.legs)) failures.push('/data/odds_ticket_tracker.json ticket legs missing');
              }
              console.log('Paper ticket tracker production artifact passed: '+(t.tickets?.length||0)+' tracked tickets');
            }
          } catch(e) { failures.push('/data/odds_ticket_tracker.json '+e.message); }

          try {
            const {r,body}=await get('/data/odds_builder.json');
            if (!r.ok) failures.push('/data/odds_builder.json HTTP '+r.status);
            else {
              const b=JSON.parse(body);
              const legs=Array.isArray(b?.qualified_legs)?b.qualified_legs:[];
              const combined=Number(b?.market_price_combined_odds||0);
              const batches=Array.isArray(b?.batches)?b.batches:[];
              const compactTicket=batches.find(batch=>String(batch?.primary_lane||'')==='efootball_compact_2x');
              const compactLane=Boolean(compactTicket || String(b?.batch_policy?.primary_lane||'')==='efootball_compact_2x');
              const compactPolicy=b?.selection_policy?.compact_efootball_ticket_lane||{};
              const oddsGate=(b?.research_gate?.combined_odds_gate)||{};
              const activeFloor=Number(oddsGate.floor||2.7);
              const laneFloor=compactLane?Number(compactPolicy.min_combined_odds||b?.batch_policy?.compact_efootball_min_combined_odds||2.0):activeFloor;
              const minLegs=compactLane?4:2;
              const maxLegs=compactLane?5:4;
              if (b?.mode!=='PAPER_ONLY') failures.push('/data/odds_builder.json is not PAPER_ONLY');
              if (compactLane && compactPolicy.enabled!==true) failures.push('/data/odds_builder.json compact lane has no enabled policy');
              const allowedStatuses=new Set(['LIVE_VALUE_SET','BELOW_4_TARGET_AVAILABLE','NO_BET','UPSTREAM_RESEARCH_GATE_BLOCKED','VALUE_RESEARCH_SET','RESULTS_FIRST_SET','ACCURACY_FIRST_SET']);
              if (!allowedStatuses.has(b?.status)) failures.push('/data/odds_builder.json status is '+b?.status);
              if (b?.status==='LIVE_VALUE_SET') {
                if (!legs.length) failures.push('/data/odds_builder.json LIVE_VALUE_SET has no qualified paper legs');
                if (!Array.isArray(b?.batches) || !b.batches.length) failures.push('/data/odds_builder.json LIVE_VALUE_SET has no batches');
                if (legs.length<minLegs || legs.length>maxLegs) failures.push('/data/odds_builder.json LIVE_VALUE_SET leg count invalid for lane: '+legs.length);
                if (!(combined>=laneFloor)) failures.push('/data/odds_builder.json LIVE_VALUE_SET combined odds below lane floor '+laneFloor.toFixed(2)+': '+combined);
              } else if (b?.status==='BELOW_4_TARGET_AVAILABLE') {
                if (!Array.isArray(b?.best_available_legs) || !b.best_available_legs.length) failures.push('/data/odds_builder.json BELOW_4_TARGET_AVAILABLE has no best_available_legs');
                if (!(combined>1 && combined<2.7)) failures.push('/data/odds_builder.json BELOW_4_TARGET_AVAILABLE has invalid combined odds: '+combined);
              } else if (b?.status==='VALUE_RESEARCH_SET' || b?.status==='RESULTS_FIRST_SET' || b?.status==='ACCURACY_FIRST_SET') {
                if (legs.length<minLegs || legs.length>maxLegs) failures.push('/data/odds_builder.json '+b?.status+' leg count invalid for lane: '+legs.length);
                if (!(combined>=laneFloor)) failures.push('/data/odds_builder.json '+b?.status+' combined odds below lane floor '+laneFloor.toFixed(2)+': '+combined);
                if (!Array.isArray(b?.batches) || !b.batches.length) failures.push('/data/odds_builder.json qualified status has no batches');
                console.log('Paper Odds Builder qualified state: '+b?.status+'; lane floor '+laneFloor.toFixed(2)+'x; '+(compactLane?'compact eFootball 4–5-leg lane':'standard '+activeFloor.toFixed(2)+'x lane'));
              } else {
                if (legs.length) failures.push('/data/odds_builder.json '+b?.status+' unexpectedly contains qualified legs');
                console.log('Paper Odds Builder production state: '+b?.status+' (no weak/stale ticket was forced)');
              }
              for (const leg of legs) {
                if (leg?.odds_fresh!==true) failures.push('/data/odds_builder.json qualified leg has stale odds');
                if (!leg?.market_source || !String(leg.market_source).includes('SportyBet')) failures.push('/data/odds_builder.json qualified leg is not sourced from SportyBet');
                if (compactLane && (!['efootball_gt','efootball_adriatic'].includes(String(leg?.product||'')) || String(leg?.qualification_lane||'')!=='efootball_exact_evidence_value' || Number(leg?.model_probability||0)<0.65))
                  failures.push('/data/odds_builder.json compact leg fails exact-evidence/65% value-research contract');
              }
              for (const batch of batches) {
                if (String(batch?.primary_lane||'')!=='efootball_compact_2x') continue;
                const batchLegs=Array.isArray(batch?.legs)?batch.legs:[];
                const count=Number(batch?.leg_count||batchLegs.length||0);
                if (count<4 || count>5) failures.push('/data/odds_builder.json compact batch leg count outside 4–5');
                if (Number(batch?.combined_odds||0)<2.0) failures.push('/data/odds_builder.json compact batch below 2.00x');
                if (batchLegs.some(leg=>!['efootball_gt','efootball_adriatic'].includes(String(leg?.product||'')) || String(leg?.qualification_lane||'')!=='efootball_exact_evidence_value' || Number(leg?.model_probability||0)<0.65))
                  failures.push('/data/odds_builder.json compact batch contains an unqualified leg');
              }
            }
          } catch(e) { failures.push('/data/odds_builder.json '+e.message); }

          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('Production HTTP smoke tests passed: '+pages.length+' pages, '+assets.length+' assets, NBA ESPN proxy');
          NODE

      - name: Verify live eFootball quote coverage for Qualified Best
        timeout-minutes: 3
        run: node scripts/test_live_virtual_quote_coverage.mjs

      - name: Record Cloudflare production verification
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cp LIVE-PRODUCTION-CHECK.json /tmp/live-production-check.json 2>/dev/null || true
          cp BOOKING-PRODUCTION-CHECK.json /tmp/booking-production-check.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          live={}
          booking={}
          p=Path('/tmp/live-production-check.json')
          if p.exists():
              live=json.loads(p.read_text())
          b=Path('/tmp/booking-production-check.json')
          if b.exists():
              booking=json.loads(b.read_text())
          coverage_complete = live.get('scan_complete') is True
          booking_status = str(booking.get('status') or 'NOT_RECORDED')
          # A no-future-batch result means the POST path was not exercised; do not
          # count it as a passed booking check or label the full verification VERIFIED.
          booking_verified = booking.get('ok') is True and booking_status in {'PASS', 'VOLATILE_MARKET'}
          checks = ['core_pages','prediction_desk_qualification_gates','research_virtual_lab','live_virtual_proxy','virtual_lab_live_snapshot','live_production_data']
          if booking_verified:
              checks.append('booking_api_post')
          else:
              checks.append('booking_api_post_not_verified')
          checks.append('qualified_best_shortlist' if coverage_complete else 'qualified_best_live_quote_diagnostic_incomplete')
          verification_complete = coverage_complete and booking_verified
          Path('DEPLOY-VERIFY-CLOUDFLARE.json').write_text(json.dumps({
            'status':'VERIFIED' if verification_complete else 'VERIFIED_WITH_DIAGNOSTIC_INCOMPLETE',
            'core_pages_status':'VERIFIED',
            'qualified_best_quote_coverage_status':'COMPLETE' if coverage_complete else 'INCOMPLETE',
            'booking_api_status':'VERIFIED' if booking_verified else booking_status,
            'provider':'Cloudflare Pages',
            'source_commit':os.environ['DEPLOY_SOURCE_COMMIT'],
            'verified_at':datetime.now(timezone.utc).isoformat(),
            'live_virtual_feed':live,
            'booking_api':booking,
            'checks':checks
          },indent=2)+'\n')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add DEPLOY-VERIFY-CLOUDFLARE.json
            git commit -m "✅ Record Cloudflare production verification" || true
            if git push origin main; then
              echo "Production verification recorded on attempt ${attempt}."
              exit 0
            fi
          done
          echo "Could not publish production verification after retries."
          exit 1
