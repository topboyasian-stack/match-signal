name: Deploy Match Signal to Cloudflare Pages

# V5.2 production promotion: deploy the current calibrated tennis totals feed after QA.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'upcoming.html'
      - 'sport-hubs.js'
      - 'sport-hubs.css'
      - 'league.html'
      - 'reports.html'
      - '_redirects'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'darts.html'
      - 'darts-app.js'
      - 'darts.css'
      - 'table-tennis.html'
      - 'table-tennis-app.js'
      - 'table-tennis.css'
      - 'live.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'metrics-fix.js'
      - 'functions/**'
      - 'expansion.js'
      - 'expansion-tennis-ou.js'
      - 'expansion-odds-builder.js'
      - 'live-model-trace.js'
      - 'virtual-lab.html'
      - 'research.html'
      - 'virtual-lab-app.js'
      - 'virtual-lab-confirmed-watch.js'
      - 'virtual-lab.css'
      - 'virtual-lab/**'
      - 'data/odds_ticket_tracker.json'
      - 'data/virtual_lab_history.json'
      - 'data/virtual_lab_live.json'
      - 'data/virtual_lab_model_eval.json'
      - 'data/virtual_lab_eligibility.json'
      - 'data/virtual_lab_participant_profiles.json'
      - 'data/virtual_lab_confirmed_participants.json'
      - 'data/virtual_lab_confirmed_participant_results.json'
      - 'data/virtual_lab_participants/**'
      - 'data/darts_*.json'
      - 'data/table_tennis_*.json'
      - 'data/predictions.json'
      - 'data/prediction_history.json'
      - 'data/prediction_pool.json'
      - 'data/selection_candidates.json'
      - 'data/selection_gate.json'
      - 'data/accuracy.json'
      - 'data/football_performance.json'
      - 'data/football_forward_readiness.json'
      - 'data/pdl_predictions.json'
      - 'data/pdl_status.json'
      - 'data/pipeline_status.json'
      - 'PRECISION-SPORTS-UPGRADE.md'
      - '_redirects'
      - 'VIRTUAL-LAB-*.md'
      - 'functions/api/virtual-lab-history.js'
      - 'functions/api/sportybet-virtual-results.js'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Match Signal Virtual Lab Collector"
      - "Match Signal Live Prediction Pipeline"
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Odds Builder"
      - "Match Signal Odds Ticket Tracker"
      - "Match Signal Live Expansion"
      - "Match Signal Darts-X Research Engine"
      - "Match Signal Table Tennis-X Research Engine"
    types: [completed]

permissions:
  contents: write
  deployments: write

concurrency:
  group: cloudflare-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture deployment source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production artifact
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s darts.html
          test -s table-tennis.html
          test -s performance.html
          test -s live.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s data/predictions.json
          test -s virtual-lab-app.js
          test -s virtual-lab-confirmed-watch.js
          test -s data/virtual_lab_participant_lifecycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          assert any(r.get('sport')=='football' for r in rows), 'no football rows'
          tennis_rows=[r for r in rows if r.get('sport')=='tennis']
          risk=json.loads(Path('data/risk_gate.json').read_text()) if Path('data/risk_gate.json').exists() else {}
          tennis_gate=(risk.get('gate') or {}).get('tennis') or {}
          if not tennis_rows and tennis_gate.get('live_eligible') is True:
              raise AssertionError('no tennis rows while tennis live gate is eligible')
          if not tennis_rows:
              print('Tennis rows absent while tennis live gate is blocked; core deployment may proceed for independent Virtual research lanes.')
          print(f'Prediction rows: {len(rows)}; tennis rows: {len(tennis_rows)}')
          PY
          python scripts/validate_virtual_lab_v1.py
          node --check virtual-lab-app.js
          node --check virtual-lab-confirmed-watch.js
          node --check expansion-odds-builder.js
          node --check functions/api/sportybet-booking.js
          node --check functions/api/sportybet-virtual.js
          node --check darts-app.js
          node --check table-tennis-app.js
          python -m py_compile scripts/darts_pipeline.py scripts/table_tennis_pipeline.py

      - name: Resolve Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured"
            exit 1
          fi
          PROJECT=$(curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
            python -c 'import json,sys; d=json.load(sys.stdin); names=[p["name"] for p in d.get("result",[])]; print(next((n for n in names if n=="match-signal"), "")); print("Available Pages projects:", ", ".join(names), file=sys.stderr)')
          if [ -z "$PROJECT" ]; then
            echo "Cloudflare Pages project 'match-signal' was not found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          npx wrangler@latest pages deploy . --project-name="$PROJECT"

      - name: Run production HTTP and asset smoke tests
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const base = 'https://match-signal.pages.dev';
          const pages = ['/', '/upcoming.html', '/football.html', '/tennis.html', '/basketball.html', '/darts.html', '/table-tennis.html', '/league.html?sport=football&league=England%20Amateur%20-%20U21%20Professional%20Development%20League', '/reports.html', '/live.html', '/expansion.html', '/virtual-lab/', '/virtual-lab', '/research.html', '/virtual-lab.html'];
          const assets = ['/api/sportybet-virtual','/api/sportybet-darts','/api/sportybet-table-tennis','/expansion.js', '/expansion-odds-builder.js', '/live-analysis.js', '/live-data-worker.js', '/virtual-lab-app.js', '/virtual-lab-confirmed-watch.js', '/virtual-lab.css', '/_redirects', '/data/predictions.json', '/data/expansion_status.json', '/data/odds_builder.json', '/data/odds_ticket_tracker.json', '/data/virtual_lab_live.json','/data/virtual_lab_model_eval.json','/data/virtual_lab_eligibility.json','/data/virtual_lab_participants/registry.json','/data/virtual_lab_participant_lifecycle.json','/data/virtual_lab_participants/efootball_confirmed_watch.json'];
          const failures = [];
          async function get(path) {
            const r = await fetch(base + path + (path.includes('?') ? '&' : '?') + 'smoke=' + Date.now(), {cache:'no-store'});
            const body = await r.text();
            return {r,body};
          }
          // Canonical route assertions: root is the only public desk entrypoint.
          for (const legacyPath of ['/index.html','/index-tight','/index-tight.html']) {
            try {
              const rr=await fetch(base+legacyPath,{redirect:'manual',cache:'no-store'});
              const location=rr.headers.get('location')||'';
              if (rr.status!==301 || !location.endsWith('/')) failures.push(legacyPath+' did not canonicalize to /');
            } catch(e) { failures.push(legacyPath+' '+e.message); }
          }

          for (const path of pages) {
            try {
              const {r,body}=await get(path);
              if ((path==='/' || path==='/index.html') && (body.includes('index-tight') || body.includes('nav-fix.js') || body.includes('⌂ Home'))) failures.push(path+' contains retired root/navigation behavior');
              if (path==='/live.html' && (body.includes('nav-fix.js') || body.includes('?sport=football'))) failures.push(path+' contains retired navigation behavior');
              if (!r.ok) failures.push(path+' HTTP '+r.status);
              if (!body.includes('<html') && path.endsWith('.html')) failures.push(path+' did not return HTML');
              if (path==='/expansion.html') {
                if (!body.includes('/reports.html')) failures.push(path+' missing retired-route redirect');
              }
              if (path==='/upcoming.html') { for (const marker of ['Paper Odds Builder','expansion-odds-builder.js','oddsBuilder']) if (!body.includes(marker)) failures.push(path+' missing '+marker); }
              if (path==='/football.html' || path==='/tennis.html' || path==='/basketball.html' || path==='/reports.html') {
                for (const marker of ['sport-hubs.js','sport-hubs.css']) if (!body.includes(marker)) failures.push(path+' missing unified sport-hub assets');
              }
              if (path==='/league.html?sport=football&league=England%20Amateur%20-%20U21%20Professional%20Development%20League') {
                if (!body.includes('sport-hubs.js')) failures.push(path+' missing league renderer');
              }
              if (path==='/live.html') {
                for (const marker of ['id="statusText"','id="grid"','live-analysis.js','live-data-worker.js'])
                  if (!body.includes(marker)) failures.push(path+' missing '+marker);
              }
              if (path==='/virtual-lab/' || path==='/virtual-lab') {
                for (const marker of ['Virtual Lab','virtual-lab-app.js','predictionDesk','oddsBuilder','How to use the Lab / what to select','Research conclusion','/virtual-lab/'])
                  if (!body.includes(marker)) failures.push(path+' missing '+marker);
              }
              if (path==='/research.html' || path==='/virtual-lab.html') {
                if (!body.includes('/virtual-lab/')) failures.push(path+' missing standalone redirect');
                if (body.includes('virtual-lab.js?v=')) failures.push(path+' still contains retired renderer reference');
              }
            } catch(e) { failures.push(path+' '+e.message); }
          }
          for (const path of assets) {
            try {
              const {r,body}=await get(path);
              if (!r.ok) failures.push(path+' HTTP '+r.status);
              if (!body.trim()) failures.push(path+' empty response');
              if (path.endsWith('.json')) JSON.parse(body);
            } catch(e) { failures.push(path+' '+e.message); }
          }
          for (const path of ['/data/darts_model.json','/data/darts_status.json','/data/darts_upcoming.json','/data/darts_candidates.json','/data/table_tennis_model.json','/data/table_tennis_status.json','/data/table_tennis_upcoming.json','/data/table_tennis_candidates.json']) {
            try {
              const {r,body}=await get(path);
              if (!r.ok) failures.push(path+' HTTP '+r.status);
              if (path.endsWith('.json')) JSON.parse(body);
            } catch(e) { failures.push(path+' '+e.message); }
          }
                    try {
            const {r,body}=await get('/data/virtual_lab_participant_lifecycle.json');
            if (!r.ok) failures.push('/data/virtual_lab_participant_lifecycle.json HTTP '+r.status);
            else {
              const p=JSON.parse(body);
              if (p.discovery_mode!=='feed_driven') failures.push('/data/virtual_lab_participant_lifecycle.json discovery_mode is not feed_driven');
              if (!Number(p.participant_count)) failures.push('/data/virtual_lab_participant_lifecycle.json has no participants');
              else if (Number(p.active_count||0)+Number(p.live_count||0)+Number(p.upcoming_count||0) < 1) failures.push('/data/virtual_lab_participant_lifecycle.json has no active/live/upcoming participants');
              else console.log('Virtual Lab participant lifecycle passed: '+p.participant_count+' participants / '+(Number(p.active_count||0)+Number(p.live_count||0)+Number(p.upcoming_count||0))+' active');
            }
          } catch(e) { failures.push('/data/virtual_lab_participant_lifecycle.json '+e.message); }

          try {
            const {r,body}=await get('/data/virtual_lab_model_eval.json');
            if (!r.ok) failures.push('/data/virtual_lab_model_eval.json HTTP '+r.status);
            else {
              const m=JSON.parse(body);
              if (!m.holdout || !m.participant_feature_gate) failures.push('/data/virtual_lab_model_eval.json missing holdout/gate');
              else console.log('Virtual Lab model artifact passed: holdout '+(m.holdout.rows||0)+' rows; participant gate '+(m.participant_feature_gate.pass?'PASS':'WAIT'));
            }
          } catch(e) { failures.push('/data/virtual_lab_model_eval.json '+e.message); }

          try {
            const {r,body}=await get('/data/virtual_lab_eligibility.json');
            if (!r.ok) failures.push('/data/virtual_lab_eligibility.json HTTP '+r.status);
            else {
              const e=JSON.parse(body);
              if (!Array.isArray(e.eligible_ou_lines)) failures.push('/data/virtual_lab_eligibility.json missing eligible_ou_lines');
              else console.log('Virtual Lab eligibility artifact passed: active lines '+JSON.stringify(e.eligible_ou_lines));
            }
          } catch(e) { failures.push('/data/virtual_lab_eligibility.json '+e.message); }

          try {
            const {r,body}=await get('/api/espn?path='+encodeURIComponent('/apis/site/v2/sports/basketball/nba/scoreboard'));
            if (!r.ok) failures.push('/api/espn NBA HTTP '+r.status);
            else if (!Array.isArray(JSON.parse(body).events)) failures.push('/api/espn NBA returned invalid JSON');
          } catch(e) { failures.push('/api/espn '+e.message); }
          for (const source of ['efootball','vfootball']) {
            try {
              const p = new URLSearchParams({
                source,
                pageSize:'5',
                pageNum:'1',
                startTime:String(Date.now()-86400000),
                endTime:String(Date.now())
              });
              const {r,body}=await get('/api/sportybet-virtual-results?'+p.toString());
              if (!r.ok) failures.push('/api/sportybet-virtual-results '+source+' HTTP '+r.status);
              const payload=JSON.parse(body);
              if (payload?.ok!==true) failures.push('/api/sportybet-virtual-results '+source+' returned ok!=true');
              else console.log('Virtual Lab result proxy passed: '+source+' '+(payload.events?.length||0)+' events '+(payload.scopes?.length||0)+' scopes');
            } catch(e) { failures.push('/api/sportybet-virtual-results '+source+' '+e.message); }
          }

          try {
            const r = await fetch(base + '/api/sportybet-booking', {
              method: 'OPTIONS',
              headers: { 'Origin': base, 'Access-Control-Request-Method': 'POST' },
              cache: 'no-store'
            });
            if (r.status !== 204) failures.push('/api/sportybet-booking OPTIONS HTTP '+r.status);
            else console.log('SportyBet booking-code API route passed OPTIONS smoke test');
          } catch(e) { failures.push('/api/sportybet-booking OPTIONS '+e.message); }

          try {
            const dataResp = await fetch(base + '/data/odds_builder.json?bookingSmoke=' + Date.now(), {cache:'no-store'});
            if (!dataResp.ok) throw new Error('odds_builder.json HTTP '+dataResp.status);
            const data = await dataResp.json();
            const now = Date.now();
            const candidates = (Array.isArray(data?.batches)?data.batches:[])
              .filter(b => Array.isArray(b?.legs) && b.legs.length > 0 && b.legs.length <= 20)
              .filter(b => b.legs.every(l => {
                const t = Date.parse(l?.start_time || '');
                return Number.isFinite(t) && t > now + 120000;
              }));
            let smoke = {
              verified_at: new Date().toISOString(),
              status: 'NOT_RUN',
              http_status: null,
              ok: false,
              batch_id: null,
              selection_count: 0,
              booking_code_available: false,
              error: null,
              message: null
            };
            if (!candidates.length) {
              smoke.status = 'NO_FUTURE_BATCH';
              console.log('SportyBet booking POST smoke test skipped: no fully future batch in production artifact');
            } else {
              let last = null;
              for (const batch of candidates.slice(0,3)) {
                const rr = await fetch(base + '/api/sportybet-booking', {
                  method: 'POST',
                  headers: {'Content-Type':'application/json','Accept':'application/json'},
                  body: JSON.stringify({batch_id: String(batch.batch_id)}),
                  cache: 'no-store'
                });
                const raw = await rr.text();
                let payload = null;
                try { payload = raw ? JSON.parse(raw) : null; } catch {}
                last = {rr,raw,payload,batch};
                if (payload && rr.ok && payload.ok === true && payload.booking_code) break;
              }
              const rr = last.rr, raw = last.raw, payload = last.payload, batch = last.batch;
              smoke.status = payload?.ok === true ? 'PASS' : 'FAIL';
              smoke.http_status = rr.status;
              smoke.ok = Boolean(rr.ok && payload?.ok === true);
              smoke.batch_id = String(batch.batch_id || '');
              smoke.selection_count = Number(payload?.selection_count || batch.legs?.length || 0);
              smoke.booking_code_available = Boolean(payload?.booking_code);
              smoke.error = payload?.error || null;
              smoke.message = payload?.message || (!payload ? 'Non-JSON response' : null);
              if (!payload) smoke.raw_prefix = String(raw||'').replace(/\s+/g,' ').slice(0,240);
              if (payload?.validation) smoke.validation = payload.validation.slice(0,5);
              if (!smoke.ok) {
                 console.error('SportyBet booking validation diagnostics:', JSON.stringify(payload?.validation||[], null, 2));
                 console.error('SportyBet booking smoke payload:', JSON.stringify(payload||{raw_prefix:smoke.raw_prefix||null}, null, 2));
                 failures.push('/api/sportybet-booking POST smoke failed: HTTP '+rr.status+' '+(smoke.error||smoke.message||'unknown'));
               } else console.log('SportyBet booking POST smoke passed: '+smoke.selection_count+' selections; booking code returned');
            }
            writeFileSync('BOOKING-PRODUCTION-CHECK.json', JSON.stringify(smoke,null,2)+'\n');
          } catch(e) {
            const smoke={verified_at:new Date().toISOString(),status:'ERROR',http_status:null,ok:false,batch_id:null,selection_count:0,booking_code_available:false,error:String(e.message||e)};
            writeFileSync('BOOKING-PRODUCTION-CHECK.json', JSON.stringify(smoke,null,2)+'\n');
            failures.push('/api/sportybet-booking POST smoke '+String(e.message||e));
          }

          try {
            const params = new URLSearchParams({
              pageSize:'100',
              pageNum:'1',
              timeline:'168',
              sources:'efootball,vfootball',
              _t:String(Date.now())
            });
            const {r,body}=await get('/api/sportybet-virtual?'+params.toString());
            if (!r.ok) failures.push('/api/sportybet-virtual HTTP '+r.status);
            const payload=JSON.parse(body);
            const virtualEvents=Array.isArray(payload?.events)?payload.events:[];
            if (payload?.ok!==true) failures.push('/api/sportybet-virtual did not return ok=true');
            for (const [name,status] of Object.entries(payload?.source_status||{})) { if (status?.status==='ERROR') failures.push('/api/sportybet-virtual source '+name+' returned ERROR: '+(status.error||'unknown')); }
            if (virtualEvents.length && !virtualEvents.every(e => Object.prototype.hasOwnProperty.call(e,'score'))) failures.push('/api/sportybet-virtual normalized events are missing score field');
            if (!virtualEvents.length) failures.push('/api/sportybet-virtual returned no eFootball/virtual events');
            const cutoff = Date.now() - 120000;
            const stale = virtualEvents.filter(e => e.start_time_ms && Number(e.start_time_ms) < cutoff);
            if (stale.length) failures.push('/api/sportybet-virtual returned '+stale.length+' stale fixtures');
            if (!payload.upcoming_events_count && virtualEvents.length) failures.push('/api/sportybet-virtual missing upcoming_events_count');
            else {
              console.log('Virtual Lab live source passed: '+virtualEvents.length+' events '+JSON.stringify(payload.product_counts||{}));
              if (!payload.updated_at) failures.push('/api/sportybet-virtual missing updated_at');
              writeFileSync('LIVE-PRODUCTION-CHECK.json', JSON.stringify({
                endpoint:'/api/sportybet-virtual',
                verified_at:new Date().toISOString(),
                status:payload.status,
                events_count:virtualEvents.length,
                product_counts:payload.product_counts||{},
                source_status:payload.source_status||{},
                errors:payload.errors||[]
              },null,2)+'\n');
            }
          } catch(e) { failures.push('/api/sportybet-virtual '+e.message); }

          try {
            const {r,body}=await get('/data/odds_ticket_tracker.json');
            if (!r.ok) failures.push('/data/odds_ticket_tracker.json HTTP '+r.status);
            else {
              const t=JSON.parse(body);
              if (t?.mode!=='PAPER_ONLY') failures.push('/data/odds_ticket_tracker.json is not PAPER_ONLY');
              if (Number(t?.version||0)<2) failures.push('/data/odds_ticket_tracker.json tracker version is not current');
              if (!Array.isArray(t?.tickets)) failures.push('/data/odds_ticket_tracker.json tickets is not an array');
              for (const ticket of t.tickets||[]) {
                if (!ticket.ticket_id) failures.push('/data/odds_ticket_tracker.json ticket missing ticket_id');
                if (!ticket.snapshot_fingerprint) failures.push('/data/odds_ticket_tracker.json ticket missing snapshot_fingerprint');
                if (!Array.isArray(ticket.legs)) failures.push('/data/odds_ticket_tracker.json ticket legs missing');
              }
              console.log('Paper ticket tracker production artifact passed: '+(t.tickets?.length||0)+' tracked tickets');
            }
          } catch(e) { failures.push('/data/odds_ticket_tracker.json '+e.message); }

          try {
            const {r,body}=await get('/data/odds_builder.json');
            if (!r.ok) failures.push('/data/odds_builder.json HTTP '+r.status);
            else {
              const b=JSON.parse(body);
              const legs=Array.isArray(b?.qualified_legs)?b.qualified_legs:[];
              const combined=Number(b?.market_price_combined_odds||0);
              if (b?.mode!=='PAPER_ONLY') failures.push('/data/odds_builder.json is not PAPER_ONLY');
              const allowedStatuses=new Set(['LIVE_VALUE_SET','BELOW_4_TARGET_AVAILABLE','NO_BET','UPSTREAM_RESEARCH_GATE_BLOCKED']);
              if (!allowedStatuses.has(b?.status)) failures.push('/data/odds_builder.json status is '+b?.status);
              if (b?.status==='LIVE_VALUE_SET') {
                if (!legs.length) failures.push('/data/odds_builder.json LIVE_VALUE_SET has no qualified paper legs');
                if (!Array.isArray(b?.batches) || !b.batches.length) failures.push('/data/odds_builder.json LIVE_VALUE_SET has no batches');
                if (!(combined>=4)) failures.push('/data/odds_builder.json LIVE_VALUE_SET combined odds below 4.00: '+combined);
              } else if (b?.status==='BELOW_4_TARGET_AVAILABLE') {
                if (!Array.isArray(b?.best_available_legs) || !b.best_available_legs.length) failures.push('/data/odds_builder.json BELOW_4_TARGET_AVAILABLE has no best_available_legs');
                if (!(combined>1 && combined<4)) failures.push('/data/odds_builder.json BELOW_4_TARGET_AVAILABLE has invalid combined odds: '+combined);
              } else {
                if (legs.length) failures.push('/data/odds_builder.json '+b?.status+' unexpectedly contains qualified legs');
                console.log('Paper Odds Builder production state: '+b?.status+' (no weak/stale ticket was forced)');
              }
              for (const leg of legs) {
                if (leg?.odds_fresh!==true) failures.push('/data/odds_builder.json qualified leg has stale odds');
                if (!leg?.market_source || !String(leg.market_source).includes('SportyBet')) failures.push('/data/odds_builder.json qualified leg is not sourced from SportyBet');
              }
            }
          } catch(e) { failures.push('/data/odds_builder.json '+e.message); }

          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('Production HTTP smoke tests passed: '+pages.length+' pages, '+assets.length+' assets, NBA ESPN proxy');
          NODE

      - name: Record Cloudflare production verification
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp LIVE-PRODUCTION-CHECK.json /tmp/live-production-check.json 2>/dev/null || true
          cp BOOKING-PRODUCTION-CHECK.json /tmp/booking-production-check.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          live={}
          booking={}
          p=Path('/tmp/live-production-check.json')
          if p.exists():
              live=json.loads(p.read_text())
          b=Path('/tmp/booking-production-check.json')
          if b.exists():
              booking=json.loads(b.read_text())
          Path('DEPLOY-VERIFY-CLOUDFLARE.json').write_text(json.dumps({
            'status':'VERIFIED',
            'provider':'Cloudflare Pages',
            'source_commit':os.environ['DEPLOY_SOURCE_COMMIT'],
            'verified_at':datetime.now(timezone.utc).isoformat(),
            'live_virtual_feed':live,
            'booking_api':booking,
            'checks':['core_pages','research_virtual_lab','live_virtual_proxy','virtual_lab_live_snapshot','live_production_data','booking_api_post']
          },indent=2)+'\n')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add DEPLOY-VERIFY-CLOUDFLARE.json
            git commit -m "✅ Record Cloudflare production verification" || true
            if git push origin main; then
              echo "Production verification recorded on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish production verification after retries."
          exit 1
