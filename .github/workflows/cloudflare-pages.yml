name: Deploy Match Signal to Cloudflare Pages

# V5.2 production promotion: deploy the current calibrated tennis totals feed after QA.

on:
  workflow_run:
    workflows:
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Persistent Club Logo Registry"
    types: [completed]
  # Static presentation and scoped booking-API changes may deploy directly. Builder outputs, Builder engines, and this workflow itself must wait for the Unified Upcoming refresh and its subsequent Pages deployment.
  push:
    branches: [main]
    paths:
      - '_headers'
      - 'index.html'
      - 'upcoming.html'
      - 'qualified-best.html'
      - 'qualified-best-design.css'
      - 'scripts/test_qualified_best_design.mjs'
      - 'sport-hubs-design.css'
      - 'scripts/test_sport_hub_design.mjs'
      - 'independent-sport-design.css'
      - 'scripts/test_independent_sports_design.mjs'
      - 'darts.html'
      - 'table-tennis.html'
      - 'odds-builder.html'
      - 'expansion-odds-builder.js'
      - 'scripts/test_odds_builder_ui_freshness.mjs'
      - 'scripts/test_desk_quote_contract.mjs'
      - 'functions/api/sportybet-booking.js'
      - 'functions/api/odds-builder-data.js'
      - 'functions/api/sportybet-virtual-results.js'
      - 'scripts/test_sportybet_booking_batch_ids.mjs'
      - 'odds-builder-design.css'
      - 'reports.html'
      - 'reports-design.css'
      - 'virtual-lab/index.html'
      - 'virtual-lab-terminal.css'
      - 'scripts/test_workspace_terminal_design.mjs'
      - 'football.html'
      - 'tennis.html'
      - 'basketball.html'
      - 'sport-hubs.css'
      - 'sport-hubs.js'
      - 'ms-design-system.css'
      - 'core-workspaces-design.css'
      - 'scripts/test_core_workspaces_design.mjs'
      - 'league-logos.js'
      - 'scripts/test_league_logos.mjs'
      - 'workspace-ui.js'
      - 'data/club-logo-registry.json'
      - 'assets/club-logos/**'
      - 'data/licenses/**'
      - 'scripts/sync_club_logos.py'
      - 'scripts/test_club_logo_registry.py'
      - '.github/workflows/qualified-best-health-watch-v2.yml'
      - '.github/workflows/automation_watchdog.yml'
      - '.github/workflows/efootball-market-research-schedule.yml'
      - '.github/workflows/efootball-market-research-tests.yml'
      - 'scripts/test_automation_watchdog_research_recovery.py'
      - 'scripts/test_qualified_best_monitor.mjs'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

# Production promotion guard: always deploy the latest main artifact set.
# Serialization lives on the eligible deploy job below, after its event condition,
# so an irrelevant workflow_run that will be skipped cannot replace a pending deploy.
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: cloudflare-pages-v3
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Guard cache-only direct promotion
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$BEFORE_SHA" && test -n "$PUSH_SHA"
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${PUSH_SHA}" --jq '.files[].filename')"
          test -n "$changed" || { echo "Direct promotion has no inspectable changed-file list." >&2; exit 1; }
          printf 'Direct promotion changed files:\n%s\n' "$changed"
          allowed='|_headers|index.html|upcoming.html|qualified-best.html|qualified-best-design.css|scripts/test_qualified_best_design.mjs|functions/api/sportybet-booking.js|functions/api/odds-builder-data.js|functions/api/sportybet-virtual-results.js|scripts/test_sportybet_booking_batch_ids.mjs|expansion-odds-builder.js|scripts/test_odds_builder_ui_freshness.mjs|scripts/test_desk_quote_contract.mjs|sport-hubs-design.css|scripts/test_sport_hub_design.mjs|independent-sport-design.css|scripts/test_independent_sports_design.mjs|darts.html|table-tennis.html|odds-builder.html|odds-builder-design.css|reports.html|reports-design.css|virtual-lab/index.html|virtual-lab-terminal.css|scripts/test_workspace_terminal_design.mjs|football.html|tennis.html|basketball.html|sport-hubs.css|sport-hubs.js|ms-design-system.css|core-workspaces-design.css|scripts/test_core_workspaces_design.mjs|league-logos.js|scripts/test_league_logos.mjs|workspace-ui.js|data/club-logo-registry.json|scripts/sync_club_logos.py|scripts/test_club_logo_registry.py|scripts/qualified_best_monitor.mjs|scripts/test_qualified_best_monitor.mjs|.github/workflows/qualified-best-live-monitor.yml|.github/workflows/qualified-best-watch.yml|.github/workflows/qualified-best-production-watch.yml|.github/workflows/qualified-best-health-watch-v2.yml|.github/workflows/automation_watchdog.yml|.github/workflows/efootball-market-research-schedule.yml|.github/workflows/efootball-market-research-tests.yml|scripts/test_automation_watchdog_research_recovery.py|scripts/test_qualified_best_monitor.mjs|.github/workflows/unified-upcoming.yml|scripts/test_workflow_trigger_boundaries.py|scripts/test_deploy_freshness_order.py|scripts/test_prediction_desk_gates.mjs|scripts/test_upcoming_desk_policy.py|docs/PREDICTION_DESK_POLICY.md|scripts/ensure_odds_builder_refresh.py|scripts/test_ensure_odds_builder_refresh.py|scripts/test_cloudflare_only_deploy.mjs|'
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              assets/club-logos/*|data/licenses/*) ;;
              *)
                case "$allowed" in
                  *"|$path|"*) ;;
                  *) echo "Direct static promotion rejected; unrelated path changed: $path" >&2; exit 1 ;;
                esac
                ;;
            esac
          done <<< "$changed"

      - name: Capture deployment source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production artifact
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s darts.html
          test -s table-tennis.html
          test -s performance.html
          test -s live.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s football.html
          test -s ms-design-system.css
          test -s core-workspaces-design.css
          test -s scripts/test_core_workspaces_design.mjs
          test -s qualified-best-design.css
          test -s sport-hubs-design.css
          test -s independent-sport-design.css
          test -s odds-builder.html
          test -s odds-builder-design.css
          test -s reports.html
          test -s reports-design.css
          test -s virtual-lab/index.html
          test -s virtual-lab-terminal.css
          test -s scripts/test_workspace_terminal_design.mjs
          test -s darts.html
          test -s table-tennis.html
          test -s league-logos.js
          test -s workspace-ui.js
          test -s data/club-logo-registry.json
          test -d assets/club-logos
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('data/club-logo-registry.json').read_text())
          teams=registry.get('teams') or {}
          assert teams, 'club-logo registry has no registered teams'
          paths={entry.get('path') for entry in teams.values() if isinstance(entry,dict)}
          assert None not in paths, 'club-logo registry entry has no path'
          for url_path in paths:
              assert url_path.startswith('/assets/club-logos/'), f'unexpected logo asset path: {url_path}'
              asset=Path(url_path.lstrip('/'))
              assert asset.is_file() and asset.stat().st_size>0, f'missing or empty registered logo asset: {url_path}'
          print(f'Club-logo registry validated: {len(teams)} names, {len(paths)} permanent assets')
          PY
          test -s data/predictions.json
          test -s workspace-ui.css
          test -s workspace-ui.js
          test -s virtual-lab-app.js
          test -s virtual-lab-confirmed-watch.js
          test -s data/virtual_lab_participant_lifecycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          assert any(r.get('sport')=='football' for r in rows), 'no football rows'
          tennis_rows=[r for r in rows if r.get('sport')=='tennis']
          risk=json.loads(Path('data/risk_gate.json').read_text()) if Path('data/risk_gate.json').exists() else {}
          tennis_gate=(risk.get('gate') or {}).get('tennis') or {}
          if not tennis_rows and tennis_gate.get('live_eligible') is True:
              raise AssertionError('no tennis rows while tennis live gate is eligible')
          if not tennis_rows:
              print('Tennis rows absent while tennis live gate is blocked; core deployment may proceed for independent Virtual research lanes.')
          print(f'Prediction rows: {len(rows)}; tennis rows: {len(tennis_rows)}')
          PY
          python scripts/validate_virtual_lab_v1.py
          node --check workspace-ui.js
          node --check virtual-lab-app.js
          node --check virtual-lab-confirmed-watch.js
          node --check sport-hubs.js
          node --check league-logos.js
          node scripts/test_league_logos.mjs
          node --check expansion-odds-builder.js
          node scripts/test_odds_builder_ui_freshness.mjs
          node --check functions/api/sportybet-booking.js
          node --check functions/api/sportybet-virtual-results.js
          node scripts/test_sportybet_booking_batch_ids.mjs
          node --check functions/api/sportybet-virtual.js
          node scripts/test_sportybet_virtual_upcoming_mode.mjs
          node --check darts-app.js
          node --check table-tennis-app.js
          python -m py_compile scripts/darts_pipeline.py scripts/table_tennis_pipeline.py

      - name: Resolve Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured"
            exit 1
          fi
          PROJECT=$(curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
            python -c 'import json,sys; d=json.load(sys.stdin); names=[p["name"] for p in d.get("result",[])]; print(next((n for n in names if n=="match-signal"), "")); print("Available Pages projects:", ", ".join(names), file=sys.stderr)')
          if [ -z "$PROJECT" ]; then
            echo "Cloudflare Pages project 'match-signal' was not found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          # A disconnected Git integration can leave the configured production
          # branch different from the repository's current default branch. Read
          # Pages' authoritative setting instead of assuming it is always main.
          PROJECT_INFO=$(curl -fsSL \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          PRODUCTION_BRANCH=$(printf '%s' "$PROJECT_INFO" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("production_branch") or "")')
          if [ -z "$PRODUCTION_BRANCH" ]; then
            echo "Cloudflare Pages did not report a configured production branch."
            exit 1
          fi
          echo "production_branch=$PRODUCTION_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Configured Cloudflare Pages production branch: $PRODUCTION_BRANCH"

      - name: Install Pages Function dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Cloudflare Pages deployment directory
        id: prepare-pages
        env:
          MAX_PAGES_FILE_BYTES: "26214400"
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf .pages-deploy
          mkdir -p .pages-deploy
          rsync -a             --exclude='.git/'             --exclude='.pages-deploy/'             --exclude='node_modules/'             --exclude='data/virtual_lab_history.json'             --exclude='data/efootball_desk_prediction_history.json'             --exclude='data/efootball_desk_settled_observations.json'             ./ .pages-deploy/
          build_tag="$(date -u +%Y%m%d)-${SOURCE_SHA:0:12}"
          build_id="MS-UNIFIED-${build_tag}"
          BUILD_ID="$build_id" BUILD_TAG="$build_tag" python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path('.pages-deploy/index.html')
          html=p.read_text(encoding='utf-8')
          html, meta_count = re.subn(
              r'(<meta\s+name="match-signal-build"\s+content=")[^"]*(">)',
              lambda m: m.group(1)+os.environ['BUILD_ID']+m.group(2),
              html, count=1
          )
          html, css_count = re.subn(
              r'(\./ms-design-system\.css\?v=)[^"&]+',
              lambda m: m.group(1)+os.environ['BUILD_TAG'],
              html, count=1
          )
          if meta_count != 1:
              raise SystemExit('Expected exactly one match-signal-build meta marker in deployed index.html')
          if css_count != 1:
              raise SystemExit('Expected exactly one versioned ms-design-system.css href in deployed index.html')
          p.write_text(html, encoding='utf-8')
          print('Prepared deployment build ID:', os.environ['BUILD_ID'])
          print('Prepared root CSS version:', os.environ['BUILD_TAG'])
          PY
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          gzip -c data/virtual_lab_history.json > .pages-deploy/data/virtual_lab_history.json.gz
          original_bytes=$(stat -c%s data/virtual_lab_history.json)
          compressed_bytes=$(stat -c%s .pages-deploy/data/virtual_lab_history.json.gz)
          echo "Canonical Virtual Lab history: $original_bytes bytes"
          echo "Compressed Pages history asset: $compressed_bytes bytes"
          test "$original_bytes" -gt "$MAX_PAGES_FILE_BYTES"
          test "$compressed_bytes" -lt "$MAX_PAGES_FILE_BYTES"
          test -s .pages-deploy/data/virtual_lab_history.json.gz
          test ! -e .pages-deploy/data/virtual_lab_history.json

          # Preserve the canonical eFootball desk trace in Git, but avoid
          # uploading its >25 MiB uncompressed form to Pages. No current page
          # consumes this raw trace; the live desk reads the compact learning
          # summary. Publish a compressed archival download instead.
          gzip -c data/efootball_desk_prediction_history.json > .pages-deploy/data/efootball_desk_prediction_history.json.gz
          desk_original_bytes=$(stat -c%s data/efootball_desk_prediction_history.json)
          desk_compressed_bytes=$(stat -c%s .pages-deploy/data/efootball_desk_prediction_history.json.gz)
          echo "Canonical eFootball desk trace (kept in Git): $desk_original_bytes bytes"
          echo "Compressed eFootball desk archive: $desk_compressed_bytes bytes"
          test "$desk_original_bytes" -gt "$MAX_PAGES_FILE_BYTES"
          test "$desk_compressed_bytes" -lt "$MAX_PAGES_FILE_BYTES"
          test -s .pages-deploy/data/efootball_desk_prediction_history.json.gz
          test ! -e .pages-deploy/data/efootball_desk_prediction_history.json

          # The settled desk ledger is a durable learning archive, but only its
          # compressed form is published to Pages to keep individual assets small.
          gzip -c data/efootball_desk_settled_observations.json > .pages-deploy/data/efootball_desk_settled_observations.json.gz
          ledger_compressed_bytes=$(stat -c%s .pages-deploy/data/efootball_desk_settled_observations.json.gz)
          echo "Compressed settled desk observations archive: $ledger_compressed_bytes bytes"
          test "$ledger_compressed_bytes" -lt "$MAX_PAGES_FILE_BYTES"
          test -s .pages-deploy/data/efootball_desk_settled_observations.json.gz
          test ! -e .pages-deploy/data/efootball_desk_settled_observations.json
          echo "Cloudflare Pages staging passed the 25 MiB single-file limit."

      - name: Regression-test Prediction Desk qualification and best-line selection
        run: |
          node scripts/test_prediction_desk_gates.mjs
          node scripts/test_qualified_best_design.mjs
          node scripts/test_sport_hub_design.mjs
          node scripts/test_core_workspaces_design.mjs
          node scripts/test_independent_sports_design.mjs
          node --check scripts/test_workspace_terminal_design.mjs
          node scripts/test_workspace_terminal_design.mjs

      - name: Deploy to Cloudflare Pages
        id: pages-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          set -euo pipefail
          output="$(npx wrangler@latest pages deploy .pages-deploy --project-name="$PROJECT" --branch="${{ steps.project.outputs.production_branch }}" --commit-hash="${{ steps.source.outputs.sha }}" 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          deployment_line="$(printf '%s\n' "$output" | grep 'Deployment complete!' | tail -n 1 || true)"
          deployment_url="${deployment_line##*over at }"
          deployment_url="${deployment_url%%[[:space:]]*}"
          case "$deployment_url" in
            https://*.pages.dev) ;;
            *) echo "Could not resolve immutable Cloudflare Pages deployment URL from Wrangler output." >&2; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Immutable Cloudflare deployment URL: $deployment_url"

      - name: Run production HTTP and asset smoke tests
        timeout-minutes: 3
        env:
          CLOUDFLARE_DEPLOYMENT_URL: ${{ steps.pages-deployment.outputs.url }}
          PAGES_BUILD_ID: ${{ steps.prepare-pages.outputs.build_id }}
          PAGES_BUILD_TAG: ${{ steps.prepare-pages.outputs.build_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = 'https://match-signal.pages.dev';
          const deploymentBase = String(process.env.CLOUDFLARE_DEPLOYMENT_URL || '').replace(/\/+$/, '');
          const pages = ['/', '/upcoming.html', '/qualified-best', '/qualified-best.html', '/odds-builder.html', '/football.html', '/tennis.html', '/basketball.html', '/darts.html', '/table-tennis.html', '/league.html?sport=football&league=England%20Amateur%20-%20U21%20Professional%20Development%20League', '/reports.html', '/live.html', '/expansion.html', '/virtual-lab/', '/virtual-lab', '/research.html', '/virtual-lab.html', '/analyst.html'];
          const assets = ['/api/sportybet-virtual','/api/sportybet-darts','/api/sportybet-table-tennis','/api/virtual-lab-history','/expansion.js', '/expansion-odds-builder.js', '/live-analysis.js', '/live-data-worker.js', '/virtual-lab-app.js', '/virtual-lab-confirmed-watch.js', '/virtual-lab.css', '/_redirects', '/data/predictions.json', '/data/unified_upcoming.json', '/data/selection_candidates.json', '/data/expansion_status.json', '/data/odds_builder.json', '/data/odds_ticket_tracker.json', '/data/system_health.json', '/data/tennis_forward_status.json', '/data/prediction_desk_health.json', '/data/results_first_evidence_report.json', '/data/virtual_lab_live.json','/data/virtual_lab_model_eval.json','/data/virtual_lab_eligibility.json','/data/virtual_lab_participants/registry.json','/data/virtual_lab_participant_lifecycle.json','/data/virtual_lab_participants/efootball_confirmed_watch.json','/data/efootball_desk_prediction_history.json.gz','/data/club-logo-registry.json','/sport-hubs.js','/league-logos.js','/sport-hubs.css','/ms-design-system.css','/core-workspaces-design.css','/qualified-best-design.css','/sport-hubs-design.css','/independent-sport-design.css','/odds-builder-design.css','/reports-design.css','/virtual-lab-terminal.css','/workspace-ui.js','/workspace-ui.css','/analyst.js'];
          const failures = [];
          // Derive the Builder's page contract from this exact checkout. Hard-coded
          // cache/build markers caused every deployment to fail after a valid UI update.
          const builderSourceHtml = readFileSync('odds-builder.html', 'utf8');
          const currentBuilderBuildMarker = builderSourceHtml.match(/<meta name="match-signal-build" content="([^"]+)"/)?.[1] || '';
          const rootBuildMarker = String(process.env.PAGES_BUILD_ID || '');
          const rootCssHref = './ms-design-system.css?v=' + String(process.env.PAGES_BUILD_TAG || '');
          if (!rootBuildMarker || !process.env.PAGES_BUILD_TAG) failures.push('Deployment build ID or root CSS version was not generated.');
          const currentBuilderCssHref = builderSourceHtml.match(/href="(\.\/odds-builder-design\.css\?v=[^"]+)"/)?.[1] || '';
          const currentBuilderEngineSrc = builderSourceHtml.match(/src="(\.\/expansion-odds-builder\.js\?v=[^"]+)"/)?.[1] || '';
          if (!currentBuilderBuildMarker || !currentBuilderCssHref || !currentBuilderEngineSrc) {
            failures.push('Checked-out Odds Builder source is missing its build marker or versioned CSS/engine reference.');
          }
          async function getFrom(origin, path) {
            const r = await fetch(origin + path + (path.includes('?') ? '&' : '?') + 'smoke=' + Date.now(), {cache:'no-store'});
            const body = await r.text();
            return {r,body};
          }
          let verifiedProductionBoard = null;
          const get = async path => {
            if (path === '/data/unified_upcoming.json' && verifiedProductionBoard) return verifiedProductionBoard;
            return getFrom(base, path);
          };

          // Verify the immutable deployment itself first, then give Cloudflare's production
          // hostname a bounded propagation window. A successful upload alone is not proof
          // that the primary hostname is serving the uploaded HTML/CSS yet.
          const workspaceContracts = [
            {path:'/', css:'/core-workspaces-design.css', markers:[rootBuildMarker,rootCssHref,'MS-DESK-2026.10.14-V1','core-workspaces-design.css?v=20261014-full-v1','class="cd-page-header"','class="cd-workspace-grid"','id="unifiedBoard"','id="qualifiedBestSummary"'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V1: CORE DESK / FOOTBALL / TENNIS'},
            {path:'/football.html', css:'/core-workspaces-design.css', markers:['MS-FOOTBALL-DESK-2026.10.14-V1','core-workspaces-design.css?v=20261014-full-v1','class="cd-page-header"','id="leagueGrid"','data-sport="football"','league-logos.js?v=20261013-competition-logos2'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V1: CORE DESK / FOOTBALL / TENNIS'},
            {path:'/tennis.html', css:'/core-workspaces-design.css', markers:['MS-TENNIS-DESK-2026.10.14-V1','core-workspaces-design.css?v=20261014-full-v1','class="cd-page-header"','id="leagueGrid"','data-sport="tennis"'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V1: CORE DESK / FOOTBALL / TENNIS'},
            {path:'/odds-builder.html', css:'/odds-builder-design.css', markers:[currentBuilderBuildMarker,currentBuilderCssHref.replace(/^\.\//,''),currentBuilderEngineSrc.replace(/^\.\//,''),'class="ob-page-header"','class="ob-section-nav"','class="ob-guide-grid"','id="oddsBuilder"'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V3: ODDS BUILDER PAGE LAYOUT'},
            {path:'/reports.html', css:'/reports-design.css', markers:['MS-REPORTS-2026.10.14-V3','reports-design.css?v=20261014-full-v3','class="rp-dashboard-grid"','id="report-scoreboard"','id="researchLabSummary"'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V3: REPORTS PAGE LAYOUT'},
            {path:'/virtual-lab/', css:'/virtual-lab-terminal.css', markers:['MS-VIRTUAL-LAB-V1-2026.10.14-V3','../virtual-lab-terminal.css?v=20261014-full-v3','class="vl-command-grid"','class="vl-command-rail"','class="vl-insights-grid"'], cssMarker:'MATCH-SIGNAL-FULL-RECOMPOSITION-V3: VIRTUAL LAB PAGE LAYOUT'}
          ];
          if (!deploymentBase.startsWith('https://') || !deploymentBase.endsWith('.pages.dev')) {
            failures.push('Cloudflare deployment step did not publish an immutable Pages URL.');
          } else {
            // Immutable Pages URLs can briefly return 5xx during propagation.
