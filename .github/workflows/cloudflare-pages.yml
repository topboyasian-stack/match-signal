name: Deploy Match Signal to Cloudflare Pages

# V5.2 production promotion: deploy the current calibrated tennis totals feed after QA.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'nav-fix.js'
      - 'metrics-fix.js'
      - 'data/**'
      - 'functions/**'
      - 'expansion.js'
      - 'expansion-tennis-ou.js'
      - 'expansion-odds-builder.js'
      - 'live-model-trace.js'
      - 'virtual-lab.html'
      - 'research.html'
      - 'virtual-lab.js'
      - 'virtual-lab.css'
      - 'virtual-lab/**'
      - 'scripts/virtual_lab_sync.py'
      - '.github/workflows/virtual-lab-sync.yml'
      - '_redirects'
      - 'VIRTUAL-LAB-*.md'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_run:
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Autopilot Refresh"
      - "Match Signal Odds Builder"
      - "Match Signal Result Settlement"
      - "Match Signal Live Prediction Pipeline"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install lightweight navigation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              src='./nav-fix.js'
              tag=f'<script src="{src}"></script>'
              if tag not in text:
                  text=text.replace('</body>',tag+'\n</body>',1)
              marker='<style id="match-signal-nav-fix">'
              style=marker+'.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:9999;cursor:pointer!important;touch-action:manipulation}</style>'
              if marker not in text:
                  text=text.replace('</head>',style+'</head>',1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Verify production artifact
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s performance.html
          test -s live.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s data/predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          assert any(r.get('sport')=='football' for r in rows), 'no football rows'
          assert any(r.get('sport')=='tennis' for r in rows), 'no tennis rows'
          print(f'Prediction rows: {len(rows)}')
          PY

      - name: Resolve Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured"
            exit 1
          fi
          PROJECT=$(curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
            python -c 'import json,sys; d=json.load(sys.stdin); names=[p["name"] for p in d.get("result",[])]; print(next((n for n in names if n=="match-signal"), "")); print("Available Pages projects:", ", ".join(names), file=sys.stderr)')
          if [ -z "$PROJECT" ]; then
            echo "Cloudflare Pages project 'match-signal' was not found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          npx wrangler@latest pages deploy . --project-name="$PROJECT"

      - name: Run production HTTP and asset smoke tests
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://match-signal.pages.dev';
          const pages = ['/', '/expansion.html', '/live.html', '/basketball.html', '/performance.html', '/research.html', '/virtual-lab'];
          const assets = ['/expansion.js', '/expansion-odds-builder.js', '/live-analysis.js', '/live-data-worker.js', '/virtual-lab.js', '/virtual-lab.css', '/_redirects', '/data/predictions.json', '/data/expansion_status.json', '/data/odds_builder.json', '/data/virtual_lab_live.json'];
          const failures = [];
          async function get(path) {
            const r = await fetch(base + path + (path.includes('?') ? '&' : '?') + 'smoke=' + Date.now(), {cache:'no-store'});
            const body = await r.text();
            return {r,body};
          }
          for (const path of pages) {
            try {
              const {r,body}=await get(path);
              if (!r.ok) failures.push(path+' HTTP '+r.status);
              if (!body.includes('<html') && path.endsWith('.html')) failures.push(path+' did not return HTML');
              if (path==='/expansion.html') {
                for (const marker of ['id="groups"','id="oddsBuilder"','expansion.js','expansion-odds-builder.js'])
                  if (!body.includes(marker)) failures.push(path+' missing '+marker);
              }
              if (path==='/live.html') {
                for (const marker of ['id="statusText"','id="grid"','live-analysis.js','live-data-worker.js'])
                  if (!body.includes(marker)) failures.push(path+' missing '+marker);
              }
              if (path==='/virtual-lab.html' || path==='/virtual-lab') {
                for (const marker of ['Virtual Lab','virtual-lab.js','How to use the Lab / what to select','Research conclusion'])
                  if (!body.includes(marker)) failures.push(path+' missing '+marker);
              }
            } catch(e) { failures.push(path+' '+e.message); }
          }
          for (const path of assets) {
            try {
              const {r,body}=await get(path);
              if (!r.ok) failures.push(path+' HTTP '+r.status);
              if (!body.trim()) failures.push(path+' empty response');
              if (path.endsWith('.json')) JSON.parse(body);
            } catch(e) { failures.push(path+' '+e.message); }
          }
          try {
            const {r,body}=await get('/api/espn?path='+encodeURIComponent('/apis/site/v2/sports/basketball/nba/scoreboard'));
            if (!r.ok) failures.push('/api/espn NBA HTTP '+r.status);
            else if (!Array.isArray(JSON.parse(body).events)) failures.push('/api/espn NBA returned invalid JSON');
          } catch(e) { failures.push('/api/espn '+e.message); }
          try {
            const params = new URLSearchParams({
              sportId:'sr:sport:1',
              marketId:'1,18,10,29,11,26,36,14,60100,186,189,202,204,210',
              pageSize:'100',
              pageNum:'1',
              todayGames:'false',
              timeline:'168',
              _t:String(Date.now())
            });
            const {r,body}=await get('/api/sportybet?'+params.toString());
            if (!r.ok) failures.push('/api/sportybet HTTP '+r.status);
            const payload=JSON.parse(body);
            if (payload.bizCode!==10000) failures.push('/api/sportybet bizCode '+payload.bizCode);
            const tournaments=(payload.data&&payload.data.tournaments)||[];
            const virtualEvents=tournaments.flatMap(t=>(t.events||[]).map(e=>({
              tournament:String(t.name||''),
              category:String(t.categoryName||''),
              home:String(e.homeTeamName||''),
              away:String(e.awayTeamName||'')
            }))).filter(e=>/simulated reality|\bsrl\b|gt sports league|gt leagues|eadriatic|efootball|e soccer|esoccer|virtual football|zoom|turbo/i.test(e.tournament+' '+e.category+' '+e.home+' '+e.away));
            if (!virtualEvents.length) failures.push('/api/sportybet returned no virtual/eFootball/SRL events');
            else console.log('Virtual Lab live source passed: '+virtualEvents.length+' matching events');
          } catch(e) { failures.push('/api/sportybet '+e.message); }

          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('Production HTTP smoke tests passed: '+pages.length+' pages, '+assets.length+' assets, NBA ESPN proxy');
          NODE

      - name: Write deployment marker
        run: |
          echo "Cloudflare Pages deployment completed for commit $GITHUB_SHA"
