name: Deploy Match Signal to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'nav-fix.js'
      - 'metrics-fix.js'
      - 'data/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_run:
    workflows:
      - "Match Signal Autopilot Refresh"
      - "Match Signal Live Expansion"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal Saudi Pro League Live Experimental"
      - "Match Signal Odds Builder"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install production frontend fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              for src in ('./nav-fix.js','./metrics-fix.js','./live-timer.js'):
                  tag=f'<script src="{src}"></script>'
                  if tag not in text:
                      text=text.replace('</body>',tag+'\n</body>',1)
              marker='<style id="match-signal-nav-fix">'
              style=marker+'.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:9999;cursor:pointer!important;touch-action:manipulation}</style>'
              if marker not in text:
                  text=text.replace('</head>',style+'</head>',1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Verify production artifact
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s performance.html
          test -s live.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s data/predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          assert any(r.get('sport')=='football' for r in rows), 'no football rows'
          assert any(r.get('sport')=='tennis' for r in rows), 'no tennis rows'
          print(f'Prediction rows: {len(rows)}')
          PY

      - name: Resolve Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured"
            exit 1
          fi
          PROJECT=$(curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
            python -c 'import json,sys; d=json.load(sys.stdin); names=[p["name"] for p in d.get("result",[])]; print(next((n for n in names if n=="match-signal"), "")); print("Available Pages projects:", ", ".join(names), file=sys.stderr)')
          if [ -z "$PROJECT" ]; then
            echo "Cloudflare Pages project 'match-signal' was not found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          npx wrangler@latest pages deploy . --project-name="$PROJECT" --branch=main

      - name: Write deployment marker
        run: |
          echo "Cloudflare Pages deployment completed for commit $GITHUB_SHA"
