name: Match Signal Odds Ticket Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Match Signal Odds Builder"
      - "Match Signal Result Settlement"
      - "Match Signal Virtual Lab Collector"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/odds_ticket_tracker.py'
      - 'scripts/test_odds_ticket_tracker.py'
      - 'scripts/test_odds_tracker_publish_retry.py'
      - 'data/odds_builder.json'
      - 'scripts/results_first_evidence_report.py'
      - '.github/workflows/odds-ticket-tracker.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: match-signal-odds-ticket-tracker
  cancel-in-progress: true

jobs:
  track:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test stale paper-ticket archive rules
        run: python scripts/test_odds_ticket_tracker.py

      - name: Run ticket tracker publish-retry regression
        run: python scripts/test_odds_tracker_publish_retry.py

      - name: Run ticket tracker
        run: python scripts/odds_ticket_tracker.py

      - name: Validate ticket tracker
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, '.')
          from scripts.odds_ticket_tracker import ticket_is_stale_pending
          d=json.loads(Path('data/odds_ticket_tracker.json').read_text())
          assert d.get('mode') == 'PAPER_ONLY'
          assert isinstance(d.get('tickets'), list)
          summary=d.get('summary') or {}
          for key in ('tracked_tickets','pending','won','lost','legs_won','legs_lost','legs_pending'):
              assert int(summary.get(key,0)) >= 0
          assert int(d.get('version',0)) >= 4
          assert isinstance(d.get('archived_tickets',[]), list)
          assert int(summary.get('active_pending',0)) >= 0
          assert int(summary.get('archived_pending',0)) >= 0
          now = datetime.now(timezone.utc)
          assert not any(ticket_is_stale_pending(t, now) for t in d['tickets']), 'stale pending ticket leaked into current track'
          assert int(summary.get('active_pending',0)) == sum(str(t.get('status') or '').upper() == 'PENDING' for t in d['tickets'])
          assert int(summary.get('archived_pending',0)) == sum(str(t.get('status') or '').upper() == 'PENDING' for t in d.get('archived_tickets',[]))
          all_tickets = list(d['tickets']) + list(d.get('archived_tickets',[]))
          ids = [str(t.get('ticket_id') or '') for t in all_tickets]
          assert len(ids) == len(set(ids)), 'duplicate ticket IDs across active/archive lists'
          for ticket in all_tickets:
              assert ticket.get('paper_only') is True
              assert ticket.get('real_money_execution') is False
              assert ticket.get('status') in {'PENDING','LOST','WON'}
              assert ticket.get('ticket_id')
              assert ticket.get('snapshot_fingerprint')
              assert isinstance(ticket.get('legs'), list)
              assert int(ticket.get('leg_count',len(ticket['legs']))) == len(ticket['legs'])
              statuses={str(x.get('status') or 'PENDING') for x in ticket['legs']}
              if 'LOST' in statuses:
                  assert ticket.get('status') == 'LOST'
              leg_odds=[]
              for leg in ticket.get('legs') or []:
                  raw=leg.get('bookmaker_odds_snapshot')
                  if raw is None:
                      raw=leg.get('bookmaker_odds')
                  try:
                      value=float(raw)
                  except (TypeError,ValueError):
                      value=None
                  if value is None or value <= 1.0:
                      leg_odds=[]
                      break
                  leg_odds.append(value)
              if leg_odds:
                  derived=1.0
                  for value in leg_odds:
                      derived*=value
                  combined=ticket.get('combined_odds')
                  assert combined is not None, 'ticket missing combined odds despite complete leg prices'
                  assert abs(float(combined)-derived) < 0.001, 'combined odds do not match immutable leg prices'
          print('Ticket tracker OK:', json.dumps(summary))
          PY

      - name: Publish ticket tracker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_ticket_tracker.json
          if git diff --cached --quiet; then
            echo "No ticket tracking changes."
            exit 0
          fi
          git commit -m "🤖 Update paper ticket settlement tracker"
          # The tracker archive is several MB and a fresh settlement backfill can
          # take a minute. Don't repeat that work when main only changed unrelated
          # health/board artifacts; rebase just this data file onto latest main.
          tracking_base="$(git rev-parse HEAD^)"
          tracker_snapshot="$(mktemp)"
          cp data/odds_ticket_tracker.json "$tracker_snapshot"
          for attempt in 1 2 3 4 5 6; do
            if git push origin main; then
              echo "Ticket tracker published on attempt ${attempt}."
              exit 0
            fi
            echo "Tracker publish collided with a concurrent main update; attempt ${attempt}."
            git fetch --no-tags origin main
            if git diff --quiet "$tracking_base" origin/main -- \
              data/odds_builder.json \
              data/odds_ticket_tracker.json \
              data/virtual_lab_history.json \
              data/virtual_lab_pending.json \
              data/virtual_lab_live.json \
              data/prediction_history.json \
              data/expansion_prediction_history.json \
              data/virtual_lab_archive/settlements; then
              echo "Tracker inputs are unchanged; preserve the validated snapshot and sync onto latest main."
              git reset --hard origin/main
              cp "$tracker_snapshot" data/odds_ticket_tracker.json
            else
              echo "Builder, tracker, or settlement inputs changed; recalculate using latest main."
              git reset --hard origin/main
              python scripts/odds_ticket_tracker.py
              cp data/odds_ticket_tracker.json "$tracker_snapshot"
            fi
            git add data/odds_ticket_tracker.json
            if git diff --cached --quiet; then
              echo "No tracker diff after syncing latest main."
              exit 0
            fi
            git commit -m "🤖 Update paper ticket settlement tracker"
            tracking_base="$(git rev-parse HEAD^)"
          done
          exit 1
