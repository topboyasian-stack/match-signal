name: Football model adoption regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/independent_football_model.py'
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/model_upgrade.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/test_model_upgrade_football_ensemble.py'
      - '.github/workflows/autopilot-refresh.yml'
      - '.github/workflows/tennis_pipeline.yml'
      - '.github/workflows/football-model-adoption-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/independent_football_model.py'
      - 'scripts/football_prequential_ensemble.py'
      - 'scripts/model_upgrade.py'
      - 'scripts/test_football_prequential_ensemble.py'
      - 'scripts/test_model_upgrade_football_ensemble.py'
      - '.github/workflows/autopilot-refresh.yml'
      - '.github/workflows/tennis_pipeline.yml'
      - '.github/workflows/football-model-adoption-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile established statistical model modules
        run: |
          python -m py_compile \
            scripts/independent_football_model.py \
            scripts/football_prequential_ensemble.py \
            scripts/model_upgrade.py \
            scripts/value_decision.py \
            scripts/test_football_prequential_ensemble.py \
            scripts/test_model_upgrade_football_ensemble.py

      - name: Test chronological Elo, Dixon-Coles and ensemble rules
        run: python scripts/test_football_prequential_ensemble.py

      - name: Test validated forecast application and protected ticket gates
        run: python scripts/test_model_upgrade_football_ensemble.py

      - name: Verify the canonical pipeline owns model application and forecast publication
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path('.github/workflows/tennis_pipeline.yml').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/autopilot-refresh.yml').read_text(encoding='utf-8')
          assert 'python scripts/model_upgrade.py' in core
          assert 'Assert football ensemble audit is fresh and paper-only' in core
          assert 'data/predictions.json' in core
          assert 'data/football_prequential_validation.json' in core
          assert 'python scripts/model_upgrade.py' not in workflow
          publish = workflow.split('      - name: Publish football readiness and autopilot status', 1)[1]
          assert 'data/predictions.json' not in publish
          assert 'data/football_prequential_validation.json' not in publish
          assert 'data/autopilot_status.json' in publish
          assert 'data/football_model_council.json' in publish
          assert 'data/football_forward_readiness.json' in publish
          assert 'cancel-in-progress: false' in workflow
          assert 'git rebase origin/main' in workflow
          assert 'git stash push --include-untracked' in publish
          assert 'Readiness/source artifacts changed concurrently; rebuild on latest main.' in publish
          print('Canonical prediction pipeline is sole owner of model application/feed; Autopilot only publishes readiness and status.')
          PY
