name: Validate eFootball market research

on:
  pull_request:
    paths:
      - 'scripts/efootball_market_research.py'
      - 'scripts/test_efootball_market_research.py'
      - 'scripts/efootball_performance_report.py'
      - 'scripts/test_efootball_performance_report.py'
      - 'scripts/virtual_lab_sync.py'
      - 'functions/api/sportybet-virtual.js'
      - 'functions/api/sportybet-virtual-results.js'
      - '.github/workflows/efootball-market-research-tests.yml'
      - '.github/workflows/efootball-market-research-schedule.yml'
      - '.github/workflows/virtual-lab-live-sync-heartbeat.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/efootball_market_research.py'
      - 'scripts/test_efootball_market_research.py'
      - 'scripts/efootball_performance_report.py'
      - 'scripts/test_efootball_performance_report.py'
      - 'scripts/virtual_lab_sync.py'
      - 'functions/api/sportybet-virtual.js'
      - '.github/workflows/efootball-market-research-tests.yml'
      - '.github/workflows/efootball-market-research-schedule.yml'
      - '.github/workflows/virtual-lab-live-sync-heartbeat.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP dependency
        run: python -m pip install --upgrade requests
      - name: Compile and run isolated market tests
        run: |
          python -m py_compile scripts/efootball_market_research.py scripts/test_efootball_market_research.py scripts/efootball_performance_report.py scripts/test_efootball_performance_report.py
          python scripts/test_efootball_market_research.py
          python scripts/test_efootball_performance_report.py
      - name: Verify re-registered live sync and research schedule linkage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sync_path = Path('.github/workflows/virtual-lab-live-sync-heartbeat.yml')
          research_path = Path('.github/workflows/efootball-market-research-schedule.yml')
          board_path = Path('.github/workflows/unified-upcoming.yml')
          watchdog_path = Path('.github/workflows/automation_watchdog.yml')

          assert sync_path.exists() and not Path('.github/workflows/virtual-lab-sync.yml').exists()
          assert research_path.exists() and not Path('.github/workflows/efootball-market-research.yml').exists()
          sync = sync_path.read_text()
          research = research_path.read_text()
          board = board_path.read_text()
          watchdog = watchdog_path.read_text()
          assert "name: Match Signal Virtual Lab Live Sync" in sync
          assert "cron: '1-59/5 * * * *'" in sync
          assert ".github/workflows/virtual-lab-live-sync-heartbeat.yml" in sync
          assert "name: Isolated eFootball Winner and BTTS Market Research" in research
          assert "cron: '4,19,34,49 * * * *'" in research
          assert ".github/workflows/efootball-market-research-schedule.yml" in research
          assert '"Match Signal Virtual Lab Live Sync"' in research
          assert '"Match Signal Virtual Lab Live Sync"' in board
          assert '"Match Signal Virtual Lab Live Sync"' in watchdog
          print("Re-registered schedules, downstream workflow names and paper-only research linkage verified.")
          PY
      - name: Check that production qualification remains disabled
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('scripts/efootball_market_research.py').read_text()
          for contract in ('production_qualification_enabled=False','odds_builder_eligible=False','live_trading_approved=False'):
              assert contract in source, f'missing fail-closed research contract: {contract}'
          assert 'efootball_gt' in source and 'efootball_adriatic' in source
          assert 'vfootball' not in source.lower().replace('efootball_market_research','')
          print('Fail-closed research contract check passed.')
          PY
