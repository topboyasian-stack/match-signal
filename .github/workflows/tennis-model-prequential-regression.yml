name: ATP prequential model regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tennis_model_v2.py'
      - 'scripts/test_tennis_model_prequential.py'
      - '.github/workflows/tennis-model-prequential-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tennis_model_v2.py'
      - 'scripts/test_tennis_model_prequential.py'
      - '.github/workflows/tennis-model-prequential-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile and run chronological ATP regressions
        run: |
          python -m py_compile scripts/tennis_model_v2.py scripts/test_tennis_model_prequential.py
          python scripts/test_tennis_model_prequential.py
