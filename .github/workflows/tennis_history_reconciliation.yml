name: Match Signal Tennis History Reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_tennis_history.py'
      - 'scripts/settle_tennis_history.py'
      - '.github/workflows/tennis_history_reconciliation.yml'
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-tennis-history
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Recover recent ATP/WTA predictions from git history
        run: python scripts/reconcile_tennis_history.py

      - name: Batch-settle recovered completed tennis matches
        run: PYTHONPATH=scripts python scripts/settle_tennis_history.py

      - name: Validate tennis history artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['data/tennis_prediction_archive.json','data/prediction_history.json','data/tennis_performance.json']:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing {name}')
              json.loads(p.read_text())
              print(f'Validated {name}')
          archive=json.loads(Path('data/tennis_prediction_archive.json').read_text())
          settled=[x for x in archive if x.get('settled')]
          eligible=[x for x in settled if x.get('evaluation_eligible') is True]
          print(f'Tennis archive rows: {len(archive)} | settled: {len(settled)} | eligible settled: {len(eligible)}')
          PY

      - name: Commit recovered tennis history and settlement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennis_prediction_archive.json data/prediction_history.json data/accuracy.json data/tennis_performance.json
          if git diff --cached --quiet; then
            echo "No tennis history changes."
            exit 0
          fi
          git commit -m "🎾 Persist and settle historical tennis predictions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Tennis history push succeeded on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --soft origin/main
              git add data/tennis_prediction_archive.json data/prediction_history.json data/accuracy.json data/tennis_performance.json
              git commit -m "🎾 Persist and settle historical tennis predictions" || true
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish tennis history after retries" >&2
          exit 1
