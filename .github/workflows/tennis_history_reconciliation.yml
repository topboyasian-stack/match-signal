name: Match Signal Tennis History Reconciliation

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-tennis-history
  cancel-in-progress: false

jobs:
  reconcile:
    # Scheduled/manual runs remain available for reconciliation. When triggered
    # by the core pipeline, only a successful core publication may launch this
    # writer; never let a failed/cancelled core snapshot become authoritative.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests curl_cffi

      - name: Recover recent ATP/WTA predictions from git history
        run: python scripts/reconcile_tennis_history.py

      - name: Batch-settle recovered completed tennis matches
        run: PYTHONPATH=scripts python scripts/settle_tennis_history.py

      - name: Validate tennis history artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['data/tennis_prediction_archive.json','data/prediction_history.json','data/tennis_performance.json']:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing {name}')
              json.loads(p.read_text())
              print(f'Validated {name}')
          archive=json.loads(Path('data/tennis_prediction_archive.json').read_text())
          settled=[x for x in archive if x.get('settled')]
          eligible=[x for x in settled if x.get('evaluation_eligible') is True]
          print(f'Tennis archive rows: {len(archive)} | settled: {len(settled)} | eligible settled: {len(eligible)}')
          PY

      - name: Recompute current performance snapshot
        run: PYTHONPATH=. python scripts/current_performance.py

      - name: Verify append-only performance ledger
        run: PYTHONPATH=. python scripts/verify_performance_ledger.py

      - name: Prepare isolated tennis publication snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tennis-publish
          mkdir -p /tmp/tennis-publish
          cp data/tennis_prediction_archive.json data/prediction_history.json data/accuracy.json data/tennis_performance.json data/current_performance.json /tmp/tennis-publish/

      - name: Publish only authorized tennis ledger files on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/reconcile_tennis_history.py
            PYTHONPATH=scripts python scripts/settle_tennis_history.py
            PYTHONPATH=. python scripts/current_performance.py
            PYTHONPATH=. python scripts/verify_performance_ledger.py

            git add data/tennis_prediction_archive.json data/prediction_history.json data/accuracy.json data/tennis_performance.json data/current_performance.json
            if git diff --cached --quiet; then
              echo "No tennis history changes."
              exit 0
            fi

            extra=$(git diff --cached --name-only | grep -vE '^(data/tennis_prediction_archive\.json|data/prediction_history\.json|data/accuracy\.json|data/tennis_performance\.json|data/current_performance\.json)$' || true)
            if [ -n "$extra" ]; then
              echo "ABORT: tennis reconciler staged unauthorized files:"
              echo "$extra"
              git reset
              exit 1
            fi

            git commit -m "🎾 Persist and settle historical tennis predictions"
            if git push origin main; then
              echo "Tennis history push succeeded on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish tennis history after retries" >&2
          exit 1
