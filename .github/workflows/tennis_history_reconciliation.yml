name: Match Signal Tennis History Reconciliation

on:
  workflow_run:
    workflows: ["Match Signal Live Prediction Pipeline"]
    types: [completed]
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-tennis-history
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Recover recent ATP/WTA predictions from git history
        run: python scripts/reconcile_tennis_history.py

      - name: Settle recovered completed tennis matches
        run: python scripts/settle_same_day.py

      - name: Validate tennis history artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['data/tennis_prediction_archive.json','data/prediction_history.json','data/tennis_performance.json']:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing {name}')
              json.loads(p.read_text())
              print(f'Validated {name}')
          archive=json.loads(Path('data/tennis_prediction_archive.json').read_text())
          settled=[x for x in archive if x.get('settled')]
          print(f'Tennis archive rows: {len(archive)} | settled: {len(settled)}')
          PY

      - name: Commit recovered tennis history and settlement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennis_prediction_archive.json data/prediction_history.json data/accuracy.json data/tennis_performance.json
          if git diff --cached --quiet; then
            echo "No tennis history changes."
            exit 0
          fi
          git commit -m "🎾 Persist and settle historical tennis predictions"
          git push origin main
