name: Match Signal Persistent Club Logo Registry

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_club_logos.py'
      - 'scripts/test_club_logo_registry.py'
      - 'workspace-ui.js'
      - 'scripts/test_workspace_media_titles.mjs'
      - '.github/workflows/sync-club-logos.yml'

permissions:
  contents: write

concurrency:
  group: match-signal-persistent-club-logos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo registry dependency
        run: python -m pip install --upgrade requests

      - name: Verify safe licence and registry rules
        run: |
          python -m unittest scripts.test_club_logo_registry scripts.test_odds_ticket_tracker -v
          python -m py_compile scripts/sync_club_logos.py scripts/odds_ticket_tracker.py
          node scripts/test_workspace_media_titles.mjs

      - name: Download missing verified logo assets
        shell: bash
        run: |
          set -euo pipefail
          # Multiple bounded passes cover the discovered club pool without repeating failed names in this policy version.
          for pass in 1 2 3; do
            echo "Club logo discovery pass $pass/3"
            python scripts/sync_club_logos.py --max-new 80
          done

      - name: Publish permanent logo assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/club-logo-registry.json
          git add -f assets/club-logos/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new licensed logo assets or registry updates."
            exit 0
          fi
          git commit -m "🛡️ Store verified licensed club logo assets"
          for attempt in 1 2 3 4 5 6; do
            if git push origin main; then
              echo "Persistent logo registry published."
              exit 0
            fi
            echo "Concurrent main update detected; rebasing the existing asset commit (attempt \${attempt}/6)."
            git fetch origin main
            # Keep the already-downloaded/licence-checked assets. Resetting to
            # origin/main here discarded them and repeated every Commons lookup,
            # making the publisher lose the race again.
            git rebase origin/main
            sleep $((attempt * 4))
          done
          echo "Logo registry commit could not be published after six rebase retries."
          git status --short
          exit 1
