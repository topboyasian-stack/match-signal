name: Deploy Match Signal SportyBet Regional Proxy

on:
  push:
    branches: [main]
    paths:
      - 'sportybet-worker/**'
      - '.github/workflows/deploy-sportybet-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-signal-sportybet-regional-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy regional Worker
        id: deploy
        working-directory: sportybet-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx wrangler@latest deploy 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          worker_url="$(printf '%s\n' "$output" | grep -Eo 'https://match-signal-sportybet-proxy\.[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          if [ -z "$worker_url" ]; then
            echo "Could not resolve the deployed Worker URL from Wrangler output." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "worker_url=$worker_url" >> "$GITHUB_ENV"
          echo "Regional Worker URL: $worker_url"

      - name: Verify health and probe SportyBet from the Worker
        timeout-minutes: 2
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = String(process.env.WORKER_URL || '').replace(/\/+$/, '');
          if (!base.startsWith('https://') || !base.endsWith('.workers.dev')) {
            throw new Error('The deploy step did not produce a valid workers.dev URL.');
          }

          let health = null;
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              const response = await fetch(base + '/health?probe=' + Date.now(), {
                cache: 'no-store',
                signal: AbortSignal.timeout(10000)
              });
              const text = await response.text();
              let payload = null;
              try { payload = JSON.parse(text); } catch (_) {}
              console.log('Worker health attempt ' + attempt + ': status=' + response.status +
                ', content-type=' + (response.headers.get('content-type') || 'unknown') +
                ', body=' + text.replace(/\s+/g, ' ').slice(0, 200));
              if (response.ok && payload?.ok === true) {
                health = payload;
                break;
              }
            } catch (error) {
              console.log('Worker health attempt ' + attempt + ' fetch error: ' + String(error?.message || error));
            }
            if (attempt < 8) await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!health) throw new Error('Regional Worker health endpoint did not return JSON after 8 attempts.');
          console.log('Worker health verified:', JSON.stringify(health));

          const diagnosticResponse = await fetch(base + '/__diagnostics?probe=' + Date.now(), {
            cache: 'no-store',
            signal: AbortSignal.timeout(30000)
          });
          const diagnosticText = await diagnosticResponse.text();
          let diagnostics = null;
          try { diagnostics = JSON.parse(diagnosticText); } catch (_) {}
          console.log('Worker diagnostic HTTP:', diagnosticResponse.status,
            'content-type=' + (diagnosticResponse.headers.get('content-type') || 'unknown'),
            'body=' + diagnosticText.replace(/\s+/g, ' ').slice(0, 200));
          if (!diagnosticResponse.ok || diagnostics?.diagnostic !== 'sportybet-region-worker-v1' ||
              !Array.isArray(diagnostics.probes) || diagnostics.probes.length !== 2) {
            throw new Error('Regional Worker diagnostic response was invalid.');
          }
          console.log('SportyBet diagnostics:', JSON.stringify(diagnostics, null, 2));

          const nbaUrl = base + '/api/ng/factsCenter/pcUpcomingEvents?sportId=sr%3Asport%3A2&pageSize=5&pageNum=1&todayGames=false&timeline=96&marketId=225&probe=' + Date.now();
          const nbaResponse = await fetch(nbaUrl, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
          const nbaText = await nbaResponse.text();
          console.log('NBA totals market-225 probe:', JSON.stringify({
            http_status: nbaResponse.status,
            upstream_status: nbaResponse.headers.get('X-Match-Signal-Upstream-Status'),
            endpoint: nbaResponse.headers.get('X-Match-Signal-Upstream-Endpoint'),
            body: nbaText.replace(/\\s+/g, ' ').slice(0, 500)
          }, null, 2));
          if (nbaResponse.status === 400 && !nbaResponse.headers.has('X-Match-Signal-Upstream-Status')) {
            throw new Error('Regional Worker rejected the NBA sportId or marketId before reaching SportyBet.');
          }

          const nbaVariantsResponse = await fetch(base + '/__nba-diagnostics?probe=' + Date.now(), {
            cache: 'no-store',
            signal: AbortSignal.timeout(40000)
          });
          const nbaVariantsText = await nbaVariantsResponse.text();
          let nbaVariants = null;
          try { nbaVariants = JSON.parse(nbaVariantsText); } catch (_) {}
          console.log('NBA source query-window diagnostics:', JSON.stringify({
            http_status: nbaVariantsResponse.status,
            diagnostic: nbaVariants?.diagnostic,
            checked_at: nbaVariants?.checked_at,
            probes: (nbaVariants?.probes || []).map(item => ({
              variant: item.variant,
              query: item.query,
              status: item.status,
              ok: item.ok,
              is_json: item.is_json,
              biz_code: item.biz_code,
              total_num: item.total_num,
              tournament_count: item.tournament_count,
              tournament_names: item.tournament_names,
              tournament_ids: item.tournament_ids,
              event_count: item.event_count,
              response_shape: item.response_shape,
              data_keys: item.data_keys,
              elapsed_ms: item.elapsed_ms,
              error: item.error
            }))
          }, null, 2));
          if (!nbaVariantsResponse.ok ||
              nbaVariants?.diagnostic !== 'sportybet-nba-query-variants-v1' ||
              !Array.isArray(nbaVariants.probes) || nbaVariants.probes.length !== 4) {
            throw new Error('NBA source query-window diagnostic endpoint was invalid.');
          }

          for (const [sportName, sportId, marketIds] of [
            ['football', 'sr%3Asport%3A1', '1%2C18%2C10%2C14%2C16%2C29%2C45%2C47'],
            ['tennis', 'sr%3Asport%3A5', '186%2C210%2C202%2C204%2C189%2C203%2C188%2C187']
          ]) {
            const url = base + '/api/ng/factsCenter/pcUpcomingEvents?sportId=' + sportId +
              '&pageSize=5&pageNum=1&todayGames=false&timeline=168&marketId=' + marketIds + '&probe=' + Date.now();
            const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
            const text = await response.text();
            console.log('Shared ticket ' + sportName + ' proxy probe:', JSON.stringify({
              http_status: response.status,
              upstream_status: response.headers.get('X-Match-Signal-Upstream-Status'),
              body: text.replace(/\\s+/g, ' ').slice(0, 260)
            }));
            if (response.status === 400 && !response.headers.has('X-Match-Signal-Upstream-Status')) {
              throw new Error('Regional Worker rejected the shared ticket ' + sportName + ' sportId/marketIds before reaching SportyBet.');
            }
          }

          const invalidShareResponse = await fetch(base + '/api/ng/orders/share?probe=' + Date.now(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ selections: [] }),
            cache: 'no-store',
            signal: AbortSignal.timeout(10000)
          });
          const invalidShareText = await invalidShareResponse.text();
          const invalidShareContentType = String(invalidShareResponse.headers.get('content-type') || '').toLowerCase();
          let invalidSharePayload = null;
          try { invalidSharePayload = JSON.parse(invalidShareText); } catch (_) {}
          console.log('Regional share POST route invalid-ticket probe:', JSON.stringify({
            http_status: invalidShareResponse.status,
            content_type: invalidShareContentType,
            error: invalidSharePayload?.error,
            upstream_status_header: invalidShareResponse.headers.get('X-Match-Signal-Upstream-Status')
          }));
          if (invalidShareResponse.status !== 422 ||
              !invalidShareContentType.includes('application/json') ||
              invalidSharePayload?.error !== 'INVALID_SHARE_SELECTION_COUNT' ||
              invalidShareResponse.headers.has('X-Match-Signal-Upstream-Status')) {
            throw new Error('Regional share POST route did not fail closed on an invalid ticket before contacting SportyBet.');
          }
          console.log('Regional share POST route passed: invalid slip receives JSON 422 without provider access.');
          NODE
