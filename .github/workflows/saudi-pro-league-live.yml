name: Match Signal Saudi Pro League Live Experimental

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/saudi_pro_league_live.py'
      - 'scripts/predict_today.py'
      - '.github/workflows/saudi-pro-league-live.yml'

permissions:
  contents: write

# Serialize publication with the other feed writers so one sport cannot overwrite another.
concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  saudi-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate Saudi Pro League experimental signals
        run: python scripts/saudi_pro_league_live.py

      - name: Validate and merge Saudi predictions into main feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/saudi_pro_league_predictions.json')
          status_path = Path('data/saudi_pro_league_status.json')
          feed_path = Path('data/predictions.json')
          rows = json.loads(path.read_text())
          status = json.loads(status_path.read_text())
          if status.get('errors'):
              raise SystemExit(f"ABORT: Saudi source errors: {status['errors']}")
          if status.get('current_fixtures', 0) < 1 or not rows:
              raise SystemExit(f"ABORT: Saudi Pro League publication empty: {status.get('current_fixtures', 0)} fixtures")
          feed = json.loads(feed_path.read_text()) if feed_path.exists() else []
          feed = [p for p in feed if p.get('league') != 'Saudi Pro League']
          feed.extend(rows)
          feed.sort(key=lambda p: p.get('start_time') or '')
          feed_path.write_text(json.dumps(feed, indent=2, ensure_ascii=False))
          print(f"Saudi publication guard passed: {len(rows)} fixtures; main feed now {len(feed)} rows")
          PY

      - name: Commit Saudi publication data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/saudi_pro_league_predictions.json data/saudi_pro_league_status.json
          if git diff --cached --quiet; then
            echo "No Saudi Pro League data changes."
            exit 0
          fi
          git commit -m "🇸🇦 Publish Saudi Pro League experimental signals"
          git push origin main
