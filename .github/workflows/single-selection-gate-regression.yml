name: Independent single-selection gate regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'sport-hubs.js'
      - 'scripts/selective_prediction_gate.py'
      - 'scripts/test_selection_gate_contract.py'
      - 'scripts/test_single_selection_gate_bridge.mjs'
      - 'scripts/predict_today.py'
      - 'scripts/test_predict_today_market_matching.py'
      - '.github/workflows/single-selection-gate-regression.yml'
  push:
    branches: [main]
    paths:
      - 'sport-hubs.js'
      - 'scripts/predict_today.py'
      - 'scripts/test_predict_today_market_matching.py'
      - 'scripts/selective_prediction_gate.py'
      - 'scripts/test_selection_gate_contract.py'
      - 'scripts/test_single_selection_gate_bridge.mjs'
      - 'scripts/predict_today.py'
      - 'scripts/test_predict_today_market_matching.py'
      - '.github/workflows/single-selection-gate-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile and test the independent paper gate
        run: |
          python -m py_compile scripts/selective_prediction_gate.py scripts/test_selection_gate_contract.py scripts/predict_today.py scripts/test_predict_today_market_matching.py
          python scripts/test_selection_gate_contract.py
          python scripts/test_predict_today_market_matching.py
          node scripts/test_single_selection_gate_bridge.mjs
