name: NBA totals SportyBet market-225 price capture

on:
  schedule:
    # Canonical ten-minute cadence. The freshness watchdog re-arms this schedule
    # and dispatches recovery when capture evidence or prediction-source SHA is stale.
    # This workflow avoids a direct workflow_run trigger; Live Expansion now performs
    # an explicit post-publication source-hash handoff to prevent duplicate captures.
    # The exact-market freshness contract remains 15 minutes and is not relaxed.
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nba_totals_prices.py'
      - 'scripts/nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_price_capture.py'
      - 'scripts/test_nba_sportybet_totals.py'
      - 'functions/api/sportybet-basketball.js'

permissions:
  actions: write
  contents: write

concurrency:
  # GitHub permits only one pending run per concurrency group. Keep the cron
  # lane separate so explicit post-publication recovery captures cannot replace it.
  group: nba-totals-price-capture-${{ github.event_name == 'schedule' && 'scheduled' || 'event-driven' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Compile capture code and run regression tests
        run: |
          python -m py_compile scripts/capture_nba_totals_prices.py scripts/nba_totals_walk_forward.py scripts/test_nba_totals_price_capture.py scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_price_capture.py
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/capture_nba_totals_prices.py").read_text(encoding="utf-8")
          assert "nba_totals_oos_value_test.json" not in source
          assert "REPORT.write_text" not in source
          print("PASS: quote capture does not publish OOS/probability reports.")
          PY

      - name: Capture fresh SportyBet market-225 pairs and update the totals audit
        run: PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py

      - name: Verify capture status without rewriting OOS research reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          assert status.get("paper_only") is True
          assert status.get("model_version") == "nba-total-v5.1-pace-efficiency-calibrated"
          assert status.get("checked_at")
          assert isinstance(status.get("feed_events"), int)
          assert isinstance(status.get("feed_events_with_market_225"), int)
          assert isinstance(status.get("immutable_snapshots_added"), int)
          print("Capture status verified; OOS/probability reports are published by the dedicated research workflow.")
          PY

      - name: Publish immutable price snapshots and capture status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_price_capture_status.json
          if git diff --cached --quiet; then
            echo 'No fresh market-225 price or audit changes to publish.'
            exit 0
          fi
          git commit -m 'Capture immutable SportyBet NBA totals market-225 prices'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'NBA totals market-225 snapshot publication succeeded.'
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py
              git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_price_capture_status.json
              if git diff --cached --quiet; then
                echo 'Latest main already contains the current market-225 capture.'
                exit 0
              fi
              git commit -m 'Refresh SportyBet NBA totals market-225 price capture'
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish NBA totals price capture after retries.' >&2
          exit 1

      - name: Dispatch settlement and probability/value refresh after new immutable quotes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          added="$(python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          print(int(status.get("immutable_snapshots_added") or 0))
          PY
          )"
          ledger_age_minutes="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              ledger = json.loads(Path("data/nba_totals_ledger.json").read_text(encoding="utf-8"))
              updated = datetime.fromisoformat(str(ledger.get("updated_at", "")).replace("Z", "+00:00"))
              if updated.tzinfo is None:
                  updated = updated.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - updated.astimezone(timezone.utc)).total_seconds() / 60
              print(f"{max(0.0, age):.2f}")
          except (OSError, ValueError, TypeError):
              print("999999")
          PY
          )"
          echo "New immutable SportyBet market-225 snapshots: $added"
          echo "Official ESPN ledger age at capture completion: $ledger_age_minutes minutes"
          # The watchdog may already have dispatched settlement recovery for this
          # stale ledger. Avoid queuing a second ESPN reconciliation from capture.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba-totals-settlement.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | {status, conclusion, updated_at}]' > /tmp/nba_totals_settlement_runs.json
          python - <<'PY' > /tmp/nba_totals_settlement_run_counts.txt
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          runs = json.loads(Path("/tmp/nba_totals_settlement_runs.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          active = 0
          recent_successful = 0
          for run in runs:
              if run.get("status") in {"queued", "in_progress"}:
                  active += 1
                  continue
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  continue
              try:
                  updated = datetime.fromisoformat(str(run.get("updated_at", "")).replace("Z", "+00:00"))
                  if updated.tzinfo is None:
                      updated = updated.replace(tzinfo=timezone.utc)
                  age_minutes = (now - updated.astimezone(timezone.utc)).total_seconds() / 60
                  if -2 <= age_minutes <= 10:
                      recent_successful += 1
              except (TypeError, ValueError):
                  continue
          print(active, recent_successful)
          PY
          read -r active_settlement_runs recent_successful_settlement_runs < /tmp/nba_totals_settlement_run_counts.txt
          echo "Active official ESPN settlement runs: $active_settlement_runs"
          echo "Successful ESPN settlement runs completed within 10 minutes: $recent_successful_settlement_runs"

          if [ "$added" -gt 0 ]; then
            if [ "$active_settlement_runs" -gt 0 ] || [ "$recent_successful_settlement_runs" -gt 0 ]; then
              echo "Skipping redundant official ESPN settlement dispatch; a settlement run is active or completed recently."
            elif python - "$ledger_age_minutes" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= 10 else 1)
          PY
            then
              gh workflow run nba-totals-settlement.yml --ref main -f capture_triggered=true
              echo "Dispatched official ESPN settlement because the ledger is at least ten minutes old and no recent settlement run exists."
            else
              echo "The official ESPN ledger is fresh; the event-driven settlement gate will avoid redundant reconciliation."
            fi
            gh workflow run nba-totals-probability-value.yml --ref main
            echo "Dispatched probability/value research after new immutable quote evidence."
          else
            echo "No new immutable quote snapshots; no event-driven settlement/report dispatch needed."
          fi
