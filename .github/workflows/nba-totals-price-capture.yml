name: NBA totals SportyBet market-225 price capture

on:
  schedule:
    # Re-arm schedule delivery after the observed multi-hour gap. The 15-minute
    # quote-freshness contract and event-driven recovery remain unchanged.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  workflow_run:
    # Live Expansion is the upstream writer for NBA forecast/publication snapshots.
    # Board, Builder, and Pages completions do not change data/nba_predictions.json;
    # recapturing on those events creates duplicate quote revisions and report-publish contention.
    # API-code changes still trigger via push paths; the ten-minute schedule remains the fallback.
    workflows:
      - "Match Signal Live Expansion"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nba_totals_prices.py'
      - 'scripts/nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_price_capture.py'
      - 'scripts/test_nba_sportybet_totals.py'
      - 'functions/api/sportybet-basketball.js'
      - '.github/workflows/nba-totals-price-capture.yml'

permissions:
  actions: write
  contents: write

concurrency:
  # GitHub permits only one pending run per concurrency group. Keep the cron
  # lane separate so event-driven board/Builder completions cannot replace it.
  group: nba-totals-price-capture-${{ github.event_name == 'schedule' && 'scheduled' || 'event-driven' }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Compile capture code and run regression tests
        run: |
          python -m py_compile scripts/capture_nba_totals_prices.py scripts/nba_totals_walk_forward.py scripts/test_nba_totals_price_capture.py scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_price_capture.py
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/capture_nba_totals_prices.py").read_text(encoding="utf-8")
          assert "nba_totals_oos_value_test.json" not in source
          assert "REPORT.write_text" not in source
          print("PASS: quote capture does not publish OOS/probability reports.")
          PY

      - name: Capture fresh SportyBet market-225 pairs and update the totals audit
        run: PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py

      - name: Verify capture status without rewriting OOS research reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          assert status.get("paper_only") is True
          assert status.get("model_version") == "nba-total-v5.1-pace-efficiency-calibrated"
          assert status.get("checked_at")
          assert isinstance(status.get("feed_events"), int)
          assert isinstance(status.get("feed_events_with_market_225"), int)
          assert isinstance(status.get("immutable_snapshots_added"), int)
          print("Capture status verified; OOS/probability reports are published by the dedicated research workflow.")
          PY

      - name: Publish immutable price snapshots and capture status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_price_capture_status.json
          if git diff --cached --quiet; then
            echo 'No fresh market-225 price or audit changes to publish.'
            exit 0
          fi
          git commit -m 'Capture immutable SportyBet NBA totals market-225 prices'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'NBA totals market-225 snapshot publication succeeded.'
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py
              git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_price_capture_status.json
              if git diff --cached --quiet; then
                echo 'Latest main already contains the current market-225 capture.'
                exit 0
              fi
              git commit -m 'Refresh SportyBet NBA totals market-225 price capture'
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish NBA totals price capture after retries.' >&2
          exit 1

      - name: Dispatch NBA probability/value refresh when new immutable quotes were added
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          added="$(python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/nba_totals_price_capture_status.json").read_text(encoding="utf-8"))
          print(int(status.get("immutable_snapshots_added") or 0))
          PY
          )"
          echo "New immutable SportyBet market-225 snapshots: $added"
          if [ "$added" -gt 0 ]; then
            gh workflow run nba-totals-probability-value.yml --ref main
            echo "Dispatched probability/value research after new immutable quote evidence."
          else
            echo "No new immutable quote snapshots; no report refresh dispatch needed."
          fi
