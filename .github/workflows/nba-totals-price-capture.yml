name: NBA totals SportyBet market-225 price capture

on:
  schedule:
    # Capture independently of the full prediction rebuild every 15 minutes, keeping
    # market quotes within the 15-minute audit window without rebuilding history.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nba_totals_prices.py'
      - 'scripts/test_nba_totals_price_capture.py'
      - '.github/workflows/nba-totals-price-capture.yml'

permissions:
  contents: write

concurrency:
  group: nba-totals-price-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Compile capture code and run regression tests
        run: |
          python -m py_compile scripts/capture_nba_totals_prices.py scripts/test_nba_totals_price_capture.py
          PYTHONPATH=scripts python scripts/test_nba_totals_price_capture.py

      - name: Capture fresh SportyBet market-225 pairs and update the totals audit
        run: PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py

      - name: Publish immutable price snapshots and capture status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_oos_value_test.json data/nba_totals_price_capture_status.json
          if git diff --cached --quiet; then
            echo 'No fresh market-225 price or audit changes to publish.'
            exit 0
          fi
          git commit -m 'Capture immutable SportyBet NBA totals market-225 prices'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'NBA totals market-225 snapshot publication succeeded.'
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py
              git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_oos_value_test.json data/nba_totals_price_capture_status.json
              if git diff --cached --quiet; then
                echo 'Latest main already contains the current market-225 capture.'
                exit 0
              fi
              git commit -m 'Refresh SportyBet NBA totals market-225 price capture'
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish NBA totals price capture after retries.' >&2
          exit 1
