name: NBA totals SportyBet market-225 price capture

on:
  schedule:
    # Capture independently of the full prediction rebuild every 15 minutes, keeping
    # market quotes within the 15-minute audit window without rebuilding history.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    # Re-capture after a model/line refresh, final Builder promotion, or board refresh.
    # None of these upstream workflows listens for capture completion, so this cannot form a loop.
    workflows:
      - "Match Signal Live Expansion"
      - "Match Signal Unified Upcoming Board"
      - "Match Signal Builder Production Promotion"
      - "Deploy Match Signal to Cloudflare Pages"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nba_totals_prices.py'
      - 'scripts/nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_walk_forward.py'
      - 'scripts/test_nba_totals_price_capture.py'
      - 'scripts/live_expansion_pipeline.py'
      - 'scripts/test_nba_sportybet_totals.py'
      - 'functions/api/sportybet-basketball.js'
      - '.github/workflows/nba-totals-price-capture.yml'

permissions:
  contents: write

concurrency:
  group: nba-totals-price-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Compile capture code and run regression tests
        run: |
          python -m py_compile scripts/capture_nba_totals_prices.py scripts/nba_totals_walk_forward.py scripts/test_nba_totals_price_capture.py scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_walk_forward.py
          PYTHONPATH=scripts python scripts/test_nba_totals_price_capture.py

      - name: Capture fresh SportyBet market-225 pairs and update the totals audit
        run: PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py

      - name: Verify regenerated fixed-cutoff evaluation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/nba_totals_oos_value_test.json").read_text(encoding="utf-8"))
          expected = "2026-11-02T02:00:00+00:00"
          assert report.get("evaluation_type") == "NBA_TOTALS_FIXED_CUTOFF_V2"
          assert report.get("holdout_protocol", {}).get("fixed_cutoff_utc") == expected
          audit = report.get("market_record_audit")
          assert isinstance(audit, list), "per-fixture market audit is missing"
          ids = [row.get("event_id") for row in audit]
          assert len(ids) == len(set(ids)), "a fixture was counted more than once"
          assert report.get("market_overall", {}).get("roi_ci_method", "").startswith("deterministic fixture-level percentile bootstrap")
          assert report.get("paper_only") is True
          print("Fixed cutoff:", expected)
          print("Verified market records:", len(audit))
          print("Market holdout bets:", report.get("market_holdout", {}).get("n"))
          print("Release decision:", report.get("release_decision"))
          PY

      - name: Publish immutable price snapshots and capture status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_oos_value_test.json data/nba_totals_price_capture_status.json
          if git diff --cached --quiet; then
            echo 'No fresh market-225 price or audit changes to publish.'
            exit 0
          fi
          git commit -m 'Capture immutable SportyBet NBA totals market-225 prices'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'NBA totals market-225 snapshot publication succeeded.'
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              PYTHONPATH=scripts python scripts/capture_nba_totals_prices.py
              git add data/nba_predictions.json data/nba_totals_publication_snapshots.json data/nba_totals_oos_value_test.json data/nba_totals_price_capture_status.json
              if git diff --cached --quiet; then
                echo 'Latest main already contains the current market-225 capture.'
                exit 0
              fi
              git commit -m 'Refresh SportyBet NBA totals market-225 price capture'
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish NBA totals price capture after retries.' >&2
          exit 1
