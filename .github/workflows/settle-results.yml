name: Match Signal Result Settlement

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-signal-settlement
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle completed football and tennis fixtures
        run: python scripts/settle_same_day.py

      - name: Commit newly settled results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/prediction_history.json data/accuracy.json
          if git diff --cached --quiet; then
            echo "No newly settled results."
            exit 0
          fi
          git commit -m "🤖 Record completed Match Signal results"
          git push origin main
