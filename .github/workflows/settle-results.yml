name: Match Signal Result Settlement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/settle_same_day.py'
      - '.github/workflows/settle-results.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: match-signal-pipeline
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Settle completed football and tennis fixtures
        run: python scripts/settle_same_day.py

      - name: Commit newly settled results
        id: commit-results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_history.json data/accuracy.json
          if git diff --cached --quiet; then
            echo "No newly settled results."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🤖 Record completed Match Signal results"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup GitHub Pages
        if: steps.commit-results.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Inject live match timer
        if: steps.commit-results.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./live-timer.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              path.write_text(text, encoding='utf-8')
          print('Live timer injected into index.html')
          PY

      - name: Upload site artifact
        if: steps.commit-results.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.commit-results.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
