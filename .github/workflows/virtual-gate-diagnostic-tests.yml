name: Virtual gate diagnostic contract tests

on:
  pull_request:
    paths:
      - 'scripts/test_live_virtual_quote_coverage.mjs'
      - 'scripts/test_virtual_gate_diagnostic_contract.mjs'
      - '.github/workflows/virtual-gate-diagnostic-tests.yml'
      - 'sport-hubs.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check diagnostic JavaScript syntax
        run: node --check scripts/test_live_virtual_quote_coverage.mjs
      - name: Check virtual qualification diagnostic contract
        run: node scripts/test_virtual_gate_diagnostic_contract.mjs
