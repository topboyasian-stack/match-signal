name: NBA totals settlement ledger
on:
  schedule:
    # Stagger backup reconciliation between price captures; successful capture completion
    # also triggers settlement immediately.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
  workflow_run:
    # Backup reconciliation after successful exact-market price capture. Cron remains the normal cadence.
    workflows:
      - "NBA totals SportyBet market-225 price capture"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/settle_nba_totals.py'
      - 'scripts/test_settle_nba_totals.py'
      - '.github/workflows/nba-totals-settlement.yml'
permissions:
  actions: write
  contents: write
concurrency:
  # Keep the scheduled reconciliation lane independent of capture-triggered runs;
  # otherwise a pending cron run can be replaced by workflow_run queue churn.
  group: nba-totals-settlement-ledger-${{ github.event_name == 'schedule' && 'scheduled' || 'event-driven' }}
  cancel-in-progress: false
jobs:
  settle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install settlement-test dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Run settlement tests
        run: python scripts/test_settle_nba_totals.py
      - name: Gate duplicate capture-triggered settlement
        id: settlement_due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name != "workflow_run":
              print("run=true")
              print("reason=scheduled_manual_or_push")
              raise SystemExit(0)

          age_minutes = float("inf")
          try:
              ledger = json.loads(Path("data/nba_totals_ledger.json").read_text(encoding="utf-8"))
              updated = datetime.fromisoformat(str(ledger.get("updated_at", "")).replace("Z", "+00:00"))
              if updated.tzinfo is None:
                  updated = updated.replace(tzinfo=timezone.utc)
              age_minutes = (datetime.now(timezone.utc) - updated.astimezone(timezone.utc)).total_seconds() / 60
          except (OSError, ValueError, TypeError):
              pass

          should_run = age_minutes >= 10
          print(f"run={'true' if should_run else 'false'}")
          print(f"ledger_age_minutes={age_minutes:.2f}" if age_minutes != float("inf") else "ledger_age_minutes=unknown")
          print("reason=ledger_older_than_10_minutes" if should_run else "reason=ledger_refreshed_within_10_minutes")
          PY
      - name: Reconcile official final scores
        if: steps.settlement_due.outputs.run == 'true'
        run: python scripts/settle_nba_totals.py
      - name: Persist ledger with bounded concurrent-main retries
        id: persist
        if: steps.settlement_due.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate='/tmp/nba_totals_ledger_candidate.json'
          probability_candidate='/tmp/nba_totals_probability_settlements_candidate.json'
          cp data/nba_totals_ledger.json "$candidate"
          cp data/nba_totals_probability_settlements.json "$probability_candidate"

          # Main receives frequent board and Builder commits. Rebuild both settlement
          # artifacts on the newest main, never force-push or overwrite a newer ledger.
          for attempt in 1 2 3 4 5; do
            echo "Publishing NBA totals ledger (attempt ${attempt}/5)."
            git fetch origin main
            git reset --hard origin/main
            evidence_changed="$(python - "$candidate" "$probability_candidate" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from nba_totals_capture_watchdog import settlement_evidence_changed
          candidate_ledger = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate_probability = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          live_ledger = json.loads(Path("data/nba_totals_ledger.json").read_text(encoding="utf-8"))
          live_probability = json.loads(Path("data/nba_totals_probability_settlements.json").read_text(encoding="utf-8"))
          print("true" if settlement_evidence_changed(candidate_ledger, live_ledger, candidate_probability, live_probability) else "false")
          PY
            )"
            echo "Candidate adds new official settlement evidence: $evidence_changed"
            if python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          candidate=json.loads(Path('/tmp/nba_totals_ledger_candidate.json').read_text())
          path=Path('data/nba_totals_ledger.json')
          remote=json.loads(path.read_text()) if path.exists() else {}
          def parsed(value):
              try: return datetime.fromisoformat(str(value).replace('Z','+00:00'))
              except Exception: return None
          cand=parsed(candidate.get('updated_at'))
          live=parsed(remote.get('updated_at'))
          if cand and live and live >= cand:
              print('A newer/equal ledger is already published; preserving it.')
              raise SystemExit(10)
          PY
            then
              :
            else
              rc=$?
              if [ "$rc" -eq 10 ]; then exit 0; fi
              exit "$rc"
            fi

            cp "$candidate" data/nba_totals_ledger.json
            cp "$probability_candidate" data/nba_totals_probability_settlements.json
            git add data/nba_totals_ledger.json data/nba_totals_probability_settlements.json
            if git diff --cached --quiet; then
              echo "No NBA totals settlement artifact changes to publish."
              exit 0
            fi
            git commit -m 'Record verified NBA totals and probability settlements'
            if git push origin HEAD:main; then
              echo "NBA totals ledger publication succeeded."
              echo "changed=$evidence_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent main update detected; retrying on the latest main."
            sleep $((attempt * 2))
          done
          echo "NBA totals ledger could not publish after five retries." >&2
          exit 1

      - name: Dispatch probability/value report after new official settlement evidence
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nba-totals-probability-value.yml --ref main
          echo "Dispatched probability/value research after publishing new official ESPN settlement evidence."
