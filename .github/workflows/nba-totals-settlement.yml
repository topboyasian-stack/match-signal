name: NBA totals settlement ledger
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/settle_nba_totals.py'
      - 'scripts/test_settle_nba_totals.py'
      - '.github/workflows/nba-totals-settlement.yml'
permissions:
  contents: write
concurrency:
  group: nba-totals-settlement-ledger
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Run settlement tests
        run: python scripts/test_settle_nba_totals.py
      - name: Reconcile official final scores
        run: python scripts/settle_nba_totals.py
      - name: Persist ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba_totals_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record verified NBA totals settlements'
          git push origin HEAD:main
