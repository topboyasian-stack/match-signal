name: Deploy Match Signal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live-timer.js'
      - 'nav-fix.js'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-13-nav-fix-v2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install hard navigation fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="./nav-fix.js"></script>'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              marker = '<style id="match-signal-nav-fix">'
              style = marker + '.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:9999;cursor:pointer!important;touch-action:manipulation}</style>'
              if marker not in text:
                  text = text.replace('</head>', style + '</head>', 1)
              path.write_text(text, encoding='utf-8')
              print(f'Navigation fallback installed: {path}')
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
