name: Deploy Match Signal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live-timer.js'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-13-nav-fix"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix navigation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = 'https://topboyasian-stack.github.io/match-signal/'
          routes = {
              './index.html?sport=football': base + 'index.html?sport=football',
              './index.html?sport=tennis': base + 'index.html?sport=tennis',
              './basketball.html': base + 'basketball.html',
              './performance.html': base + 'performance.html',
              './': base,
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in routes.items():
                  text = text.replace(f'href="{old}"', f'href="{new}"')
                  text = text.replace(f"href='{old}'", f"href='{new}'")
              # Make the dashboard navigation immune to accidental pointer-event overrides.
              marker = '<style id="match-signal-nav-fix">'
              style = marker + '.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:20;cursor:pointer!important}</style>'
              if marker not in text:
                  text = text.replace('</head>', style + '</head>', 1)
              path.write_text(text, encoding='utf-8')
              print(f'Navigation fixed: {path}')
          PY

      - name: Inject live match timer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./live-timer.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              path.write_text(text, encoding='utf-8')
          print('Live timer injected into index.html')
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
