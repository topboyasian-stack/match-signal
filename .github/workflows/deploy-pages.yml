name: Deploy Match Signal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'expansion.html'
      - 'performance.html'
      - 'basketball.html'
      - 'tennis.html'
      - 'live.html'
      - 'research.html'
      - 'live-analysis.js'
      - 'live-data-worker.js'
      - 'live-timer.js'
      - 'nav-fix.js'
      - 'metrics-fix.js'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/tennis_pipeline.yml'
      - 'scripts/virtual_lab_sync.py'
      - '.github/workflows/virtual-lab-sync.yml'
  workflow_run:
    workflows:
      - "Match Signal Autopilot Refresh"
      - "Match Signal Live Expansion"
      - "Match Signal Post-Pipeline Live Feed Reconcile"
      - "Match Signal Saudi Pro League Live Experimental"
      - "Match Signal Odds Builder"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MATCH_SIGNAL_DEPLOY_REV: "2026-09-15-live-coverage-v3"

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install lightweight navigation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              src='./nav-fix.js'
              tag=f'<script src="{src}"></script>'
              if tag not in text:
                  text=text.replace('</body>',tag+'\n</body>',1)
              marker='<style id="match-signal-nav-fix">'
              style=marker+'.tabs a,.nav a{pointer-events:auto!important;position:relative;z-index:9999;cursor:pointer!important;touch-action:manipulation}</style>'
              if marker not in text:
                  text=text.replace('</head>',style+'</head>',1)
              path.write_text(text,encoding='utf-8')
              print(f'Lightweight navigation fix installed: {path}')
          PY
      - name: Verify site entrypoint and data
        run: |
          test -s index.html
          test -s expansion.html
          test -s basketball.html
          test -s performance.html
          test -s live.html
          test -s research.html
          test -s live-analysis.js
          test -s live-data-worker.js
          test -s virtual-lab.js
          test -s virtual-lab.css
          test -s data/predictions.json
          test -s data/virtual_lab_live.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/predictions.json').read_text())
          assert isinstance(rows,list) and rows, 'prediction feed is empty'
          leagues=sorted({str(r.get('league')) for r in rows if r.get('league')})
          print(f'Prediction rows: {len(rows)}')
          print(f'Leagues: {leagues}')
          assert any(r.get('sport')=='football' for r in rows), 'no football rows in deploy artifact'
          assert any(r.get('sport')=='tennis' for r in rows), 'no tennis rows in deploy artifact'
          PY
          echo "Live page present: $(wc -c < live.html) bytes"
          echo "Prediction feed present: $(wc -c < data/predictions.json) bytes"
          echo "Virtual Lab live snapshot present: $(wc -c < data/virtual_lab_live.json) bytes"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/virtual_lab_live.json').read_text())
          assert d.get('status') == 'LIVE', f"virtual lab snapshot status={d.get('status')}"
          assert int(d.get('events_count',0)) > 0, "virtual lab snapshot is empty"
          print(f"Virtual Lab snapshot: {d.get('events_count')} events / {d.get('product_counts')}")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live Virtual Lab source and deployed page
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          const api='https://match-signal.pages.dev/api/sportybet-virtual-virtual';
          const qs=new URLSearchParams({
            sportId:'sr:sport:1',
            marketId:'1,18,10,29,11,26,36,14,60100,186,189,202,204,210',
            pageSize:'100',
            pageNum:'1',
            todayGames:'false',
            timeline:'168',
            _t:String(Date.now())
          });
          const apiResponse=await fetch(api+'?'+qs.toString(),{cache:'no-store'});
          if(!apiResponse.ok) throw new Error('Cloudflare live proxy HTTP '+apiResponse.status);
          const payload=await apiResponse.json();
          const tournaments=payload?.data?.tournaments||[];
          const virtual=tournaments.flatMap(t=>(t.events||[]).map(e=>({t:String(t.name||''),c:String(t.categoryName||''),h:String(e.homeTeamName||''),a:String(e.awayTeamName||'')})))
            .filter(e=>/simulated reality|\bsrl\b|gt sports league|gt leagues|eadriatic|efootball|e soccer|esoccer|virtual football|zoom|turbo/i.test(e.t+' '+e.c+' '+e.h+' '+e.a));
          if(payload.bizCode!==10000) throw new Error('Cloudflare live proxy bizCode '+payload.bizCode);
          if(!virtual.length) throw new Error('Cloudflare live proxy returned no virtual/eFootball/SRL events');
          console.log('Cloudflare live source OK:',virtual.length,'matching events:',payload.product_counts||{});
          const page=await fetch('https://topboyasian-stack.github.io/match-signal/research.html?smoke='+Date.now(),{cache:'no-store'});
          const body=await page.text();
          if(!page.ok) throw new Error('GitHub Pages Virtual Lab HTTP '+page.status);
          for(const marker of ['Virtual Lab','liveGrid','LIVE_API']) if(!body.includes(marker)) throw new Error('GitHub Pages research page missing '+marker);
          console.log('GitHub Pages Virtual Lab page OK');
          NODE

      - name: Record GitHub Pages production verification
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('DEPLOY-VERIFY-GITHUB-PAGES.json').write_text(json.dumps({
            'status':'VERIFIED',
            'provider':'GitHub Pages',
            'source_commit':'$GITHUB_SHA',
            'verified_at':datetime.now(timezone.utc).isoformat(),
            'checks':['core_pages','research_virtual_lab','live_virtual_proxy','virtual_lab_live_snapshot']
          },indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOY-VERIFY-GITHUB-PAGES.json
          git commit -m "✅ Record GitHub Pages production verification"
          git push origin main
