<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Signal — Live Prediction Desk</title>
<style>
:root{--bg:#080b13;--panel:#111624;--panel2:#171d2d;--border:#283049;--text:#eef1fb;--muted:#8f98b8;--accent:#7c8bff;--green:#35d49a;--amber:#f4c15d;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#11182a 0,#080b13 45%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1240px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#2dd4bf);font-size:22px}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0;color:var(--muted)}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer;text-decoration:none}.btn:hover,.btn.active{border-color:var(--accent);background:var(--accent);color:#fff}.status,.panel,.metric{background:var(--panel);border:1px solid var(--border);border-radius:15px}.status{margin:20px 0;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.statusLeft{display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.dot.bad{background:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.metric{padding:15px}.metric small{color:var(--muted);text-transform:uppercase;font-size:11px}.metric strong{display:block;font-size:23px;margin-top:5px}.panel{padding:15px;margin-bottom:18px}.panel h2{font-size:13px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}.filters select{background:#0b0f1a;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}.card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:15px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.teams{font-size:16px;font-weight:800;margin-bottom:10px}.team{display:flex;justify-content:space-between;margin:7px 0}.bar{height:7px;background:#2a3248;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#2dd4bf)}.xgline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.pick{margin-top:13px;padding:10px;border-radius:9px;background:#7c8bff18;border:1px solid #7c8bff35}.confidence{float:right;color:var(--green)}.analytics{margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}.analyticsHead{display:flex;justify-content:space-between;text-transform:uppercase;color:var(--muted);font-size:11px;font-weight:800}.analyticsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.market{border:1px solid var(--border);background:#0e1320;border-radius:10px;padding:9px}.marketTitle{font-size:10px;text-transform:uppercase;color:var(--muted)}.marketValue{font-weight:800;margin-top:3px}.marketSub{font-size:11px;color:var(--muted);margin-top:2px}.signal{color:var(--green)}.quality{margin-top:8px;color:var(--muted);font-size:11px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}.log{margin:0;max-height:150px;overflow:auto;color:var(--muted);font:12px ui-monospace,monospace}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.analyticsGrid{grid-template-columns:1fr}.status{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">📡</div><div><h1>Match Signal</h1><p>Live Football + Tennis + Basketball analytical prediction desk</p></div></div><nav class="tabs"><a id="footballTab" class="btn" href="./index.html?sport=football">⚽ Football</a><a id="tennisTab" class="btn" href="./index.html?sport=tennis">🎾 Tennis</a><a class="btn" href="./basketball.html">🏀 Basketball</a><a class="btn" href="./performance.html">📊 Performance</a></nav></header>
<section class="status"><div class="statusLeft"><span id="dot" class="dot"></span><div><b id="statusText">Loading live pipeline data</b><div id="updated" style="color:var(--muted)">Reading generated prediction files…</div></div></div><button id="refresh" class="btn">↻ Refresh data</button></section>
<section class="metrics"><div class="metric"><small>Active predictions</small><strong id="count">—</strong></div><div class="metric"><small>Tracked accuracy</small><strong id="accuracy">—</strong></div><div class="metric"><small>Settled picks</small><strong id="settled">—</strong></div><div class="metric"><small>Brier score</small><strong id="brier">—</strong></div></section>
<section class="panel"><h2>Desk controls</h2><div class="filters"><button id="all" class="btn active">All</button><button id="high" class="btn">High confidence ≥65%</button><button id="medium" class="btn">Medium 55–65%</button><select id="league"><option value="all">All competitions</option></select><select id="sort"><option value="time">Start time</option><option value="confidence">Confidence</option></select></div></section>
<section id="grid" class="grid"></section>
<section class="panel" style="margin-top:18px"><h2>Pipeline monitor</h2><ul id="log" class="log"></ul></section>
</div>
<script>
(function(){
'use strict';
const state={sport:new URLSearchParams(location.search).get('sport')==='tennis'?'tennis':'football',level:'all',predictions:[],accuracy:null,status:null};
const $=id=>document.getElementById(id);
const esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};
const pct=v=>Math.round((Number(v)||0)*100)+'%';
const date=v=>{const d=new Date(v);return isNaN(d.getTime())?String(v||'—'):d.toLocaleString()};
function log(msg){const li=document.createElement('li');li.textContent=new Date().toLocaleTimeString()+' — '+msg;$('log').prepend(li)}
function setActive(){ $('footballTab').classList.toggle('active',state.sport==='football');$('tennisTab').classList.toggle('active',state.sport==='tennis');['all','high','medium'].forEach(x=>$(x).classList.toggle('active',state.level===x)); }
function populate(){const sel=$('league'),old=sel.value,vals=[...new Set(state.predictions.filter(p=>p.sport===state.sport&&p.league).map(p=>p.league))].sort();sel.innerHTML='<option value="all">All competitions</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vals.includes(old))sel.value=old}
function footballAnalytics(p){const m=p.markets||{},ou=m.over_under||{},bt=m.btts||{},h=p.handicap||{},eg=p.expected_goals||{};return '<div class="analytics"><div class="analyticsHead"><span>Football analytics</span><span>Model-derived markets</span></div><div class="analyticsGrid"><div class="market"><div class="marketTitle">Expected goals</div><div class="marketValue">'+esc(eg.p1!=null?p.player_1+' '+Number(eg.p1).toFixed(2):'—')+' · '+esc(eg.p2!=null?p.player_2+' '+Number(eg.p2).toFixed(2):'—')+'</div><div class="marketSub">Total '+esc(eg.total!=null?Number(eg.total).toFixed(2):'—')+'</div></div><div class="market"><div class="marketTitle">Goals O/U</div><div class="marketValue signal">'+esc(ou.pick?ou.pick.toUpperCase()+' '+(ou.line??''): '—')+'</div><div class="marketSub">'+(ou.line!=null?pct(ou.over)+' over · '+pct(ou.under)+' under':'No qualified total market')+'</div></div><div class="market"><div class="marketTitle">BTTS</div><div class="marketValue">'+esc(bt.pick?('BTTS '+bt.pick.toUpperCase()):'—')+'</div><div class="marketSub">'+(bt.yes!=null?pct(bt.yes)+' yes · '+pct(bt.no)+' no':'No BTTS signal')+'</div></div><div class="market"><div class="marketTitle">Handicap</div><div class="marketValue">'+(h.line!=null?esc((h.line>0?'+':'')+h.line)+' · '+pct(h.home_cover)+' home':'—')+'</div><div class="marketSub">'+(h.line!=null?pct(h.away_cover)+' away cover':'No handicap signal')+'</div></div></div></div>'}
function tennisAnalytics(p){const a=p.analytics||{},g=a.total_games||{},s=a.set_win_prob||{},q=p.signal_quality||{};return '<div class="analytics"><div class="analyticsHead"><span>Tennis analytics</span><span>Model-derived markets</span></div><div class="analyticsGrid"><div class="market"><div class="marketTitle">Set win probability</div><div class="marketValue">'+pct(s.p1)+' · '+pct(s.p2)+'</div><div class="marketSub">'+esc(p.player_1)+' / '+esc(p.player_2)+'</div></div><div class="market"><div class="marketTitle">Straight sets</div><div class="marketValue">'+pct(a.straight_sets&&a.straight_sets.p1)+' · '+pct(a.straight_sets&&a.straight_sets.p2)+'</div><div class="marketSub">Three sets '+pct(a.three_sets)+'</div></div><div class="market"><div class="marketTitle">Games O/U</div><div class="marketValue signal">'+esc(g.pick?(g.pick.toUpperCase()+' '+(g.line??'')):'—')+'</div><div class="marketSub">'+(g.line!=null?pct(g.over)+' over · '+pct(g.under)+' under':'No qualified total signal')+'</div></div><div class="market"><div class="marketTitle">Games handicap</div><div class="marketValue">'+esc(a.games_handicap&&a.games_handicap.pick?a.games_handicap.pick.toUpperCase():'—')+'</div><div class="marketSub">Estimated margin '+esc(a.games_handicap&&a.games_handicap.estimated_margin_p1!=null?a.games_handicap.estimated_margin_p1:'—')+' · Signal '+esc((q.components||0)+'/5')+'</div></div></div></div>'}
function card(p){const pr=p.probabilities||{},isFootball=p.sport==='football';const names=isFootball?[p.player_1,'Draw',p.player_2]:[p.player_1,p.player_2];const probs=isFootball?[pr.p1,pr.draw,pr.p2]:[pr.p1,pr.p2];const rows=names.map((n,i)=>'<div class="team"><span>'+esc(n)+'</span><b>'+pct(probs[i])+'</b></div><div class="bar"><div class="fill" style="width:'+Math.round((Number(probs[i])||0)*100)+'%"></div></div>').join('');const pick=p.pick==='p1'?p.player_1:p.pick==='p2'?p.player_2:'Draw';const xg=isFootball&&p.expected_goals?'<div class="xgline"><span>xG '+esc(p.expected_goals.p1!=null?p.expected_goals.p1:'—')+' — '+esc(p.expected_goals.p2!=null?p.expected_goals.p2:'—')+'</span><span>'+esc(p.model||'Model-derived')+'</span></div>':'';return '<article class="card"><div class="meta"><span>'+esc(p.league||p.sport)+(p.round?' · '+esc(p.round):'')+'</span><span>'+date(p.start_time)+'</span></div><div class="teams">'+esc(p.player_1)+' <span style="color:var(--muted);font-weight:500">vs</span> '+esc(p.player_2)+'</div>'+rows+xg+'<div class="pick">Model pick: <b>'+esc(pick)+'</b><span class="confidence">'+pct(p.confidence)+' confidence</span></div>'+(isFootball?footballAnalytics(p):tennisAnalytics(p))+'</article>'}
function render(){let list=state.predictions.filter(p=>p.sport===state.sport);const league=$('league').value;if(league!=='all')list=list.filter(p=>p.league===league);if(state.level==='high')list=list.filter(p=>(Number(p.confidence)||0)>=.65);if(state.level==='medium')list=list.filter(p=>(Number(p.confidence)||0)>=.55&&(Number(p.confidence)||0)<.65);list.sort((a,b)=>$('sort').value==='confidence'?(b.confidence||0)-(a.confidence||0):new Date(a.start_time)-new Date(b.start_time));$('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No '+esc(state.sport)+' predictions match the current filters.</div>';$('count').textContent=list.length}
async function get(path){const u=new URL('./'+path,location.href);u.searchParams.set('v',Date.now());const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error(path+' returned HTTP '+r.status);return r.json()}
async function refresh(){const b=$('refresh');b.disabled=true;$('statusText').textContent='Reading generated analytical files';try{const data=await Promise.all([get('data/predictions.json'),get('data/accuracy.json'),get('data/pipeline_status.json')]);state.predictions=Array.isArray(data[0])?data[0]:[];state.accuracy=data[1];state.status=data[2];populate();render();const s=state.accuracy&&state.accuracy.summary?state.accuracy.summary:{};$('accuracy').textContent=s.settled?((Number(s.accuracy)*100).toFixed(1)+'%'):'—';$('settled').textContent=String(s.settled??0);$('brier').textContent=s.settled?Number(s.brier_score).toFixed(3):'—';$('dot').classList.toggle('bad',(state.status.errors||[]).length>0);$('statusText').textContent=(state.status.errors||[]).length?'Pipeline has source warnings':'Pipeline healthy';$('updated').textContent='Last generated '+date(state.status.updated_at)+' · '+(state.status.data_source||'live source');log('Loaded '+state.status.football_count+' football + '+state.status.tennis_count+' tennis predictions.');}catch(e){$('dot').classList.add('bad');$('statusText').textContent='Generated data unavailable';$('updated').textContent=e.message;log('Refresh failed: '+e.message);$('grid').innerHTML='<div class="empty">Unable to load prediction data. Use Refresh data to retry.</div>'}finally{b.disabled=false}}
$('refresh').addEventListener('click',refresh);$('league').addEventListener('change',render);$('sort').addEventListener('change',render);[['all','all'],['high','high'],['medium','medium']].forEach(x=>$(x[0]).addEventListener('click',()=>{state.level=x[1];setActive();render()}));setActive();refresh();
})();
</script>
</body>
</html>
